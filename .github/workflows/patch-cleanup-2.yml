name: 教師ダッシュボードの片づけ 第2便

# 使い方：右の「Run workflow」で どの便を流すか を選んで実行する。
#   s6 → s7 → s8 の順に、1便ずつ流すこと（一度に全部やらない）。
#     s6 … A-6（押しても意味のなかった更新ボタン4つ）・B-3（ミッションを畳む）
#           ・C-3（児童メモの保存口を1つに）・E-2（6年1組を隠す）
#     s7 … C-4（実名の入れかたを画面入力1本に＋移行の道）・E-4（授業メモをカルテの材料へ）
#     s8 … D（上のタブを先生の仕事の順番へ並べ替え）
#
# 安全装置：
#   ・各パッチは src/index.tsx の配信チェーンが 158 件でないと中止する（fail-closed）。
#   ・あて先の文字列が1件でないときも中止する。
#   ・ビルド後、配信される教師画面・管理画面のJSを node --check にかける。
#     1つでも構文エラーが出たら、コミットもデプロイもしない。
#   ・bot のコミットは deploy.yml を発火させないので、最後に自分でデプロイを起動する。

on:
  workflow_dispatch:
    inputs:
      step:
        description: どの便を流すか（s6 → s7 → s8 の順に1便ずつ）
        required: true
        type: choice
        options:
          - s6
          - s7
          - s8

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッチを適用（チェーン158・あて先1件でなければ中止）
        run: python3 scripts/patch_cleanup_${{ github.event.inputs.step }}.py

      - name: ビルド
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      - name: 配信されるHTMLのJSを構文チェック（教師・管理・ログイン）
        run: |
          cat > /tmp/render-check.mjs <<'JSEOF'
          import fs from 'fs';
          import { execFileSync } from 'child_process';
          const mod = await import(process.cwd() + '/dist/_worker.js');
          const env = { ASSETS: { fetch: async () => new Response('', { status: 404 }) } };
          let bad = 0;
          for (const path of ['/teacher', '/admin', '/login', '/teacher-recovery']) {
            const res = await mod.default.fetch(new Request('http://localhost' + path), env, { waitUntil() {} });
            const html = await res.text();
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, i = 0, n = 0;
            while ((m = re.exec(html))) {
              i++;
              const attrs = m[1] || '', body = m[2] || '';
              if (/\bsrc\s*=/.test(attrs)) continue;
              if (/type\s*=\s*["']?(application\/json|text\/template)/i.test(attrs)) continue;
              n++;
              const tmp = '/tmp/_s' + i + '.js';
              fs.writeFileSync(tmp, body);
              try { execFileSync('node', ['--check', tmp], { stdio: 'pipe' }); }
              catch (e) { bad++; console.log('### SyntaxError ' + path + ' script#' + i); console.log(String(e.stderr || '').split('\n').slice(0, 6).join('\n')); }
            }
            console.log(path + ': status ' + res.status + ', ' + html.length + ' chars, ' + n + ' inline scripts checked');
          }
          if (bad) { console.log('NG: ' + bad + ' script blocks have syntax errors'); process.exit(1); }
          console.log('OK: all inline scripts parse');
          JSEOF
          node /tmp/render-check.mjs

      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git diff --staged --quiet && echo "No changes" || (git commit -m "片づけ第2便 ${{ github.event.inputs.step }} を適用（チェーン158->158）" && git push)

      - name: デプロイを起動（botのコミットでは自動で動かないため）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
