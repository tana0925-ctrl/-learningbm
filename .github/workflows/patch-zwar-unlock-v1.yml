name: ZWAR_UNLOCK_V1 ゾンビ襲来の解禁をボタン側へ移す

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを掃除
        run: git checkout -- .

      - name: 最新を取り込む
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - name: 本番の配信HTMLでアンカーを数える（GETのみ）
        run: |
          curl -sS --max-time 90 -o /tmp/prod.html https://learning-bm.pages.dev/ || echo 'FETCH FAILED'
          ls -l /tmp/prod.html || true
          python3 - << 'PYEOF'
          import importlib.util, os, sys
          p = '/tmp/prod.html'
          if not os.path.exists(p):
              print('WARN: honban HTML fetch failed (skip)')
              sys.exit(0)
          h = open(p, encoding='utf-8', errors='replace').read()
          sp = importlib.util.spec_from_file_location('zw', 'scripts/patch_zwar_unlock_v1.py')
          m = importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)
          bad = False
          for nm, t in [('A', m.A_OLD), ('B', m.B_OLD), ('C', m.C_ANCHOR)]:
              n = h.count(t)
              print('PROD', nm, n)
              if n > 1:
                  print('NG: prod anchor not unique', nm, n)
                  bad = True
          if bad:
              sys.exit(1)
          print('PROD ANCHOR CHECK DONE')
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_zwar_unlock_v1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        run: python3 scripts/patch_zwar_unlock_v1.py

      - name: 検証（番兵とは別の条件で確かめる）
        run: |
          python3 - << 'PYEOF'
          import importlib.util, subprocess, sys
          sp = importlib.util.spec_from_file_location('zw', 'scripts/patch_zwar_unlock_v1.py')
          m = importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)

          s = open('src/index.tsx', encoding='utf-8').read()
          h = open('public/index.html', encoding='utf-8').read()
          corpus = m.read_corpus()

          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('replace chain:', n)

          ok = True

          if n != m.CHAIN_AFTER:
              print('NG: chain', n, 'want', m.CHAIN_AFTER)
              ok = False

          for nm, want in [('_zwA1', 3), ('_zwB1', 3), ('_zwC1', 3), ('_zwA2', 2), ('_zwB2', 2), ('_zwC2', 2)]:
              if s.count(nm) != want:
                  print('NG:', nm, s.count(nm), 'want', want)
                  ok = False

          for nm, t in [('A', m.A_OLD), ('B', m.B_OLD), ('C', m.C_ANCHOR)]:
              if h.count(t) != 1:
                  print('NG: public/index.html', nm, h.count(t))
                  ok = False
          if m.SENTINEL in h:
              print('NG: sentinel leaked into public/index.html')
              ok = False
          if subprocess.call(['git', 'diff', '--quiet', '--', 'public/index.html']) != 0:
              print('NG: public/index.html was modified')
              ok = False

          old = subprocess.check_output(['git', 'show', 'HEAD:src/index.tsx']).decode('utf-8')
          blk = m.build_block()
          if s.replace(blk, '', 1) != old:
              print('NG: something other than the added block changed')
              ok = False
          else:
              print('OK: only the added block changed in src')

          for k in m.KEEP:
              if k not in corpus:
                  print('NG: marker lost', k)
                  ok = False
              if s.count(k) != old.count(k):
                  print('NG: marker count changed', k, old.count(k), '->', s.count(k))
                  ok = False
          print('KEEP markers checked:', len(m.KEEP))

          print('ensureDefenseTables() src:', s.count('ensureDefenseTables()'), 'old:', old.count('ensureDefenseTables()'))
          print('stage - 1 :', s.count('stage - 1'), 'old:', old.count('stage - 1'))
          print('stage-1 :', s.count('stage-1'), 'old:', old.count('stage-1'))

          lock = 'const isLocked = isZombie ? (pref.index >= zUnlocked) : (pref.index >= progress.unlocked);'
          if h.count(lock) != 1:
              print('NG: stage list lock check not found')
              ok = False
          if h.count('if(i >= maxUnlocked) return;') != 1:
              print('NG: selectWarStage gate not found')
              ok = False

          if not ok:
              sys.exit(1)
          print('VERIFY OK')
          PYEOF

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ビルドが通ることを確認
        run: |
          npm ci
          npm run build
          git checkout -- dist 2>/dev/null || true
          git clean -fdq dist 2>/dev/null || true
          echo '--- git status ---'
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/index.tsx; then
            echo 'no change (already applied)'; exit 0
          fi
          git add src/index.tsx
          git commit -m 'ZWAR_UNLOCK_V1: zombie unlock gate moved to the button (chain 89->92)'
          git pull --rebase origin main
          git push origin HEAD:main
