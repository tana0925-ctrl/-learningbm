name: ガチャ レア枠216-218 / 図鑑ジム416-419 / ガチャ回数の記録（GACHA_RARE_DEX_METRICS_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを 綺麗にする
        run: git checkout -- .

      - name: origin/main に 追いつく
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 流す直前に チェーンと あて先の 一意性を 実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          h = io.open('public/index.html', encoding='utf-8', newline='').read()
          if s.count("app.get('/', async (c) => {") != 1:
              print('NG: 家の入口が 一意で ない'); sys.exit(1)
          if s.count("app.get('/logout'") != 1:
              print('NG: 出口が 一意で ない'); sys.exit(1)
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('chain before =', n)
          io.open('/tmp/chain_before.txt', 'w').write(str(n))
          io.open('/tmp/gtrue.txt', 'w').write(str(h.count('gacha: true')) + ' ' + str(h.count('gacha: false')))
          if chr(13) in h:
              print('NG: public/index.html に CR が ある'); sys.exit(1)
          if 'GACHA_RARE_DEX_METRICS_V1' in h:
              print('すでに 当てずみ。以降の 検証は 当てた後の 形で 行う。'); sys.exit(0)
          anchors = [
              ('レア枠', 'if (stage === 4) candidates = MONSTERS.filter(m => m.id >= 201 && m.id <= 215);'),
              ('図鑑ジム', "if(id>=400 && id<=415) return 'ジムリーダー（ジムバトル）';"),
              ('recordGacha の定義', 'function recordGacha('),
              ('rollGacha の定義', 'function rollGacha('),
              ('GACHA_RARES', 'GACHA_RARES.forEach'),
              ('GYM_LEADER_IDS', '416,417,418,419]'),
          ]
          bad = False
          for label, t in anchors:
              c = h.count(t)
              if c != 1:
                  print('NG: あて先', label, 'が', c, '件（期待 1）'); bad = True
          if bad:
              sys.exit(1)
          print('あて先は すべて 一意')
          PYEOF

      - name: パッチを 適用（合わなければ 1文字も 書かずに 中止）
        run: python3 scripts/patch_gacha_rare218_v1.py

      - name: さわってはいけない ファイルが 無傷か
        run: |
          git diff --quiet -- src/index.tsx || (echo 'NG: src/index.tsx が 変わっている'; exit 1)
          git diff --quiet -- public/defense2.js || (echo 'NG: public/defense2.js が 変わっている'; exit 1)
          git diff --quiet -- migrations || (echo 'NG: migrations が 変わっている'; exit 1)
          git status --porcelain
          echo 'public/index.html 以外は 無傷'

      - name: ビルドが 通ることを 確認（通らなければ push しない）
        run: |
          npm install
          npm run build

      - name: 中身と 番兵を 確かめる
        run: |
          python3 - << 'PYEOF'
          import io, sys
          h = io.open('public/index.html', encoding='utf-8', newline='').read()
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          d = io.open('public/defense2.js', encoding='utf-8', newline='').read()
          before = int(io.open('/tmp/chain_before.txt').read().strip())
          gt, gf = io.open('/tmp/gtrue.txt').read().split()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          now = s[i:j].count('.replace(')
          ok = [True]
          def chk(label, got, want):
              if got != want:
                  print('NG:', label, 'が', got, '（期待', want, '）'); ok[0] = False
          if now != before:
              print('NG: チェーンが', before, '->', now); ok[0] = False
          else:
              print('チェーン', now, '件のまま（この直しは src に さわらない）')
          chk('新しいレア枠', h.count('m.id >= 201 && m.id <= 218'), 1)
          chk('古いレア枠が 消えた', h.count('m.id <= 215'), 0)
          chk('新しいジム範囲', h.count('if(id>=400 && id<=419)'), 1)
          chk('古いジム範囲が 消えた', h.count('id<=415'), 0)
          chk('recordGacha の 呼び出し', h.count('recordGacha(type, result);'), 2)
          chk('recordGacha の 定義', h.count('function recordGacha('), 1)
          chk('ノーマル 0.25% の しきい値', h.count('r < 0.9975'), 1)
          chk('プレミアム 2% の しきい値', h.count('r < 0.98)'), 1)
          chk('GACHA_RARES', h.count('GACHA_RARES.forEach'), 1)
          chk('GYM_LEADER_IDS', h.count('416,417,418,419]'), 1)
          chk('gacha: true の 数は そのまま', h.count('gacha: true'), int(gt))
          chk('gacha: false の 数は そのまま', h.count('gacha: false'), int(gf))
          chk('印', h.count('GACHA_RARE_DEX_METRICS_V1'), 4)
          for name in ('__DEFSTAGE_SENTINEL_V1__', '__DEF_MVP_V1__', 'DEF_LV50_V1', 'foeLaneMix',
                       '__S6WORLD_50__', '__H6MERGE_SRC_V1__', '__H6BANK_LIVE_V1__',
                       '__H6U11_BOOST_V1__', '__DEFBOSS_V1', 'HS_NEXT_RECALL_V1'):
              if name not in s:
                  print('NG: 番兵', name, 'が 消えている'); ok[0] = False
          for name in ('DEF2TRY_', 'DEF2SEND_GUARD_V1_MARK', 'DEF2TPL_LEARN_V1', 'DEF2TALLY_TREE_V2'):
              if name not in d:
                  print('NG: 番兵', name, 'が 消えている'); ok[0] = False
          if not ok[0]:
              sys.exit(1)
          print('VERIFY OK')
          PYEOF

      - name: ビルドの 副産物を 元に戻す（public/index.html だけ コミットする）
        run: |
          git checkout -- dist package-lock.json 2>/dev/null || true
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo '変更なし（すでに 当てずみ）'; exit 0
          fi
          git commit -m 'GACHA_RARE_DEX_METRICS_V1: レア枠216-218 / 図鑑ジム416-419 / ガチャ回数の記録'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 参考 ★6ぜんたいの 確率を 実測する（記録だけ。失敗しても 流れは 止めない）
        continue-on-error: true
        run: |
          node - << 'JSEOF'
          const fs = require('fs');
          const NL = String.fromCharCode(10);
          const h = fs.readFileSync('public/index.html', 'utf8');
          const rs = h.indexOf('function rollGacha(type) {');
          const gs = h.indexOf('function getRandomMonster(stage, level) {');
          const roleSrc = h.slice(rs, h.indexOf(NL + '        function ', rs + 10));
          const getSrc = h.slice(gs, h.indexOf(NL + '        function ', gs + 10));
          const MONSTERS = [];
          for (let id = 1; id <= 60; id++) MONSTERS.push({ id: id, stage: 1 });
          for (let id = 61; id <= 120; id++) MONSTERS.push({ id: id, stage: 2 });
          for (let id = 201; id <= 218; id++) MONSTERS.push({ id: id, stage: 1, rarity: 6, gacha: true });
          const f = new Function('MONSTERS', 'hidenRandomBookKeyPremium', 'hidenParseBookKey', 'hidenInvAdd',
            roleSrc + NL + getSrc + NL + 'return rollGacha;');
          const roll = f(MONSTERS, () => 'k', () => ({ rank: 'basic' }), () => {});
          const N = 200000;
          for (const type of ['normal', 'premium']) {
            let rare = 0; const seen = {};
            for (let k = 0; k < N; k++) {
              const r = roll(type);
              if (r.type === 'monster' && r.data.id >= 201 && r.data.id <= 218) { rare++; seen[r.data.id] = 1; }
            }
            console.log(type, '★6ぜんたい =', (rare * 100 / N).toFixed(4) + '%', '/ 出た種類 =', Object.keys(seen).length, '/ N =', N);
          }
          JSEOF
