      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'HSCHAT_V1' src/index.tsx) -ge 2
          grep -q "app.get('/hschat.js'" src/index.tsx
          grep -q '<script src="/hschat.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/weekref2.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/kantanref.js?v=1"></script>' src/index.tsx
          test -f public/hschat.js && test -f tests/hschat.test.mjs
          grep -q '家庭学習を阪神マンと対話しながらできるようになったで！' public/hschat.js
          ! grep -n -E "CREATE (TABLE|INDEX)|ALTER TABLE" public/hschat.js
          ! grep -n "localStorage" public/hschat.js | grep -v "try"
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: node -e "new Function(require('fs').readFileSync('public/hschat.js','utf8'))" && echo "ok public/hschat.js"
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts / child page)
        if: env.SKIP != '1'
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs
      - name: tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          npx esbuild src/viewas.ts --bundle --format=esm --platform=neutral --outfile=tests/viewas.mod.mjs --log-level=warning
          cd tests
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs 2>/dev/null | grep -E "^(PASS|FAIL)|passed"
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs > /dev/null 2>&1
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs 2>/dev/null | grep -E "passed"
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs > /dev/null 2>&1
          rm -f app.after.mjs viewas.mod.mjs
      - name: tests (child screen, served html + jsdom)
        if: env.SKIP != '1'
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          cat > /tmp/dump.mjs <<'JSEOF'
          import fs from 'fs'
          const mod = await import(process.cwd() + '/dist/_worker.js')
          const env = { ASSETS: { fetch: async (req) => { const u = new URL(typeof req === 'string' ? req : req.url); const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname; try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }) } catch (e) { return new Response('', { status: 404 }) } } } }
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} })
          const h = await res.text(); fs.writeFileSync('/tmp/served.html', h)
          if (h.indexOf('/hschat.js?v=1') < 0) { console.log('hschat.js が注入されていない'); process.exit(1) }
          const js = await mod.default.fetch(new Request('http://localhost/hschat.js'), env, { waitUntil() {} })
          if (js.status !== 200) { console.log('/hschat.js が配られない ' + js.status); process.exit(1) }
          console.log('served ' + h.length + ' / hschat.js 200')
          JSEOF
          node /tmp/dump.mjs
          HSCHAT_HTML=/tmp/served.html node tests/hschat.test.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/hschat.js tests/coin_ledger.test.mjs tests/hschat.test.mjs
          git commit -m "HSCHAT_V1: 💬阪神マンとはじめる家庭学習（今日なにやる→なんで→何分→タイマー〔時間で音と画面のお知らせ・延長・早めの終わりに候補さがし・一時停止〕→☀☁☂→なんで→次どうする→写真をつけていつもの提出）＋はじめて開いたときに1回だけお知らせ（見るだけモードは出さない）。いつものシートはそのまま・保存は既存の家庭学習の項目・コインは既存のまま（テスト53/53＋14/14＋11/11）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
