name: patch-hschat-v1

# HSCHAT_V1 💬 阪神マンと はじめる家庭学習（毎日の家庭学習を 対話で すすめる入口を足す）
#  ・いまの家庭学習シートは そのまま。入口「💬 阪神マンとはじめる」を 週の画面と 今日のシートの上に足す（どちらで出してもOK）
#  ・はじめる前：今日なにやるん？（カルテの🅰🅱／今週の計画／学校の宿題／アプリの修行／その他）→ なんで？ → 何分？ → タイマー開始
#  ・とちゅう：時間になったら 音と画面で「時間やで！まだやる？」（延長5分・10分／おわる）・早めの「おわる」→ ほかにやれること さがす・一時停止「緊急事態か！？」
#  ・おわったら：☀️☁️☂️ → なんで？ → 次もっといい天気にするには？ → おつかれさん！（写真をつけて いつもの提出）
#  ・保存は いつもの家庭学習の項目（todo・why・aim・minutes・end_weather・weather_reason・next_improve）。タイマーは いつもの下書きの開始時刻で計算（スリープ・画面切りかえ・閉じても続きから）
#  ・提出は いつもの hsSubmitAndExport() → /api/homework/submit（同じコイン・同じ返却。新しいコインの道なし・二重付与なし）
#  ・お知らせ：その子に1回だけ「家庭学習を阪神マンと対話しながらできるようになったで！」（端末に記録・見るだけモードでは出さない／記録しない）
#  ・新規: public/hschat.js（src/index.tsx に 配る道1行と </body> 注入1行を足すだけ。既存の .replace() 行は さわらない）。DDL なし。
#  ・テスト：coin_ledger 53/53（新2件）＋ viewas 14/14 ＋ hschat 11/11（配信されるHTMLの関数で）。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: apply patch (fail-closed)
        run: |
          if grep -q HSCHAT_V1 src/index.tsx; then echo "already applied"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
