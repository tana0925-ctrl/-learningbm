      - name: markers
        if: env.SKIP != '1'
        run: |
          grep -q "import { installViewAs } from './viewas'" src/index.tsx
          test $(grep -c 'installViewAs(app, { readSession, makeSession, getCookie, setCookie, deleteCookie })' src/index.tsx) -eq 1
          grep -q '<script src="/viewas-teacher.js?v=1"></script>' src/index.tsx
          grep -q 'VIEWAS_CLIENT_JS' src/viewas_client.ts
          ! grep -n "CREATE TABLE" src/viewas.ts
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/viewas-teacher.js scripts/viewas_client.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          npx esbuild src/viewas.ts --bundle --format=esm --platform=neutral --outfile=tests/viewas.mod.mjs --log-level=warning
          cd tests
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs 2>&1 | grep -E "^(PASS|FAIL)|passed|^   " 
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs > /dev/null 2>&1
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs 2>/dev/null | grep -E "passed"
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs > /dev/null 2>&1
          rm -f app.after.mjs viewas.mod.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx src/viewas.ts src/viewas_client.ts scripts/viewas_client.js scripts/apply_viewas_v1.py public/viewas-teacher.js migrations/0046_view_as_log.sql tests/viewas.test.mjs
          git commit -m "VIEWAS_V1: 👀子どもの画面に入る（見るだけ）先生が子どもを選ぶとその子と同じ画面を本物のデータで表示・保存は一切しない（サーバで書きこみ拒否＋読むだけDB／画面でも送信停止・ストレージ隔離）・帯と終わるボタン・60分で自動終了・担任は自分のクラスだけ・見た記録（migration 0046・テスト14/14＋46/46）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
