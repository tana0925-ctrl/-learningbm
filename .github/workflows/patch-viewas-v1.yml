name: patch-viewas-v1

# VIEWAS_V1 👀 子どもの画面に入る（見るだけ）
#  ・先生（管理者・担任）が子どもを1人えらぶと、その子と同じ画面がその子の本物のデータで開く（担任は自分のクラスの子だけ）。
#  ・見ているあいだは何も保存しない：サーバは GET 以外をハンドラに通さず {ok:true,viewOnly:true}、GET も読むだけDBで動かす（state_json は上書きされない）。
#    画面側も fetch の書きこみ・sendBeacon・フォーム送信を止め、localStorage をその場かぎりに差しかえる。
#  ・画面の上に「👀 〇〇さんの画面を見ています（見るだけ）」の帯と「終わる」。60分で自動終了。子どもの画面には何も足さない。
#  ・誰がいつ誰の画面を見たかは view_as_log（migrations/0046、本番には先に流す）。記録できなければ始めない。
#  ・src/index.tsx は3行だけ（import／認証ミドルウェアの直後に installViewAs／/teacher に script）。.replace() チェーンは不変を検査。
#  ・テスト：tests/viewas.test.mjs（14件）＋既存 coin_ledger（46件）。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: apply patch (fail-closed)
        run: |
          if grep -q "from './viewas'" src/index.tsx; then echo "already applied"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
