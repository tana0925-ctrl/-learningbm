name: patch-review-c-v1

# REVIEW_C_V1 復習チャレンジを「四択／自己採点」にする。
#
# 先生の報告：「四択にしてよ」。
# 復習チャレンジは、もとが四択だろうと必ずテキスト入力を出し、
# checkReviewAnswer() が完全一致で判定していた。
# 「3Rの『R』には何と何と何がある？」のような問題は、入力で答えるのは不可能。
# 本番データ 3,464件のうち 1,023件（29.5%）がこれにあたる。
#
# 答えの形だけで判定する（単元名では判定しない）：
#   ・答えが数字          -> 今までどおりの入力式
#   ・数字でなく opts あり -> 四択のボタンを縦1列（高さ 52px 以上）
#   ・数字でなく opts 無し -> 「こたえを見る」→ 自己採点
# 自己採点の「できた／まだ」は、もとからある
#   「✅ マスターした！」= reviewNextQuestion(true)  -> 復習リストから消える
#   「もう一度」        = reviewNextQuestion(false) -> 残る
# をそのまま使う。新しいボタンは作らない。
#
# あわせて、問題文が1文字以下の壊れた記録を復習に出さない。
#
# ・直すのは public/index.html（9か所） だけ。
# ・src/index.tsx は1バイトも触らない。チェーン数は「増えていないこと」の確認だけに使う。
#   合わなければ1バイトも書かずに止まる（フェイルクローズ）。
# ・D1 には一切触らない。DDL も流さない。
#
# ⚠️ Deploy は自動で起こさない。手で dispatch する。
# ⚠️ dist/ は .gitignore に書いてあるのに git に入ったままなので、ビルドのたびに必ず変わる。
#    コミットはしないので、差分の確認は「もとになるファイル」だけを見る。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | wc -c

      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_review_c_v1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_review_c_v1.py

      - name: src/index.tsx は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- src/index.tsx; then
            echo "::error::src/index.tsx が変わっています。中止します。"; exit 1
          fi

      - name: 変わったファイルが想定どおりか
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: あてたファイルを控える
        run: |
          mkdir -p /tmp/keep
          cp public/index.html /tmp/keep/index.html
          wc -c public/index.html

      - name: ビルド（配信と同じ順番で）
        run: |
          npm ci --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
          cp -f public/*.js dist/ 2>/dev/null || true

      - name: あてたファイルを戻して、差分が想定どおりのままか見る
        run: |
          cp -f /tmp/keep/index.html public/index.html
          CHANGED=$(git diff --name-only -- src public scripts .github package.json package-lock.json | sort | tr '\n' ' ')
          echo "changed(src): $CHANGED"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::ビルドのあとで思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: 配信HTMLの構文検査（教師ページ側）
        run: node scripts/render_check.mjs

      - name: 配信HTMLの構文検査（児童ページ側・この便では必須）
        run: node scripts/render_check_child.mjs

      - name: 配信HTMLで中身を確かめる
        run: |
          cat > /tmp/verify.mjs <<'JSEOF'
          import fs from 'fs';
          const mod = await import(process.cwd() + '/dist/_worker.js');
          const env = { ASSETS: { fetch: async (req) => {
            const u = new URL(typeof req === 'string' ? req : req.url);
            const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname;
            try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }); }
            catch (e) { return new Response('', { status: 404 }); } } } };
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} });
          const html = await res.text();
          const count = (s) => html.split(s).length - 1;
          const need = {
            '1 番兵': ['__REVIEW_C_V1__', 3],
            '2 選択肢の入れ物': ['id="reviewModalChoices"', 1],
            '3 こたえるボタンの id': ['id="reviewModalGoBtn"', 1],
            '4 組み立て直しの定義': ['function _revSetupAnswerUI(item)', 1],
            '5 選択肢を作る定義': ['function _revChoiceList(x)', 1],
            '6 えらんだときの処理': ['function _revPickChoice(el, txt)', 1],
            '7 組み立て直しの呼び出し': ['_revSetupAnswerUI(_reviewCurrentItem)', 1],
            '8 三通りの判定': ["const isOk = (_reviewAnsMode === 'self') ? null : (userAns === correct);", 1],
            '9 壊れた記録を落とす': ['.trim().length <= 1) { return false; }', 1],
            '10 前便 A の番兵': ['__REVIEW_BADANS_A1__', 1],
            '11 前便 BCD の番兵': ['__REVIEW_BCD_V1__', 3],
            '12 前便 MATH の番兵': ['__REVIEW_MATH_V1__', 1],
            '13 MATH の呼び出し': ['if (_revMathBad(x) === true) { return false; }', 1],
            '14 もとのふるい分け': ['window._revOK = function', 1],
            '15 マスターしたボタン': ['reviewNextQuestion(true)', 1],
            '16 もう一度ボタン': ['reviewNextQuestion(false)', 1],
          };
          for (const k of Object.keys(need)) {
            const [s, want] = need[k];
            const n = count(s);
            console.log('  ' + k + ': ' + n + ' 件（想定 ' + want + '）');
            if (n !== want) throw new Error('配信HTMLの「' + k + '」が ' + n + ' 件（想定 ' + want + '）');
          }
          // 配信HTMLから判定の部品を取り出して、実際に動かして確かめる
          const b0 = html.indexOf('function _revIsNumAns(a) {');
          const b1 = html.indexOf('function _revPickChoice(el, txt) {');
          if (b0 < 0 || b1 < 0 || b1 <= b0) throw new Error('判定の部品が見つからない');
          const parts = new Function(html.slice(b0, b1) + ' return { num: _revIsNumAns, list: _revChoiceList };')();
          const cases = [
            ['答えが整数なら入力式', () => parts.num('6') === true],
            ['答えが小数なら入力式', () => parts.num('0.5') === true],
            ['答えが負の数なら入力式', () => parts.num('-3') === true],
            ['あまりの連結は数字あつかい', () => parts.num('52') === true],
            ['日本語の答えは入力式にしない', () => parts.num('平安時代') === false],
            ['あまり入りの答えは入力式にしない', () => parts.num('5あまり2') === false],
            ['四択はそのまま四択', () => { const r = parts.list({ans:'B', opts:['A','B','C','D']}); return r && r.length === 4 && r.indexOf('B') >= 0; }],
            ['正解が選択肢に無ければ四択にしない', () => parts.list({ans:'Z', opts:['A','B','C','D']}) === null],
            ['選択肢が1つなら四択にしない', () => parts.list({ans:'A', opts:['A']}) === null],
            ['opts が無ければ四択にしない', () => parts.list({ans:'平安時代'}) === null],
            ['opts が配列でなければ四択にしない', () => parts.list({ans:'A', opts:'A,B'}) === null],
            ['選択肢が5つ以上でも正解は必ず残る', () => { for (let i=0;i<200;i++){ const r = parts.list({ans:'E', opts:['A','B','C','D','E','F']}); if (!r || r.length !== 4 || r.indexOf('E') < 0) return false; } return true; }],
            ['空の選択肢は捨てる', () => { const r = parts.list({ans:'A', opts:['A','','  ','B']}); return r && r.length === 2; }],
            ['同じ選択肢はまとめる', () => { const r = parts.list({ans:'A', opts:['A','A','B','B']}); return r && r.length === 2; }],
          ];
          let bad = 0;
          for (const [label, f] of cases) {
            let ok = false;
            try { ok = (f() === true); } catch (e) { ok = false; }
            console.log('  ' + (ok ? 'OK ' : 'NG ') + label);
            if (!ok) bad++;
          }
          if (bad) throw new Error('四択の判定が想定と違う: ' + bad + ' 件');
          console.log('配信HTML ' + html.length + ' 文字。想定どおり。');
          JSEOF
          node /tmp/verify.mjs

      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          h = open('public/index.html', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash', 'registerMi(app)', 'registerQrHunt(app)',
                    'OCTGACHA_V1']:
              n = s.count(k)
              print('src  %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          for k in ['window.monSpriteHtml', 'monShinySet', 'WILDIMG_V2', 'pveGradeSelectorWrap',
                    '__REVIEW_BADANS_A1__', '__PVE_GRADE_LOCK_V1__', '二酸化炭素が発生',
                    '__REVIEW_BCD_V1__', '__REVIEW_MATH_V1__', 'window._revOK = function',
                    'reviewNextQuestion(true)', 'reviewNextQuestion(false)']:
              n = h.count(k)
              print('html %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF

      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c public/index.html

      - name: commit and push
        run: |
          git add public/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "REVIEW_C_V1: 復習チャレンジを四択／自己採点にする（9か所・チェーン${{ inputs.chain_before }}->据え置き）"
          git push origin HEAD:main
