name: patch-review-badans-a1

# REVIEW_BADANS_A1 （応急処置A）
#
# 復習リスト・復習チャレンジ・対戦の出題が、四択の正解を「選択肢の番号(0〜3)」
# のまま保存した古いエントリを、そのまま「正解」として児童に見せている。
#   例) 「🌸 平安時代に力を持った貴族の一族は？」 → 正解：1
#   本番D1の実測: 児童22人 / 1,341件 / 60単元以上。
# このパッチは、それを「出さない」だけ。
#
# ・直すのは public/index.html だけ（絞り込み式3か所 + 定義ブロック1件）。
# ・src/index.tsx は1バイトも触らない。チェーン数は「増えていないこと」の確認だけに使う。
#   合わなければ1バイトも書かずに止まる（フェイルクローズ）。
# ・D1 には一切触らない。DDL も流さない。保存データも書きかえない。
# ・問題バンク（出題そのもの）は触らない。修行モードの挙動は変わらない。
# ・分数の「約分後の分子は？」で正解が 1 のような正当なものは守る（実測179件）。
#
# ⚠️ Deploy は自動で起こさない。手で dispatch する。
# ⚠️ dist/ は .gitignore に書いてあるのに git に入ったままなので、ビルドのたびに必ず変わる。
#    コミットはしないので、差分の確認は「もとになるファイル」だけを見る。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | wc -c
          git show HEAD:public/index.html | sha256sum

      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_review_badans_a1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_review_badans_a1.py

      - name: src/index.tsx は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- src/index.tsx; then
            echo "::error::src/index.tsx が変わっています。中止します。"; exit 1
          fi

      - name: public/mon/ と scripts/ は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- public/mon; then
            echo "::error::public/mon/ が変わっています。中止します。"; exit 1
          fi
          if ! git diff --quiet -- scripts; then
            echo "::error::scripts/ が変わっています。中止します。"; exit 1
          fi

      - name: 変わったファイルは public/index.html の1つだけであること
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: あてた public/index.html を控える
        run: |
          cp public/index.html /tmp/patched_index.html
          sha256sum /tmp/patched_index.html
          wc -c /tmp/patched_index.html

      - name: ビルド（配信と同じ順番で）
        run: |
          npm ci --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
          cp -f public/*.js dist/ 2>/dev/null || true

      - name: あてた public/index.html を戻して、もとのファイルの差分が1つだけのままか見る
        run: |
          cp -f /tmp/patched_index.html public/index.html
          CHANGED=$(git diff --name-only -- src public scripts .github package.json package-lock.json | sort | tr '\n' ' ')
          echo "changed(src): $CHANGED"
          echo "changed(all): $(git diff --name-only | sort | tr '\n' ' ')"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::ビルドのあとで思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: 配信HTMLの構文検査（教師ページ側）
        run: node scripts/render_check.mjs

      - name: 配信HTMLの構文検査（児童ページ側・この便では必須）
        run: node scripts/render_check_child.mjs

      - name: 配信HTMLに入っているか／_revOK が思ったとおりに効くか
        run: |
          cat > /tmp/verify_badans.mjs <<'JSEOF'
          import fs from 'fs';
          const mod = await import(process.cwd() + '/dist/_worker.js');
          const env = { ASSETS: { fetch: async (req) => {
            const u = new URL(typeof req === 'string' ? req : req.url);
            const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname;
            try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }); }
            catch (e) { return new Response('', { status: 404 }); } } } };
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} });
          const html = await res.text();

          const count = (s) => html.split(s).length - 1;
          const need = {
            '1 番兵': ['__REVIEW_BADANS_A1__', 1],
            '2 _revOK の定義': ['window._revOK = function', 1],
            '3 絞り込みに足した分': [' && (!window._revOK || window._revOK(x))', 3],
            '4 復習チャレンジ': ['function startReviewChallenge', 1],
            '5 ステータスの復習リスト': ['statReviewList', 1],
            '6 対戦の出題': ['function _warPickFromWrongQuestions', 1],
            '7 まちがいの記録': ['function recordWrongProblem', 1],
            '8 CURRICULUM': ['const CURRICULUM', 1],
          };
          for (const k of Object.keys(need)) {
            const [s, want] = need[k];
            const n = count(s);
            console.log('  ' + k + ': ' + n + ' 件（想定 ' + want + '）');
            if (n !== want) throw new Error('配信HTMLの「' + k + '」が ' + n + ' 件（想定 ' + want + '）');
          }

          // _revOK を配信HTMLから取り出して、実際に動かして確かめる
          const head = '(function(){' + String.fromCharCode(10) + '  var MAP = null, MAPDONE = false;';
          const i = html.indexOf(head);
          if (i < 0) throw new Error('_revOK のブロックが見つからない');
          const j = html.indexOf('})();', i);
          if (j < 0) throw new Error('_revOK のブロックの終わりが見つからない');
          const src = html.slice(i, j + 5);

          const win = { CURRICULUM: { math: { grades: { 6: { units: [
            { id: 'm6-frac-mul', input: 'numpad' },
            { id: 'm1-sub-bo', input: 'numpad' },
            { id: 'fraction-mixed', input: 'fraction' },
          ] } } }, social: { grades: { 6: { units: [
            { id: 's6-hist-u3', input: 'mcq' },
            { id: 's4-garbage', input: 'mcq' },
          ] } } } } };
          new Function('window', src)(win);
          if (typeof win._revOK !== 'function') throw new Error('_revOK が定義されなかった');

          const cases = [
            ['四択の正解が番号のまま（社会）', { mode: 's6-hist-u3', q: '🌸 平安時代に力を持った 貴族の一族は？', ans: '1' }, false],
            ['四択の正解が番号のまま（3R）', { mode: 's4-garbage', q: '🗑️ 3Rの「R」には 何と何と何がある？', ans: '2' }, false],
            ['単元が分からない古い記録（対戦）', { mode: 'war', q: '🌸 平安時代に力を持った 貴族の一族は？', ans: '1' }, false],
            ['分数の正当な答え 1 は守る', { mode: 'm6-frac-mul', q: '3/5 × 1/6 = ?/? 約分後の分子は？', ans: '1' }, true],
            ['分数の正当な答え 3 は守る', { mode: 'm6-frac-mul', q: '2/6 × 4/2 = ?/? 約分後の分母は？', ans: '3' }, true],
            ['虫食いの□は守る', { mode: 'm1-sub-bo', q: '□ − 9 = 9 □にあてはまる数は？', ans: '1' }, true],
            ['帯分数(fraction)は守る', { mode: 'fraction-mixed', q: '分数の計算をしよう。約分しない。答えは？', ans: '2' }, true],
            ['日本語の無い計算は守る', { mode: 'kuku', q: '3 × 8 = ?', ans: '2' }, true],
            ['正解がテキストなら守る', { mode: 'war', q: '「しゃしん」のローマ字は？', ans: 'shashin' }, true],
            ['2けた以上の数字は守る', { mode: 's6-hist-u3', q: '🌸 平安時代に力を持った 貴族の一族は？', ans: '12' }, true],
          ];
          let bad = 0;
          for (const [label, x, want] of cases) {
            const got = win._revOK(x);
            console.log('  ' + (got === want ? 'OK ' : 'NG ') + label + ' -> ' + got + '（想定 ' + want + '）');
            if (got !== want) bad++;
          }
          if (bad) throw new Error('_revOK の動きが想定と違う: ' + bad + ' 件');
          console.log('配信HTML ' + html.length + ' 文字。_revOK は想定どおり動いている。');
          JSEOF
          node /tmp/verify_badans.mjs

      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          h = open('public/index.html', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash', 'registerMi(app)', 'registerQrHunt(app)',
                    'OCTGACHA_V1']:
              n = s.count(k)
              print('src  %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          for k in ['window.monSpriteHtml', 'monShinySet', 'shiny-ring', 'float-dynamic',
                    'showWildBattleParticles', 'function _modeLabel']:
              n = h.count(k)
              print('html %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF

      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c public/index.html
          sha256sum public/index.html src/index.tsx

      - name: commit and push
        run: |
          git add public/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "REVIEW_BADANS_A1: 復習・対戦に「選択肢の番号」を正解として出さない（絞り込み3か所+定義1件・児童22人/1341件が対象・チェーン${{ inputs.chain_before }}->据え置き）"
          git push origin HEAD:main
