name: リスク予測の判定不可を修正 (第1段階 v2)
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: パッチを適用（一致しなければ中止）
        run: python3 scripts/patch_analysis_v2.py
      - name: ビルド確認
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git diff --staged --quiet && echo "No changes" || (git commit -m "リスク予測: データ不足の子を低リスクと見分けられるように修正" && git push)
