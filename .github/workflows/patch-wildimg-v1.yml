name: patch-wildimg-v1

# WILDIMG_V1  野生バトルのキャラを、絵文字からキャラ画像に差し替える。
#
#   ・図鑑とガチャ結果で動いている monSpriteHtml を呼ぶだけ。新しい仕組みは作らない。
#   ・直すのは public/index.html の2か所だけ（自分がわ / 相手がわ）。
#   ・src/index.tsx は1バイトも触らない。チェーン数は「増えていないこと」の確認だけに使う。
#     合わなければパッチは1バイトも書かずに止まる（フェイルクローズ）。
#   ・色違い（色違いの付けかた / shiny-mon svN / shiny-ring）の数が1つでも変わったら止まる。
#   ・演出（float-dynamic / attacking-enemy / 粒 / 左右反転）が消えたら止まる。
#
#   ⚠️ Deploy は自動で起こさない。児童23人が使う画面なので、手で夜に dispatch する。
#   ⚠️ DDL は流さない。D1 には一切触らない。
#   ⚠️ 絵（public/mon/*.png）と list.js と shiny.js はこの便では触らない。
#   ⚠️ dist/ は .gitignore に書いてあるのに git に入ったままなので、ビルドのたびに必ず変わる。
#      コミットはしないので、差分の確認は「もとになるファイル」だけを見る。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | wc -c
          git show HEAD:public/index.html | sha256sum
          git show HEAD:public/mon/shiny.js | sha256sum

      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_wildimg_v1.py

      - name: src/index.tsx は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- src/index.tsx; then
            echo "::error::src/index.tsx が変わっています。中止します。"; exit 1
          fi

      - name: public/mon/ は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- public/mon; then
            echo "::error::public/mon/ が変わっています。中止します。"; exit 1
          fi

      - name: 変わったファイルは public/index.html の1つだけであること
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: あてた public/index.html を控える
        run: |
          cp public/index.html /tmp/patched_index.html
          sha256sum /tmp/patched_index.html

      - name: ビルド（配信と同じ順番で）
        run: |
          npm ci --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
          cp -f public/*.js dist/ 2>/dev/null || true

      - name: あてた public/index.html を戻して、もとのファイルの差分が1つだけのままか見る
        run: |
          cp -f /tmp/patched_index.html public/index.html
          CHANGED=$(git diff --name-only -- src public scripts .github package.json package-lock.json | sort | tr '\n' ' ')
          echo "changed(src): $CHANGED"
          echo "changed(all): $(git diff --name-only | sort | tr '\n' ' ')"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::ビルドのあとで思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: /mon/ がそのまま配る側に入ったままか
        run: python3 scripts/check_mon_routes_v1.py

      - name: 配信HTMLの構文検査（教師ページ側）
        run: node scripts/render_check.mjs

      - name: 配信HTMLの構文検査（児童ページ側・この便では必須）
        run: node scripts/render_check_child.mjs

      - name: 配信HTMLに差し替えが本当に載っているか／色違いと演出が残っているか
        run: |
          cat > /tmp/verify_wildimg.mjs <<'JSEOF'
          import fs from 'fs';
          const mod = await import(process.cwd() + '/dist/_worker.js');
          const env = { ASSETS: { fetch: async (req) => {
            const u = new URL(typeof req === 'string' ? req : req.url);
            const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname;
            try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }); }
            catch (e) { return new Response('', { status: 404 }); } } } };
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} });
          const html = await res.text();
          const need = {
            '1 自分がわの印':        '/* WILDIMG_V1 野生バトル・自分',
            '2 自分がわの呼び出し':   'monSpriteHtml(myMon.id, myMon.sprite)',
            '3 相手がわの印':        '/* WILDIMG_V1 野生バトル・相手',
            '4 相手がわの呼び出し':   'monSpriteHtml(enemyMon.id, enemyMon.sprite)',
            '5 色違いの付けかた':     'monShinySet',
            '6 色違いの色':          '.shiny-mon.sv1',
            '7 色違いの金リング':     'shiny-ring',
            '8 ふわふわ浮く':        'float-dynamic',
            '9 相手の攻撃モーション': 'attacking-enemy',
            '10 被弾':               "classList.add('damaged')",
            '11 粒エフェクト':        'showWildBattleParticles',
            '12 攻撃モーション':      'showAttackerMotion',
            '13 自分がわの左右反転':  'scaleX(-1)',
            '14 受け皿':             'window.monSpriteHtml',
            '15 lazy と decoding':   'loading="lazy" decoding="async"',
            '16 絵文字へ落ちる道':    'onerror="monImgFail(this)"',
          };
          for (const k of Object.keys(need)) {
            const n = html.split(need[k]).length - 1;
            console.log('  ' + k + ': ' + n + ' 件');
            if (n < 1) throw new Error('配信HTMLに「' + k + '」が無い');
          }
          // むきだしの innerText の行は、try/catch の落ち先に1本ずつだけ残るのが正しい。
          for (const [label, s] of [
            ['自分がわ', "document.getElementById('playerSpriteDisplay').innerText = myMon.sprite;"],
            ['相手がわ', "document.getElementById('enemySpriteDisplay').innerText = enemyMon.sprite;"],
          ]) {
            const n = html.split(s).length - 1;
            console.log('  落ち先(' + label + '): ' + n + ' 件');
            if (n !== 1) throw new Error('落ち先が1件ではない(' + label + '): ' + n);
          }
          // 色違いの呼び出しは「中身を入れたあと」でなければ意味がない。順番を見る。
          for (const [label, a, b] of [
            ['自分がわ', 'monSpriteHtml(myMon.id, myMon.sprite)', "monShinySet(_psd"],
            ['相手がわ', 'monSpriteHtml(enemyMon.id, enemyMon.sprite)', "monShinySet(_esd"],
          ]) {
            const ia = html.indexOf(a), ib = html.indexOf(b);
            if (ia < 0 || ib < 0) throw new Error('順番を見る目じるしが無い(' + label + ')');
            if (!(ia < ib)) throw new Error('色違いを付けるのが先になっている(' + label + ')');
            console.log('  順番(' + label + '): 中身 -> 色違い で正しい');
          }
          console.log('配信HTML ' + html.length + ' 文字。差し替えも色違いも演出もそろっている。');
          JSEOF
          node /tmp/verify_wildimg.mjs

      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash', 'registerMi(app)', 'registerQrHunt(app)',
                    'OCTGACHA_V1']:
              n = s.count(k)
              print('%-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF

      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c public/index.html
          sha256sum public/index.html src/index.tsx

      - name: commit and push
        run: |
          git add public/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "WILDIMG_V1: 野生バトルのキャラを絵文字からキャラ画像に（自分35-45px/相手40-50px・色違いと演出はそのまま／チェーン${{ inputs.chain_before }}->据え置き）"
          git push origin HEAD:main
