name: DEFBOSS_SPD_V1 ぼうえいせんのボス4体の spd を1.15倍（チェーン 102->102・増減0）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを掃除
        run: git checkout -- .

      - name: 最新を取り込む
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - name: 前の便が入っていること
        run: |
          grep -q '__DEFBOSS_V1__' src/index.tsx
          grep -q '__ZWAR_BOSS_SKILL3_V1__' src/index.tsx
          echo '前の便あり'

      - name: 流す前にチェーンとアンカーを実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          applied = '__DEFBOSS_SPD_V1__' in s
          print('chain before =', n, 'applied =', applied)
          if n != 102:
              print('NG: チェーンが %d 件（期待 102）' % n); sys.exit(1)
          if not applied:
              if s.count('spdMul') != 0:
                  print('NG: spdMul が すでに ある'); sys.exit(1)
              if s.count('defBossApply(') != 4:
                  print('NG: defBossApply の 出現が %d 件（期待 4）' % s.count('defBossApply(')); sys.exit(1)
          g = io.open('src/def_stage.ts', encoding='utf-8').read()
          if g.count('Math.min(70, 35 + 5 * k)') != 1:
              print('NG: てきの spd 上限 70 が 見あたらない'); sys.exit(1)
          print('アンカー OK')
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_defboss_spd_v1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        run: python3 scripts/patch_defboss_spd_v1.py

      - name: 触ってはいけないファイルが無傷であること
        run: |
          git diff --name-only
          if git diff --name-only | grep -vE '^src/index\.tsx$' | grep -q .; then
            echo 'NG: src/index.tsx 以外が変わっている'; exit 1
          fi

      - name: 検証（番兵とは別の条件で確かめる）
        run: |
          python3 - << 'PYEOF'
          import subprocess, sys
          s = open('src/index.tsx', encoding='utf-8').read()
          old = subprocess.check_output(['git', 'show', 'HEAD:src/index.tsx']).decode('utf-8')
          ok = True

          def chk(label, got, want):
              global ok
              if got != want:
                  print('NG: %s = %s（期待 %s）' % (label, got, want)); ok = False

          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          oi = old.index("app.get('/', async (c) => {")
          oj = old.index("app.get('/logout'", oi)
          on = old[oi:oj].count('.replace(')
          print('replace chain:', on, '->', n)
          chk('チェーン', n, 102)
          chk('チェーンの増減', n - on, 0)

          chk('spdMul: 1.15', s.count('spdMul: 1.15'), 4)
          chk('spdMul を読む行', s.count('const smul = Number(b.spdMul)'), 1)
          chk('hpMul 1.3 が3件のまま', s.count('hpMul: 1.3'), old.count('hpMul: 1.3'))
          chk('defBossApply の よびだし', s.count('defBossApply('), old.count('defBossApply('))

          bi = s.index('function defBossApply(')
          bj = s.index('const DEFENSE_WIN_COINS', bi)
          body = s[bi:bj]
          for bad in ['o.atk', 'o.def', 'o.skillPow']:
              chk('defBossApply が %s に さわらない' % bad, body.count(bad), 0)

          if subprocess.call(['git', 'diff', '--quiet', '--', 'src/def_stage.ts']) != 0:
              print('NG: src/def_stage.ts が かわっている'); ok = False
          if subprocess.call(['git', 'diff', '--quiet', '--', 'src/def_engine.ts']) != 0:
              print('NG: src/def_engine.ts が かわっている'); ok = False
          if subprocess.call(['git', 'diff', '--quiet', '--', 'public/index.html']) != 0:
              print('NG: public/index.html が かわっている'); ok = False

          d = subprocess.check_output(['git', 'diff', '--numstat', '--', 'src/index.tsx']).decode('utf-8').split()
          print('numstat(add/del):', d[:2])
          if int(d[1]) > 10:
              print('NG: けした行が 多すぎる', d[1]); ok = False

          if not ok:
              sys.exit(1)
          print('VERIFY OK')
          PYEOF

      - name: 段12-21のボスの spd を 実際に 計算して 見せる
        run: |
          python3 - << 'PYEOF'
          for st in (12, 15, 18, 21):
              k = st - 1
              spd = 10 if k <= 0 else min(70, 35 + 5 * k)
              b = round(spd * 1.15)
              print('段%d  もとの spd=%d -> ボス spd=%d  (cdMax %d -> %d tick)'
                    % (st, spd, b,
                       max(6, min(60, round(20 * 120 / spd))),
                       max(6, min(60, round(20 * 120 / b)))))
          PYEOF

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ビルドが通ることを確認
        run: |
          npm ci
          npm run build
          git checkout -- dist 2>/dev/null || true
          git clean -fdq dist 2>/dev/null || true
          echo '--- git status ---'
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/index.tsx; then
            echo 'no change (already applied)'; exit 0
          fi
          git add src/index.tsx
          git commit -m 'DEFBOSS_SPD_V1: defense boss spdMul 1.15 for stages 12/15/18/21 (hp/atk untouched) chain 102->102'
          git pull --rebase origin main
          git push origin HEAD:main
