name: Patch shoot lobby + server
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/patch_ts_defense.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/index.html public/typeshoot.js
          git diff --staged --quiet && echo "No changes" || (git commit -m "patch: typeshoot score + ranking" && git push)
