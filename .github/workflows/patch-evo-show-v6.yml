name: patch-evo-show-v6

# EVO_SHOW_V6 (第6便) 進化の演出。音は入れない。
#   tryEvolveById() の中で進化1段ごとに待ち行列へ積み、カードを1枚ずつ出す。
#   8か所の呼び出しを個別に直さずに済み、連続進化も1段ずつ見せられる。
#   「アプリを開いた瞬間に黙って進化していた」も見えるようになる。
#   カードは1.6秒／タップで閉じる。前の姿が白く飛んで、新しい姿がポンと出る。
#   友達対戦の alert からは進化の行だけ外す（alert 自体は触らない）。
#   V5（色違いの演出）の部品を流用するので、V5 が入っていないと中止する。
#   さわるのは public/index.html だけ。置換チェーンは増えない。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi). awanakereba nanimo kakazu tomaru'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          wc -c src/index.tsx public/index.html
          sha256sum src/index.tsx public/index.html
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_evo_show_v6.py
      - name: keep the patched file aside
        run: cp public/index.html /tmp/patched_index.html
      - name: build
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: render check (teacher pages)
        run: node scripts/render_check.mjs
      - name: render check (child page)
        run: node scripts/render_check_child.mjs
      - name: restore the patched file (do not commit inject-rt output)
        run: |
          cp /tmp/patched_index.html public/index.html
          sha256sum src/index.tsx public/index.html
      - name: record diff
        run: |
          git --no-pager diff --stat
          git status --porcelain
      - name: commit and push
        run: |
          git add public/index.html
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          if git diff --cached --name-only | grep -qx 'src/index.tsx'; then echo "::error::src/index.tsx must not change"; exit 1; fi
          git commit -m "EVO_SHOW_V6: 進化の演出（音なし）。tryEvolveById で待ち行列に積み、カードを1枚ずつ出す (チェーン ${{ inputs.chain_before }} のまま)"
          git push origin HEAD:main
