name: patch-karte-material-v1

# KARTE_MATERIAL_V1
#   カルテ（阪神マンからのアドバイス）に 4月からのデータをぜんぶ使えるようにし、
#   一度カルテの材料として渡したものは次から渡さないようにする。
#   src/index.tsx は約1MBで web editor では扱えないので、このワークフローで書きかえる。
#   児童の画面（配信チェーン）は1件も増やさない。増えていたら止まる。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          echo "--- bytes ---"
          git show HEAD:src/index.tsx | wc -c
          git show HEAD:public/index.html | wc -c
          echo "--- sha256 ---"
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | sha256sum
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_karte_material_v1.py
      - name: public/index.html は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- public/index.html; then
            echo "::error::public/index.html が変わっています。中止します。"; exit 1
          fi
      - name: 構文検査（esbuild で通してから node --check）
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/after.js --log-level=warning
          node --check /tmp/after.js
      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          need = ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                  '__WORLD_V3__', 'WARMIX', '_hash']
          bad = False
          for k in need:
              n = s.count(k)
              print('%-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF
      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c src/index.tsx
          sha256sum src/index.tsx
      - name: commit and push
        run: |
          git add src/index.tsx
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "KARTE_MATERIAL_V1: カルテは4月からの材料ぜんぶ／一度使った材料は渡さない／週のズレをなくす（チェーン122->122）"
          git push origin HEAD:main
