name: Patch defense fix2+3 (order by / empty class)
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dry run (anchor check only)
        run: python3 scripts/patch_def_fix23_order_class.py --check
      - name: Run patch
        run: python3 scripts/patch_def_fix23_order_class.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git diff --staged --quiet && echo "No changes" || (git commit -m "fix(defense): deterministic entry order + exclude empty class_id" && git push)
