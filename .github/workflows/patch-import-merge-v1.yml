name: patch-import-merge-v1

# __IMPORT_AUTO_V1__ / __IMPORT_CHECK_V1__ （2026-09-24）
#   取り込み口の統合。先生に「テストか／成果物か／ポートフォリオか」を聞くのをやめる。
#     ・行き先は中身で決める（点数か観点別があれば成績、無ければ記録）
#     ・種類（まとめ／振り返り／その他）の3択セレクトを廃止し、中身から自動判定
#     ・貼り付け欄を1つに（=== の有無で形式を振り分け）
#     ・取り込み口 4つ -> 2つ（ドリルパークは畳むだけ・消さない）
#     ・保存前の値の点検（満点超え／マイナス／0点／全員同じ点／二重取り込み／人数不足）
#   DDL は流さない。public/index.html は触らない。
#   児童の画面（配信チェーン）は1件も増やさない。増えていたら止まる。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | wc -c
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | sha256sum
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_import_merge_v1.py
      - name: public/index.html は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- public/index.html; then
            echo "::error::public/index.html が変わっています。中止します。"; exit 1
          fi
      - name: DDL を足していないこと
        run: |
          if git diff -- src/index.tsx | grep -E '^\+.*(CREATE TABLE|ALTER TABLE|DROP TABLE)' ; then
            echo "::error::DDL が追加されています。中止します。"; exit 1
          fi
      - name: 構文検査（TS）
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/after.js --log-level=warning
          node --check /tmp/after.js
      - name: 構文検査（教師ダッシュボードの埋め込みJS）
        run: |
          python3 - <<'PYEOF'
          import io
          L = io.open('src/index.tsx', encoding='utf-8').read().split('\n')
          a = next(i for i, x in enumerate(L) if x.strip() == '<script>' and i > 11000)
          b = next(i for i, x in enumerate(L) if x.strip() == '</script>' and i > a)
          t = '\n'.join(L[a + 1:b]).replace('\\`', '`').replace('\\\\', '\\').replace('\\$', '$')
          io.open('/tmp/client.js', 'w', encoding='utf-8').write(t)
          print('client js lines = %d' % (b - a))
          PYEOF
          node --check /tmp/client.js
      - name: 行き先の判定を実データの形で検査
        run: |
          python3 - <<'PYEOF'
          import io, re
          s = io.open('src/index.tsx', encoding='utf-8').read()
          out = []
          for fn in ['_impHasScore', '_impHasKanten', '_impDest', '_impAutoType']:
              i = s.index('function ' + fn + '('); out.append(s[i:s.index('\n', i)])
          io.open('/tmp/dest.js', 'w', encoding='utf-8').write('\n'.join(out) + '''
          var f=0; var t=function(n,g,w){ if(g!==w){ console.log('NG',n,g); f++; } else console.log('ok',n); };
          t('点数あり->成績', _impDest({score:'100'}), 'score');
          t('観点別のみ->成績', _impDest({score:'', evalKnowledge:'◎'}), 'score');
          t('成果物(本文+◎)->記録', _impDest({score:'', evalRank:'◎', body:'あ'}), 'record');
          t('振り返りのみ->記録', _impDest({score:'', evalRank:'○', reflection:'あ'}), 'record');
          t('本文あり->report', _impAutoType({body:'あ'}), 'report');
          t('本文なし振り返りあり->reflect', _impAutoType({body:'', reflection:'あ'}), 'reflect');
          t('どちらも無し->other', _impAutoType({body:'', reflection:''}), 'other');
          if(f){ console.log('*** '+f+' NG ***'); process.exit(1); }
          console.log('=== 判定テスト通過 ===');
          ''')
          PYEOF
          node /tmp/dest.js
      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash',
                    '__IMPORT_AUTO_V1__', '__IMPORT_CHECK_V1__',
                    "app.post('/api/teacher/test-scores/save'", "app.post('/api/teacher/records/save'",
                    'matchStatus', 'karte_material_uses']:
              n = s.count(k)
              print('%-38s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF
      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c src/index.tsx
          sha256sum src/index.tsx
      - name: commit and push
        run: |
          git add src/index.tsx
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "IMPORT_MERGE_V1: 取り込み口を4つ->2つ・種類の3択を廃止（中身から自動判定）・保存前の値の点検を追加"
          git push origin HEAD:main
