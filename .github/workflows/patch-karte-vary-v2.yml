name: KARTE_VARY_V2 前に渡したカルテを6週にして、それより前は たな卸し

# 先生のことば: 「前の週だけじゃなくもっとたくさんでもいいね」
#
# V1 は 週ごとに1本・直近4週・全文。もっと増やしたいが、全部を全文にすると
# 年度末（約29週）に約137,000字になり、束の大半が過去カルテになる。
#   実測: カルテ1本の平均160字（最長217字）／いまは5週109本で17,383字。
# → 直近6週は全文。それより前は本文を渡さず「どの手をもう使ったか」だけ残す。
#   ・長い期間の言い方（4月から／ずっと／夏休み／◯月は／前期）を使った週（最大12）
#   ・末尾の問いかけ（重複をのぞき最大8件・各40字）
#   ・何週ぶんあるか
#   これは週が増えても長さが変わらない（1人400字以内）。
#
# 束では、6本の全文のすぐ下に たな卸しを置く
# （長い束ほど真ん中が読み飛ばされるので、同じ話は離さない）。
# 指示文も「4週」→「6週」に直し、たな卸しに本文が無いことを明記する。
#
# さわるのは public/teacher-ai.js と src/index.tsx の2か所だけ。
#   public/index.html・public/student-karte.js・防衛戦まわりには一切さわらない。
#   .replace( チェーンは1本も増やさない。teacher-ai.js を変えたので ?v=11 -> ?v=12。
# D1には一切書き込まない。karte_material_uses にも触らない。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: "流す直前に実測したチェーン件数（src/index.tsx の app.get('/') 〜 app.get('/logout') の .replace( の数）。合わなければ何も書かずに止まる"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: 適用前の実測
        run: |
          git rev-parse HEAD
          echo -n 'チェーン件数(前): '; python3 -c "s=open('src/index.tsx',encoding='utf-8').read(); a=s.index(\"app.get('/', async (c) => {\"); b=s.index(\"app.get('/logout'\",a); print(s[a:b].count('.replace('))"
          sha256sum public/teacher-ai.js src/index.tsx public/index.html
          echo -n 'V1マーカー: '; grep -c 'KARTE_VARY_V1' public/teacher-ai.js || true
          echo -n 'V2マーカー: '; grep -c 'KARTE_VARY_V2' public/teacher-ai.js || true

      - name: パッチ適用（フェイルクローズ）
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_karte_vary_v2.py

      - name: 触ってはいけないファイルが無傷であること
        run: |
          set -e
          git diff --quiet -- public/index.html
          git diff --quiet -- public/student-karte.js
          git diff --quiet -- src/def_engine.ts
          git diff --quiet -- src/def_resolve.ts
          git diff --quiet -- src/def_stage.ts
          git diff --quiet -- public/defense2.js
          echo 'public/index.html / student-karte.js / 防衛戦: 無変更 OK'
          echo -n '変更のあったファイル: '; git --no-pager diff --name-only | tr '\n' ' '; echo

      - name: 適用後の内容検証
        run: |
          set -e
          test $(grep -c 'KARTE_VARY_V2' public/teacher-ai.js) -ge 5
          test $(grep -c 'KARTE_VARY_V2' src/index.tsx) -ge 3
          # 6週になった
          grep -q 'pastKartes.length >= 6' src/index.tsx
          ! grep -q 'pastKartes.length >= 4' src/index.tsx
          ! grep -q '直近4週' public/teacher-ai.js
          ! grep -q '4週ぶん' public/teacher-ai.js
          grep -q '直近6週ぶん' public/teacher-ai.js
          # たな卸し
          grep -q 'olderWeeks' src/index.tsx
          grep -q 'longWeeks' src/index.tsx
          grep -q 'pastAsks' src/index.tsx
          grep -q 'これまでの手の たな卸し' public/teacher-ai.js
          grep -q 'たな卸しから問いかけの中身を探さないでください' public/teacher-ai.js
          # V1 を壊していない
          grep -q '_karteAgoLabel' public/teacher-ai.js
          grep -q '前に言ったことを踏まえる' public/teacher-ai.js
          ! grep -q '必ず全部入れる' public/teacher-ai.js
          # ?v= を上げた
          grep -q '/teacher-ai.js?v=12' src/index.tsx
          ! grep -q '/teacher-ai.js?v=11' src/index.tsx
          # 児童画面のJSは触っていない
          grep -q '/student-karte.js?v=3' src/index.tsx
          # D1への書き込みを増やしていない
          test $(grep -c "INSERT OR IGNORE INTO karte_material_uses" src/index.tsx) -eq 1
          echo -n 'チェーン件数(後): '; python3 -c "s=open('src/index.tsx',encoding='utf-8').read(); a=s.index(\"app.get('/', async (c) => {\"); b=s.index(\"app.get('/logout'\",a); print(s[a:b].count('.replace('))"
          echo '検証OK'

      - name: 配信JSの構文チェック（node --check）
        run: node --check public/teacher-ai.js

      - name: ビルド
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      - name: 既存のレンダリング確認（そのまま使う）
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs

      - name: コミット&プッシュ
        run: |
          git add public/teacher-ai.js src/index.tsx
          if git diff --cached --quiet; then echo "::error::変更なし"; exit 1; fi
          if git diff --cached --name-only | grep -qx 'public/index.html'; then echo "::error::public/index.html must not change"; exit 1; fi
          git commit -m "KARTE_VARY_V2: 前に渡したカルテを直近6週の全文にし、それより前は本文を渡さず『たな卸し』（長期ネタを使った週・終わり方8件まで）にする。指示文も6週に合わせ、たな卸しに本文が無いことを明記（teacher-ai.js v=11->v=12・チェーン ${{ inputs.chain_before }} のまま）"
          git checkout -- .
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 次の手順
        run: echo 'このpushでは Deploy は起動しません。Deploy to Cloudflare Pages を手動で dispatch してください。'
