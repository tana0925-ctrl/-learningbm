name: わたしのカルテ (児童画面) + 紙から提出率%を削除
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: パッチを適用（一致しなければ中止）
        run: python3 scripts/patch_analysis_v7.py
      - name: ビルド確認
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/teacher-ai.js
          git diff --staged --quiet && echo "No changes" || (git commit -m "わたしのカルテ: 子どもがアプリで自分のカルテを見られるように / 紙から提出率パーセントを削除" && git push)
