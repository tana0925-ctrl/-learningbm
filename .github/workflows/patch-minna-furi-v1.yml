      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'MINNA_FURI_V1' src/index.tsx) -ge 5
          grep -q 'MINNA_ADOPT_COINS = 300' src/minna.tsx
          grep -q 'MINNA_PICK_MAX = 5' src/minna.tsx
          grep -q '<script src="/minnafuri.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/teibako.js?v=1"></script>' src/index.tsx
          grep -q "app.get('/teibako.js'" src/index.tsx
          grep -q "app.get('/minnafuri.js'" src/index.tsx
          grep -q 'MINNA_FURI_V1' public/teacher-ai.js
          test -f public/teibako.js && test -f public/minnafuri.js && test -f migrations/0045_minna_furi.sql
          ! grep -n "CREATE TABLE" src/index.tsx src/minna.tsx | grep -i minna_
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/teibako.js public/minnafuri.js public/teacher-ai.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: coin ledger tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
