name: patch-minna-furi-v1

# MINNA_FURI_V1 📋振り返り一覧（先生）＋📖みんなのふりかえり（子ども）
#  ・先生：家庭学習タブに「📋振り返り一覧」。その日／その週の振り返りをクラス全員ぶんタイルで（名前順・提出順・未返却を先に、未提出だけ・未返却だけ・⭐掲載候補だけ）。
#    開くと全文・写真・前回とくらべる・ひと往復の下書き。返却は既存APIのまま（新しい付与経路なし）。
#  ・みんなのふりかえり：子どもの同意（名前なし／名前あり）→ 今日のひと往復で AI が候補を選ぶ [PICK:振り返りID]（1回5件まで）
#    → ⭐の子だけ「のせる」→ 先生が直して採用（文面は別テーブル・元は書きかえない）→ 300コイン（minna_rewards 台帳・1振り返り1回）。
#  ・新規: src/minna.tsx、public/teibako.js、public/minnafuri.js、migrations/0045_minna_furi.sql（本番には先に流す）
#  ・DDL はリクエスト経路に入れていない。テスト 46/46・◎○△もタイルに。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
