name: 総点検 第1陣 (1)クラス分析の提出データ (2)写真ボーナスの1日1回 (3)月曜朝の誤アラート
# このワークフロー1本で完結します（scripts/patch_fix_s1.py も中で復元してコミットします）。
#
# 【1】/api/teacher/class-analytics が存在しない列 homework_submissions.week_key を
#      参照していたため提出データが常に空で、提出率が常に0%、
#      在籍児童「全員」に毎回 🔴「今週まだ提出なし」の誤アラートが出ていた。
#      本番D1で列を確認済み（day_key はあるが week_key は無い）。
#      両クエリとも try/catch に握り潰されていたため誰にも見えていなかった。
#
# 【2】/api/homework/analyze-photo の「1日1回」ゲートが児童のブラウザが送った
#      dayKey で決まっていたため、日付を変えるだけで写真ボーナスと
#      聖なる神(1/1000)の抽選を無制限に回せた。
#      台帳キーだけサーバ権威にする（写真の保存先キーは提出レコードと
#      合わせる必要があるため据え置き。学習日の区切りは朝8:30）。
#
# 【3】(1)を直しても no_submission は「今週まだ提出なし」なので、月曜の朝は
#      やはり全員に🔴が出る。クラスで誰か1人でも提出があってから出すようにする。
#      submission_drop / time_drop は従来どおり。
#
# ⚠️ このワークフローの push は GITHUB_TOKEN によるものなので Deploy は自動起動しません。
#    完了後に必ず Deploy を手動実行し、本番URLで反映を確認してください。

