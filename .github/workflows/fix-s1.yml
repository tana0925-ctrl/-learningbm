          mkdir -p scripts
          printf '%s' "$PATCH_B64" | tr -d '\n' | base64 -d | gunzip > scripts/patch_fix_s1.py
          echo "$PATCH_SHA  scripts/patch_fix_s1.py" > /tmp/patch.sha256
          sha256sum -c /tmp/patch.sha256
          wc -c scripts/patch_fix_s1.py

      - name: パッチを適用（アンカーが一致しなければ中止）
        run: python3 scripts/patch_fix_s1.py

      - name: ビルド確認
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      # vite が関数名を潰すので、バンドル側の確認は
      # 「minify で消えない文字列（SQL とエラーコード）」だけで行う。
      # 関数名レベルの確認は patch_fix_s1.py の MUST/BAD/COUNTS が担当。
      - name: 出力の確認
        run: |
          set -e
          n=$(grep -o 'hs.day_key >= ?' dist/_worker.js | wc -l)
          echo "hs.day_key >= ? : $n 件（5 のはず: submission-dashboard 3 + class-analytics 2）"
          if [ "$n" != "5" ]; then echo "NG: 件数が違います"; exit 1; fi
          if grep -q 'hs.week_key' dist/_worker.js; then
            echo "NG: 存在しない列 hs.week_key がまだ残っています"; exit 1
          fi
          echo "OK: hs.week_key は消えました"
          if grep -q 'day_key_out_of_range' dist/_worker.js; then
            echo "OK: analyze-photo の日付チェックが入りました"
          else
            echo "NG: day_key_out_of_range がありません"; exit 1
          fi

      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx scripts/patch_fix_s1.py
          git diff --staged --quiet && echo "No changes" || (git commit -m "クラス分析: 存在しない week_key 参照を day_key の範囲検索に修正 / 写真ボーナスの1日1回をサーバ判定に" && git push)

      - name: 次にやること
        run: |
          echo "=================================================="
          echo " このpushは GITHUB_TOKEN によるものなので"
          echo " Deploy ワークフローは自動起動しません。"
          echo " → Actions から Deploy を手動実行してください。"
          echo " → そのあと https://learning-bm.pages.dev で反映を確認。"
          echo "=================================================="
