name: patch-michi-v1

# MICHI_V1 学びの道しるべ（印刷カルテ A4両面）＋ HANSHIN_Q_V1 阪神マンのしつもんに答える（1問1回だけ30コイン）
#  ・新規: public/karte-michi.js（印刷カルテの差しかえ）、migrations/0040_hanshin_answers.sql
#  ・変更: src/index.tsx（読むだけのSELECT・子ども用API2本・先生用API2本・補填1か所・ルート1本・script 1行）
#          public/teacher-ai.js（AIへの指示：70〜100字を外す・▼の3見出し・5つのきまり・本人の返事を渡す）
#          public/student-karte.js（▼で分けて表示・しつもんカード）
#          tests/（台帳テスト 13〜18 を追加）
#  ・DDL はリクエスト経路に入れていない（表は migrations で作る）。
#  ・Deploy は自動で起きないので、このあと deploy.yml を手で流す。

