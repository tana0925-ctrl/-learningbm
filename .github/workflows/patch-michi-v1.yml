      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'MICHI_V1' src/index.tsx) -ge 6
          grep -q 'HANSHIN_ANSWER_COINS = 30' src/index.tsx
          grep -q '<script src="/karte-michi.js?v=1"></script>' src/index.tsx
          grep -q 'MICHI_V1' public/teacher-ai.js
          ! grep -q "(4)問いかけ だけの70〜100字でよいです" public/teacher-ai.js
          grep -q 'HANSHIN_Q_V1' public/student-karte.js
          test -f public/karte-michi.js
          test -f migrations/0040_hanshin_answers.sql
          ! grep -n "CREATE TABLE" src/index.tsx | grep -i hanshin
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/karte-michi.js public/student-karte.js public/teacher-ai.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: coin ledger tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          node --no-warnings tests/coin_ledger.test.mjs ./app.after.mjs
          rm -f tests/app.after.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/teacher-ai.js public/student-karte.js public/karte-michi.js migrations/0040_hanshin_answers.sql tests/coin_ledger.test.mjs tests/d1.mjs
          git commit -m "MICHI_V1: 印刷カルテを『学びの道しるべ』（A4両面・まずここから・道順マップ・グラフを戻す・おうちの人へは切り取り線の下）／AI指示の70〜100字を外す／HANSHIN_Q_V1: 阪神マンのしつもんに答えると1問1回だけ30コイン（台帳INSERT・migration 0040・テスト18/18）"
          git pull --rebase origin main
          git push origin HEAD:main
