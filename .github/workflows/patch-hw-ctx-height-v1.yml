name: patch-hw-ctx-height-v1

# HW_CTX_HEIGHT_V1 (2026-09-24)
#   返却カードの3行たたみ(4.6rem)がきつすぎて、
#   サポーターからのことばが 65枚すべてで見えなくなっていた（先生の実画面で実測）。
#   上限を 15rem に上げる。ふつうのカードは畳まれず全部見える。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu'
        required: true
        default: '123'
        type: string

permissions:
  contents: write

