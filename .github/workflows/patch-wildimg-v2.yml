name: patch-wildimg-v2

# WILDIMG_V2  野生バトル（点滅の直し）のキャラを、絵文字からキャラ画像に差し替える。
#
#   ・図鑑・ガチャ・野生バトルで動いている monSpriteHtml を呼ぶだけ。新しい仕組みは作らない。
#   ・直すのは public/index.html だけ。src/index.tsx は1バイトも触らない。
#   ・チェーン数が合わなければ1バイトも書かずに止まる（フェイルクローズ）。
#   ・色違い（shiny-ring / monShinyClass / monShinySet）の数が変わったら止まる。
#   ・dist/ は git に入ったままでビルドのたびに変わる。コミットしないので差分は元ファイルだけ見る。
#
#   ⚠️ Deploy は自動で起こさない。児童の画面なので手で夜に dispatch する。
#   ⚠️ DDL は流さない。D1 には一切触らない。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | wc -c
          git show HEAD:public/index.html | sha256sum

      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_wildimg_v2.py

      - name: src/index.tsx と public/mon/ は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- src/index.tsx; then
            echo "::error::src/index.tsx が変わっています。中止します。"; exit 1
          fi
          if ! git diff --quiet -- public/mon; then
            echo "::error::public/mon/ が変わっています。中止します。"; exit 1
          fi

      - name: 変わったファイルは public/index.html の1つだけであること
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: あてた public/index.html を控える
        run: |
          cp public/index.html /tmp/patched_index.html
          sha256sum /tmp/patched_index.html

      - name: ビルド（配信と同じ順番で）
        run: |
          npm ci --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
          cp -f public/*.js dist/ 2>/dev/null || true

      - name: あてた public/index.html を戻して、元ファイルの差分が1つだけのままか見る
        run: |
          cp -f /tmp/patched_index.html public/index.html
          CHANGED=$(git diff --name-only -- src public scripts .github package.json package-lock.json | sort | tr '\n' ' ')
          echo "changed(src): $CHANGED"
          echo "changed(all): $(git diff --name-only | sort | tr '\n' ' ')"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::ビルドのあとで思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: /mon/ がそのまま配る側に入ったままか
        run: python3 scripts/check_mon_routes_v1.py

      - name: 配信HTMLの構文検査（教師ページ側）
        run: node scripts/render_check.mjs

      - name: 配信HTMLの構文検査（児童ページ側・この便では必須）
        run: node scripts/render_check_child.mjs

      - name: 配信HTMLに差し替えが載っているか／色違いと受け皿が残っているか
        run: |
          cat > /tmp/verify.mjs <<'JSEOF'
          import fs from 'fs';
          const mod = await import(process.cwd() + '/dist/_worker.js');
          const env = { ASSETS: { fetch: async (req) => {
            const u = new URL(typeof req === 'string' ? req : req.url);
            const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname;
            try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }); }
            catch (e) { return new Response('', { status: 404 }); } } } };
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} });
          const html = await res.text();
          const need = {
            'この便の印 WILDIMG_V2':    'WILDIMG_V2',
            '色違いの金リング':        'shiny-ring',
            '色違いのクラス':          'monShinyClass',
            '色違いの付けかた':        'monShinySet',
            '色違いの色':              '.shiny-mon.sv1',
            '受け皿':                  'window.monSpriteHtml',
            'lazy と decoding':        'loading="lazy" decoding="async"',
            '絵文字へ落ちる道':        'onerror="monImgFail(this)"',
            '図鑑の便':                'MON_DEX_V1',
            'ガチャの便':              'GACHAIMG_V1',
            '野生バトルの便':          'WILDIMG_V1',
          };
          for (const k of Object.keys(need)) {
            const n = html.split(need[k]).length - 1;
            console.log('  ' + k + ': ' + n + ' 件');
            if (n < 1) throw new Error('配信HTMLに「' + k + '」が無い');
          }
          console.log('配信HTML ' + html.length + ' 文字。差し替えも色違いも受け皿もそろっている。');
          JSEOF
          node /tmp/verify.mjs

      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash', 'registerMi(app)', 'registerQrHunt(app)']:
              n = s.count(k)
              print('%-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF

      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c public/index.html
          sha256sum public/index.html src/index.tsx

      - name: commit and push
        run: |
          git add public/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "WILDIMG_V2: 野生バトル（点滅の直し）のキャラを絵文字からキャラ画像に（色違いと演出はそのまま／チェーン${{ inputs.chain_before }}->据え置き）"
          git push origin HEAD:main
