name: 防衛戦を平日12:30に自動ではじめる（DEF_AUTO_1230_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: パッチ適用（一致しなければ中断し src/index.tsx に触らない）
        run: python3 scripts/patch_def_auto_1230_v1.py

      - name: 冪等の確認（2回流しても増えない）
        run: python3 scripts/patch_def_auto_1230_v1.py

      - name: 適用後の中身を確認（番兵とは別の条件で見る）
        run: |
          python3 - << 'PYEOF'
          import sys
          s = open("src/index.tsx", encoding="utf-8").read()
          i = s.index("let t = await a.text()")
          j = s.index("return c.html(", i)
          n = s[i:j].count(".replace(")
          print("replace chain:", n)
          ok = True
          if n != 71:
              print("NG: チェーンが71件ではありません"); ok = False

          checks = {
              "defAutoTargetV1": 2,
              "defAutoAdvanceV1": 2,
              "defAutoDayKeyV1": 3,
              "ensureDefenseTables(": 1,
              "CREATE TABLE": 21,
          }
          for k, want in checks.items():
              got = s.count(k)
              print("   ", k, got, "(want", want, ")")
              if got != want:
                  print("NG: 個数が違います:", k); ok = False

          need = [
              "defense_standing",
              "defense_carry_lock",
              "12 * 60 + 30",
              "return await defAutoAdvanceV1(env, {",
              "WHERE admin_settings.value = ?",
          ]
          for k in need:
              c = s.count(k)
              print("   ", k, c)
              if c < 1:
                  print("NG: 見つからない:", k); ok = False

          if "await ensureDefenseTables(" in s:
              print("NG: ensureDefenseTables が呼ばれています（DDLはリクエストパスで流さない）"); ok = False

          if not ok:
              sys.exit(1)
          print("OK")
          PYEOF

      - name: コミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git commit -m "防衛戦: 平日12:30 JST に自動開始（DEF_AUTO_1230_V1）チェーン 71 -> 71" || echo "no changes"
          git checkout -- .
          git pull --rebase origin main
          git push
