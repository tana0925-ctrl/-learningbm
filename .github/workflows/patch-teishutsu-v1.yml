      - name: markers
        if: env.SKIP != '1'
        run: |
          grep -q "registerTeishutsu(app, { weekRefAllowedKeys })" src/index.tsx
          grep -q "app.get('/teishutsu.js'" src/index.tsx
          grep -q "app.get('/teishutsu-teacher.js'" src/index.tsx
          grep -q '<script src="/teishutsu.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/teishutsu-teacher.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/hschat.js?v=3"></script><script src="/hsweekchat.js?v=2"></script>' src/index.tsx
          grep -q 'TEISHUTSU_CHAT_LINE' public/hschat.js
          grep -q 'TS_T.copyLines' public/teacher-ai.js
          grep -q 'TS_T.yousuInto' public/teibako.js
          test -f migrations/0049_school_assignments.sql && test -f tests/teishutsu.test.mjs
          ! grep -n -E "CREATE (TABLE|INDEX)|ALTER TABLE" src/teishutsu.ts public/teishutsu.js public/teishutsu-teacher.js
          ! grep -n "CREATE TABLE IF NOT EXISTS school_assign" src/index.tsx
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/teishutsu.js public/teishutsu-teacher.js public/teacher-ai.js public/karte-michi.js public/student-karte.js public/teibako.js public/hschat.js public/weekref2.js public/hsweekchat.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: unit test (karte-michi 🅰🅱)
        if: env.SKIP != '1'
        run: node tests/nowunit.test.mjs
      - name: install
        if: env.SKIP != '1'
        run: |
          npm install --no-audit --no-fund
          npm i --no-save --no-audit --no-fund jsdom
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts / child page)
        if: env.SKIP != '1'
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs
      - name: tests (node:sqlite, real handlers / jsdom)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          npx esbuild src/viewas.ts --bundle --format=esm --platform=neutral --outfile=tests/viewas.mod.mjs --log-level=warning
          cd tests
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs > /tmp/cl.log 2>&1 || (grep -E "FAIL|passed" /tmp/cl.log; exit 1)
          grep -E "passed" /tmp/cl.log
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs > /tmp/va.log 2>&1 || (grep -E "FAIL|passed" /tmp/va.log; exit 1)
          grep -E "passed" /tmp/va.log
          node --no-warnings teishutsu.test.mjs ./app.after.mjs > /tmp/ts.log 2>&1 || (cat /tmp/ts.log | grep -v "^    at " | tail -60; exit 1)
          grep -E "^(PASS|FAIL)|passed" /tmp/ts.log
          cd ..
          node tests/hschat.test.mjs | tail -3
          node tests/hsweekchat.test.mjs | tail -3
          rm -f tests/app.after.mjs tests/viewas.mod.mjs
      - name: served check (pages have the new scripts and they are served)
        if: env.SKIP != '1'
        run: |
          cat > /tmp/dump.mjs <<'JSEOF'
          import fs from 'fs'
          const mod = await import(process.cwd() + '/dist/_worker.js')
          const env = { ASSETS: { fetch: async (req) => { const u = new URL(typeof req === 'string' ? req : req.url); const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname; try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }) } catch (e) { return new Response('', { status: 404 }) } } } }
          const t = await (await mod.default.fetch(new Request('http://localhost/teacher'), env, { waitUntil() {} })).text()
          if (t.indexOf('/teishutsu-teacher.js?v=1') < 0 || t.indexOf('/teacher-ai.js?v=16') < 0 || t.indexOf('/karte-michi.js?v=5') < 0 || t.indexOf('/teibako.js?v=4') < 0) { console.log('先生画面の読み込みが足りない'); process.exit(1) }
          const h = await (await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} })).text()
          if (h.indexOf('/teishutsu.js?v=1') < 0 || h.indexOf('/hschat.js?v=3') < 0 || h.indexOf('/student-karte.js?v=4') < 0) { console.log('子どもの画面の読み込みが足りない'); process.exit(1) }
          for (const f of ['/teishutsu.js', '/teishutsu-teacher.js']) { const r = await mod.default.fetch(new Request('http://localhost' + f), env, { waitUntil() {} }); const s = await r.text(); if (r.status !== 200 || s.indexOf('TEISHUTSU_V1') < 0) { console.log(f + ' が配られない ' + r.status); process.exit(1) } }
          console.log('served ok')
          JSEOF
          node /tmp/dump.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx src/teishutsu.ts public/teishutsu.js public/teishutsu-teacher.js public/teacher-ai.js public/karte-michi.js public/student-karte.js public/teibako.js public/hschat.js public/weekref2.js public/hsweekchat.js migrations/0049_school_assignments.sql tests/teishutsu.test.mjs
          git commit -m "TEISHUTSU_V1: 📮提出状況のアドバイス（今週の家庭学習の一言・📮提出物チェック〔作る→名簿の格子でタップ✓〕・子どもは自分のまだの提出物だけ・提出のようす／テストの傾向〔点数なし〕をひと往復と個人分析へ・カルテに📮出し方のヒント📝テストに向けて・数字＋点%位はNG印）（migration 0049・テスト14/14）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
