name: patch-teishutsu-v1

# TEISHUTSU_V1 📮 提出状況のアドバイス（2026-10-27・先生OK済み）
#  A. 家庭学習の提出状況：子どもの画面で阪神マンが今週の日数を前向きに一言（対話の最初／アプリを開いたとき・1日1回まで）。
#     カルテ（画面・印刷）に「今週の家庭学習：〇日」。数は週の振り返りの📊今週の記録と同じ（月〜日）。
#  B. 学校の提出物：先生画面 家庭学習タブ「📮 提出物チェック」（作る・名簿の格子でタップ✓・全員✓・未提出だけ・完了で畳む）。
#     子どもは自分の「📮 まだの提出物」だけ（近い順・出したら消える・責めない言い方）。カルテに未提出の数は出さない。
#  C. 提出・成果物のようす（事実だけ）→ 今日のひと往復の材料・個人分析・振り返り一覧の1枚に小さく。
#  D. テストの傾向（点数は使わない）→ 観点・単元の「得意そう／もう少し」・アプリとのくいちがい・テスト前の準備。
#     子どもに届く文は先生確認→公開。数字＋点/%/位 は黄色の印（NG）。
#  カルテの阪神マン欄に「📮出し方のヒント」「📝テストに向けて」（各1行）。無い週は記録の事実の一言だけ。
#  ・新規: src/teishutsu.ts・public/teishutsu.js・public/teishutsu-teacher.js・migrations/0049（本番には先に流してある）・tests/teishutsu.test.mjs
#  ・DDL はリクエスト経路に入れていない。コインは付けない。最後に deploy.yml を起動する。

