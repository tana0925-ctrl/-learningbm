name: 総点検 第2陣(4) ログインの試行制限と仮パスワードの強化
# このワークフロー1本で完結します（scripts/patch_fix_s2_login.py も中で復元してコミットします）。
#
# ・/api/auth/login に試行回数の制限がまったく無かった。
#   仮パスワードは「単語15種 × 2桁 = 1,350通り」で、IDが分かれば総当たりできた。
# ・仮パスワードを「単語1つ + 3桁(2〜9)」= 15,360通りにする。形は今までどおり。
#   既存のパスワードには触らない（次のリセットから新形式）。
# ・10回失敗で15分ロック。ロック中は照合しないので、何回押してもロックは延びない。
#   児童の画面に「あと何分」を出す。
# ・パスワードを再設定したらロックも解除する（管理者／先生個別／先生一括）。
#
# ⚠️ login_attempts テーブルの DDL は、このコードでは作りません。
#    ログインは全児童が毎朝叩く経路なので、リクエストの中で DDL を走らせません
#    （app.use('*') の CREATE INDEX の await で本番が落ちた事故と同じ型を避ける）。
#    テーブルが無い間は「ロックしない」側に倒れるだけで、ログインは通ります（fail open）。
#
# ⚠️ このワークフローの push は GITHUB_TOKEN によるものなので Deploy は自動起動しません。
#    完了後に必ず Deploy を手動実行し、本番URLで反映を確認してください。

