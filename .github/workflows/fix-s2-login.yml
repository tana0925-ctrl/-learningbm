          sha256sum -c /tmp/patch.sha256
          wc -c scripts/patch_fix_s2_login.py

      - name: パッチを適用（アンカーが一致しなければ中止）
        run: python3 scripts/patch_fix_s2_login.py

      - name: ビルド確認
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      # vite が関数名を潰すので、バンドル側の確認は
      # 「minify で消えない文字列」だけで行う。
      # 関数名・語数・呼び出し回数の確認は patch_fix_s2_login.py の MUST/BAD が担当。
      - name: 出力の確認
        run: |
          set -e
          n=$(grep -o 'login_attempts' dist/_worker.js | wc -l)
          echo "login_attempts : $n 件（4のはず: SELECT2 + INSERT1 + DELETE1）"
          [ "$n" = "4" ] || { echo "NG: 件数が違います"; exit 1; }

          if grep -q 'CREATE TABLE IF NOT EXISTS login_attempts' dist/_worker.js; then
            echo "NG: リクエスト経路にDDLが入っています"; exit 1
          fi
          echo "OK: コードにDDLは入っていません"

          if grep -q 'String(10 + (a\[1\] % 90))' dist/_worker.js; then
            echo "NG: 旧パスワード生成が残っています"; exit 1
          fi
          echo "OK: 旧パスワード生成は消えました"

          grep -q 'まちがえた回数が おおいので' dist/_worker.js \
            && echo "OK: ロック時の案内文が入りました" \
            || { echo "NG: 案内文がありません"; exit 1; }

          for w in tsuki kitsune ichigo kirin; do
            grep -q "$w" dist/_worker.js || { echo "NG: 単語 $w がありません"; exit 1; }
          done
          echo "OK: 新しい単語リストが入りました"

      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx scripts/patch_fix_s2_login.py
          git diff --staged --quiet && echo "No changes" || (git commit -m "ログイン: 10回失敗で15分ロック(fail open) / 仮パスワードを15,360通りに / 再設定でロック解除" && git push)

      - name: 次にやること
        run: |
          echo "=================================================="
          echo " 1) D1 に login_attempts テーブルを作る（人が実行）"
          echo "    作るまでロックは働きません（ログインは通ります）"
          echo " 2) Actions から Deploy を手動実行"
          echo "    GITHUB_TOKEN の push は Deploy を自動起動しません"
          echo " 3) https://learning-bm.pages.dev で反映を確認"
          echo "=================================================="
