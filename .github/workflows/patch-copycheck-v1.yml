name: COPYCHECK_V1 コピーできたかを確かめる＋絵文字の文字化けを直す

# 先生の訴え：「コピーした？ けどコピーしてない」
#
# 本番で押して分かったこと：
#   ・22人ぶんを集めるのに 82.5秒かかる（API 27本を1本ずつ順番に呼んでいる）。
#   ・そのあと writeText() が「成功」を返しても、クリップボードが空のことがある。
#   ・逃げ道の execCommand('copy') は 82秒たつと false を返す（操作権が切れている）。
#   ・それでも画面には「✓ コピーしました」と出ていた。
#
# この便でやること（2件だけ）：
#   A. 書いたあと読み返して確かめる。入っていなければ「⚠ コピーできていません」と出し、
#      手で Ctrl+C できる枠（textarea）をその場に出す。
#   B. 画面に出ていた U0001F4C5 / U0001F4CA を 📅 📊 に直す。
#
#   ※ 速くする便（API を並列にする）は別便。この便では触らない。
#
# めじるし・チェーン数（159件）が合わなければ patch が止まる（1文字も書かない）。
# ビルドと構文チェックが通ってから はじめて commit / push する。
#
# ※ push は github-actions の token なので Deploy は自動で走らない。
#   このあと「Deploy to Cloudflare Pages」を手で流すこと。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッチを あてる（めじるし・チェーン数が 合わなければ ここで 止まる）
        run: python3 scripts/patch_copycheck_v1.py

      - name: 変わった ところを 見る
        run: git --no-pager diff --stat

      - name: ビルド
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      - name: 教師画面など の 構文チェック
        run: node scripts/render_check.mjs

      - name: 児童ページ の 構文チェック
        run: node scripts/render_check_child.mjs

      - name: teacher-ai.js の 構文チェック（外だしファイルは上の2本が見ないため）
        run: node --check public/teacher-ai.js

      - name: コミットして おくる
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/teacher-ai.js
          git diff --staged --quiet && echo "No changes" || (git commit -m "COPYCHECK_V1: コピーできたかを読み返して確かめる／絵文字の文字化けを直す（チェーン159->159）" && git push)
