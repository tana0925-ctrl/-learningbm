name: patch-hs-resync-v1

# HS_RESYNC_V1 (2026-09-28)
#   「出したのに出してない判定になる」を直す。
#   子どもの週間ビューは提出の有無を端末側の記録だけで見ており、サーバの
#   homework_submissions を一度も見ていなかった。端末側の保存が届かなかった日は
#   先生の画面には出るのに、子どもの画面にだけ出ない状態になる。
#   本番実測(2026-09-28): 32人・214日ぶんがこの状態。
#   → 画面を開いたときにサーバの記録を見て、端末側に無い日を書きもどす（自己修復）。
#     すでに取っている /api/homework/my の返事を使うので通信もクエリも増えない。
#     端末側にある日は上書きしない。LIMIT は 30->120（6月に消えた日も救うため）。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi)'
        required: true
        default: '158'
        type: string

permissions:
  contents: write

