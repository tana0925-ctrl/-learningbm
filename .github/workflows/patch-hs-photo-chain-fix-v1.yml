      - name: syntax check
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/after.js --log-level=warning
          node --check /tmp/after.js
      - name: public/index.html は1バイトも変えない
        run: |
          if ! git diff --quiet -- public/index.html; then echo "::error::public/index.html changed"; exit 1; fi
      - name: commit and push
        run: |
          git add src/index.tsx scripts/patch_hs_photo_chain_fix_v1.py
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          git --no-pager diff --cached --stat
          git commit -m "HS_PHOTO_CHAIN_FIX_V1: 配信チェーンが multiple を剥がして複数まいを殺していたのを修正/旧写真欄の撤去とボーナス案内を復活 (チェーン123->123)"
