name: patch-hs-photo-chain-fix-v1

# HS_PHOTO_CHAIN_FIX_V1 (2026-09-24)
#   配信チェーンの写真まわりの置換（2026-09-11 の hs-photo-submit-20260911）と、
#   今日の HS_PHOTO_MULTI_V1 が食いちがっていたのを直す。
#   ・P1 旧ブロック撤去の目印が変わって効かなくなり、旧い写真欄が復活していた
#   ・P2 見出しが変わって効かなくなり、ボーナスの案内文が消えていた
#   ・P3 だけ効き続けていて、multiple を剥がして1まいに戻していた ← 複数まいが死んでいた原因
#   置換の本数は増やさない（チェーン123のまま）。中身だけ実態に合わせる。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi)'
        required: true
        default: '123'
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          sha256sum src/index.tsx public/index.html
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
