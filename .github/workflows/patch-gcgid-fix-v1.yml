      - name: syntax check (src/index.tsx)
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/a.js --log-level=warning
          node --check /tmp/a.js
      - name: syntax check (haishin sareru HTML no script zenbu)
        run: |
          cat > /tmp/chk.js <<'JSEOF'
          const fs=require('fs'), vm=require('vm');
          const pairs=JSON.parse(fs.readFileSync('/tmp/gcgid_pairs.json','utf8'));
          let t=fs.readFileSync('public/index.html','utf8');
          for(const p of pairs){ if(t.indexOf(p.a)===-1){ console.log('::error::anchor missing '+p.tag); process.exit(1);} t=t.replace(p.a,()=>p.b); }
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m,i=0,bad=0,checked=0;
          while((m=re.exec(t))){ i++; const a=m[1]||'',b=m[2]||'';
            if(/\bsrc\s*=/.test(a)||!b.trim()) continue;
            if(/type\s*=\s*["']?(application\/json|text\/template|text\/x-)/i.test(a)) continue;
            checked++;
            try{ new vm.Script(b,{filename:'s'+i}); }catch(e){ bad++; console.log('::error::script #'+i+': '+String(e.message).split('\n')[0]); }
          }
          console.log('inline scripts checked='+checked+' syntax errors='+bad);
          if(bad) process.exit(1);
          const src=fs.readFileSync('src/index.tsx','utf8');
          const need=[['P1 _defRenderBattle', src.split('window._defRenderBattle=function(rep){try{_gcGid=null;').length-1, 1],
                      ['P2 _gcReward guard', t.split('if(gymId===null||gymId===undefined) return 0;').length-1, 1],
                      ['P3 _gcPbLaunch', t.split("trySetMode('gymchallenge'); _gcGid=null; _gcReplay=autoBattleRT").length-1, 1]];
          let ok=true;
          for(const [k,got,want] of need){ console.log('  '+k+': '+got+' (expect '+want+')'); if(got!==want){ console.log('::error::'+k); ok=false; } }
          const assigns=(t.match(/_gcGid\s*=[^=]/g)||[]).length;
          console.log('  _gcGid assignments in html: '+assigns+' (expect 3)');
          if(assigns!==3) ok=false;
          if(/_gcGid\s*=\s*_sv/.test(src)){ console.log('::error::taihi-fukki no kata ga aru'); ok=false; }
          console.log(ok?'OK':'NG');
          process.exit(ok?0:1);
          JSEOF
          sed -i 's/^          //' /tmp/chk.js
          node /tmp/chk.js
      - name: public/index.html wa kaenai
        run: if ! git diff --quiet -- public/index.html; then echo "::error::html changed"; exit 1; fi
      - name: commit and push
        run: |
          git add src/index.tsx scripts/patch_gcgid_fix_v1.py
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          git commit -m "GCGID_FIX_V1: 防衛戦のリプレイがジムチャレンジのクリアを勝手に書きこむのを停止（_gcGidをnullに戻す・_gcRewardにnullガード・友達対戦も同様）"
          git push origin HEAD:main
