name: patch-gcgid-fix-v1

# GCGID_FIX_V1 (2026-09-25)
#   防衛戦のリプレイで勝つと、遊んでいないジムチャレンジが
#   「クリア済み」として児童データに書きこまれるのを止める。
#   証拠: gymChallengeCleared に "null" キーが 11人ぶん残っていた。
#
#   P1 _defRenderBattle で _gcGid = null（❗ 退避して戻す形にしない。
#      _gcFinishReplay() は非同期なので、戻すと結局そこで拾われる）
#   P2 _gcReward に null ガード（"null" キーを新しく作らない）
#   P3 _gcPbLaunch（友達対戦のプログラム対戦）でも _gcGid = null
#
#   ❗ public/index.html は 1バイトも変えない
#   ❗ progress（児童のデータ）には書きこまない。DDLも無し
#   ❗ 既に入っている "null" キーの掃除は ここではやらない（先生の判断待ち）

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu'
        required: true
        default: '156'
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout -- .
      - name: rebase
