name: inspect-zombie-unlock v3 (report2)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: shirabe
        run: |
          python3 - << 'PYEOF' > /tmp/report2.txt
          h = open('public/index.html', encoding='utf-8').read()
          hl = h.split(chr(10))
          def dump(name, needle, before, after, maxhit):
              print('===== ' + name + ' =====')
              idx = [k for k, L in enumerate(hl) if needle in L]
              print('hits:', len(idx), [k + 1 for k in idx][:30])
              for k in idx[:maxhit]:
                  for m in range(max(0, k - before), min(len(hl), k + after)):
                      print(m + 1, repr(hl[m]))
                  print('-----')
          dump('zUnlocked', 'zUnlocked', 30, 45, 1)
          dump('maxUnlocked', 'maxUnlocked', 25, 40, 1)
          dump('renderWarStageList', 'renderWarStageList', 1, 3, 3)
          dump('selectWarStage', 'selectWarStage', 1, 3, 11)
          for t in ['window.startZombieWarFromPreview = function() {', 'let zUnlocked = 1;', 'let maxUnlocked = (player.warProgress.unlocked||1);']:
              print('EXACT', repr(t), h.count(t))
          PYEOF
          mkdir -p docs
          python3 -c "d=open('/tmp/report2.txt',encoding='utf-8').read();open('docs/inspect_zombie_v2.txt','w',encoding='utf-8').write(d.replace(chr(32),chr(183)))"
          wc -c docs/inspect_zombie_v2.txt

      - name: push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/inspect_zombie_v2.txt
          git commit -m 'inspect: zombie unlock report 2'
          git pull --rebase origin main
          git push origin HEAD:main
