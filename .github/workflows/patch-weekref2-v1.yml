name: patch-weekref2-v1

# WEEKREF2_V1 🔄 週の振り返りを充実させる（金曜に学校でみんなで振り返る／月曜にカルテを見ながら計画）
#  ・子ども（かんたんふりかえりの欄の中・ぜんぶで3分くらい）：
#    💡友だちの見本（みんなのふりかえりの最新の採用分を1つ・名前は同意どおり・無ければ出さない）
#    🤝先週決めたこと、どうだった？（先週の「次どうする？」「来週やってみたいこと」と今週の計画 → できた／ちょっと／できなかった＋わけ・責めない言い方）
#    📊今週の自分の記録（開いた日・単元の正答 先週→今週・計画を書いた日のうち家庭学習を出した日。事実だけ・比較や順位なし）
#    🏫学校での学び（教科／⑥授業メモの「教科：単元」の行だけを候補に → わかったこと → もっと知りたいこと）
#    💭週ごとに変わる考える問い（15こをローテーション・任意）
#    提出は いつもの週の振り返りとひとまとめ（20コインは既存の台帳のまま週1回・week-ref2 はコインを動かさない）
#  ・先生：📋振り返り一覧のタイルに ひと往復の下書きをそのまま表示・「このまま返す」・「下書きをまとめて返却」
#    （🟡NG語・⚠ほかの子の名前・🔄下書きのあとで書き直し は一括から外す。返却は既存の reflection-comments）
#    今日のひと往復の材料とAIへの指示に 1〜4 を追加（本人の言葉を拾って具体的に・否定語NGは維持）
#    タイル・カルテ（個人分析）・前の自分ページ・月曜の計画のカルテ要点に 先週の約束の結果と学校での学び
#  ・新規: src/weekref2.ts、public/weekref2.js、migrations/0047_week_ref2.sql（本番には先に流してある）。DDL はリクエスト経路に入れていない。
#  ・テスト：coin_ledger 51/51（新5件）＋ viewas 14/14。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

