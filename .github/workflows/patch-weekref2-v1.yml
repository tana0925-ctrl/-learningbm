      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'WEEKREF2_V1' src/index.tsx) -ge 4
          grep -q "import { registerWeekRef2, wr2ForClass } from './weekref2'" src/index.tsx
          grep -q "registerWeekRef2(app, { weekRefAllowedKeys })" src/index.tsx
          grep -q "app.get('/weekref2.js'" src/index.tsx
          grep -q '<script src="/weekref2.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/kantanref.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/minnafuri.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/teacher-ai.js?v=15"></script>' src/index.tsx
          grep -q '<script src="/teibako.js?v=3"></script>' src/index.tsx
          grep -q 'WEEKREF2_V1' src/minna.tsx
          for f in kantanref maejibun teacher-ai teibako; do grep -q 'WEEKREF2_V1' public/$f.js; done
          grep -q 'var TAI_NG_WORDS' public/teacher-ai.js
          test -f public/weekref2.js && test -f src/weekref2.ts && test -f migrations/0047_week_ref2.sql
          ! grep -n -E "CREATE (TABLE|INDEX)|ALTER TABLE" src/weekref2.ts
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/weekref2.js public/kantanref.js public/maejibun.js public/teacher-ai.js public/teibako.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts)
        if: env.SKIP != '1'
        run: node scripts/render_check.mjs
      - name: tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          npx esbuild src/viewas.ts --bundle --format=esm --platform=neutral --outfile=tests/viewas.mod.mjs --log-level=warning
          cd tests
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs 2>/dev/null | grep -E "^(PASS|FAIL)|passed"
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs > /dev/null 2>&1
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs 2>/dev/null | grep -E "passed"
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs > /dev/null 2>&1
          rm -f app.after.mjs viewas.mod.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx src/minna.tsx src/weekref2.ts public/weekref2.js public/kantanref.js public/maejibun.js public/teacher-ai.js public/teibako.js migrations/0047_week_ref2.sql tests/coin_ledger.test.mjs tests/d1.mjs
          git commit -m "WEEKREF2_V1: 週の振り返りを充実（先週決めたこと→できた/ちょっと/できなかった＋わけ・今週の記録は事実だけ・週替わりの考える問い・🏫学校での学び〔⑥授業メモの教科：単元を候補に〕・友だちの見本）＋📋一覧のタイルにひと往復の下書き・このまま返す/まとめて返却（NG語・名前・書き直しは除外）・AIへの指示に材料を追加・カルテ/前の自分/月曜の計画に約束の結果と学校での学び（migration 0047・コインは既存の週1回のまま・テスト51/51＋14/14）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
