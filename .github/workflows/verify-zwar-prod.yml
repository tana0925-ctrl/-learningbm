name: ZWAR_UNLOCK_V1 本番の生存確認（GETのみ）

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 本番を GET して確かめる
        run: |
          B=https://learning-bm.pages.dev
          curl -sS --max-time 120 -o /tmp/prod.html "$B/"
          curl -sS --max-time 120 -o /tmp/defense2.js "$B/defense2.js"
          curl -sS --max-time 120 -o /tmp/defstage_monsters.js "$B/defstage_monsters.js"
          curl -sS --max-time 120 -o /tmp/def_join_nudge.js "$B/def_join_nudge.js"
          ls -l /tmp/prod.html /tmp/defense2.js /tmp/defstage_monsters.js /tmp/def_join_nudge.js
          python3 - << 'PYEOF' > /tmp/vr.txt
          import importlib.util, os, sys
          sp = importlib.util.spec_from_file_location('zw', 'scripts/patch_zwar_unlock_v1.py')
          m = importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)

          prod = open('/tmp/prod.html', encoding='utf-8', errors='replace').read()
          raw = open('public/index.html', encoding='utf-8').read()
          d2 = open('/tmp/defense2.js', encoding='utf-8', errors='replace').read()
          dm = open('/tmp/defstage_monsters.js', encoding='utf-8', errors='replace').read()
          dj = open('/tmp/def_join_nudge.js', encoding='utf-8', errors='replace').read()

          ok = True
          def chk(label, got, want):
              global ok
              mark = 'OK ' if got == want else 'NG '
              if got != want:
                  ok = False
              print(mark + label + ' : ' + str(got) + ' (want ' + str(want) + ')')

          print('prod bytes:', len(prod), '/ public/index.html bytes:', len(raw))
          if prod == raw:
              print('NG chain died: prod is the bare public/index.html')
              ok = False
          elif len(prod) <= len(raw):
              print('NG prod is not longer than the bare file')
              ok = False
          else:
              print('OK chain alive: prod is longer than the bare file by', len(prod) - len(raw))

          print('--- zombie fix ---')
          chk('sentinel in prod', prod.count(m.SENTINEL), 2)
          chk('guard installed (_zcur > _zi)', prod.count('_zcur > _zi'), 1)
          chk('alert text', prod.count('ばんめの'), 1)
          chk('old zombie gate A removed', prod.count(m.A_OLD), 0)
          chk('old zombie gate B removed', prod.count(m.B_OLD), 0)
          chk('A replaced', prod.count(m.A_NEW), 1)
          chk('B kept once', prod.count(m.B_NEW), 1)

          print('--- normal mode untouched ---')
          chk('stage list lock', prod.count('const isLocked = isZombie ? (pref.index >= zUnlocked) : (pref.index >= progress.unlocked);'), 1)
          chk('selectWarStage gate', prod.count('if(i >= maxUnlocked) return;'), 1)
          chk('clearedMax still used', prod.count('progress.clearedMax'), raw.count('progress.clearedMax'))

          print('--- survivors in prod html ---')
          for k in ['__DEFSTAGE_SENTINEL_V1__', '__DEF_MVP_V1__', '__S6WORLD_50__',
                    '__H6MERGE_SRC_V1__', '__H6BANK_LIVE_V1__', '_H6U11ADD_V1',
                    'HS_NEXT_RECALL_V1', '__DEFBOSS_V1', 'defstage_monsters.js',
                    'def_join_nudge.js']:
              n = prod.count(k)
              print(('OK ' if n > 0 else 'NG ') + k + ' prod=' + str(n) + ' raw=' + str(raw.count(k)))
              if n == 0:
                  ok = False

          print('--- survivors in defense2.js ---')
          for k in ['DEF2SEND_GUARD_V1_MARK', 'DEF2TPL_LEARN_V1', 'DEF2TALLY_TREE_V2',
                    'DEF2TRY_', 'DEF_LV50_V1', 'foeLaneMix', 'baseMax||380']:
              n = d2.count(k)
              print(('OK ' if n > 0 else 'NG ') + k + ' = ' + str(n))
              if n == 0:
                  ok = False

          print('--- side files ---')
          print('defstage_monsters.js bytes:', len(dm))
          print('def_join_nudge.js bytes:', len(dj))
          if len(dm) < 100 or len(dj) < 100:
              print('NG side file looks empty')
              ok = False

          print('--- no demotion path ---')
          for k in ['stage - 1', 'stage-1', 'clearedMax - 1', 'unlocked - 1']:
              print(k, 'prod=', prod.count(k), 'raw=', raw.count(k), 'd2=', d2.count(k))
          chk('ensureDefenseTables() in prod html', prod.count('ensureDefenseTables()'), 0)

          print('RESULT:', 'OK' if ok else 'NG')
          PYEOF
          cat /tmp/vr.txt
          mkdir -p docs
          python3 -c "d=open('/tmp/vr.txt',encoding='utf-8').read();open('docs/verify_zwar_prod.txt','w',encoding='utf-8').write(d.replace(chr(32),chr(183)))"
          grep -q 'RESULT: OK' /tmp/vr.txt

      - name: 結果を置く
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/verify_zwar_prod.txt || true
          git commit -m 'verify: zwar prod report' || echo nochange
          git pull --rebase origin main
          git push origin HEAD:main
