name: patch-plan-loop-hotfix

# PLAN_LOOP_HOTFIX (2026-09-25) 緊急
#   教師ダッシュボードの本体スクリプト(33万文字)が SyntaxError で丸ごと止まっている。
#   テンプレートリテラルの中で onclick の \' を 1段だけにしたため、
#   配信後の JS で文字列が途中で閉じていた。
#   対象は 4か所（QRHUNT_V1 の2か所 と PLAN_LOOP_V1 の2か所）。
#   HTMLエンティティ &#39; に置きかえて段数に左右されないようにする。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu'
        required: true
        default: '132'
        type: string

permissions:
  contents: write

