name: 防衛戦 修正1（DEFMOP_BASE_V1・基地をこわしたら reason=base）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを綺麗にする
        run: git checkout -- .

      - name: origin/main に追いつく
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: さわらないファイルの ハッシュを ひかえる
        run: sha256sum public/index.html src/index.tsx src/def_engine.ts src/def_resolve.ts public/defense2.js > /tmp/before.txt

      - name: チェーンの本数を実測する（158 でなければ中止）
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('chain before =', n)
          if n != 158:
              print('NG: チェーンが 158 件でない'); sys.exit(1)
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_defmop_base_v1.py

      - name: 冪等の確認（2回流しても増えない）
        run: python3 scripts/patch_defmop_base_v1.py

      - name: 変わったのが src/defmop_v1.ts だけであること
        run: |
          git diff --name-only
          if git diff --name-only | grep -vFx 'src/defmop_v1.ts' | grep -q .; then
            echo 'NG: src/defmop_v1.ts 以外が変わっている'; exit 1
          fi
          sha256sum -c /tmp/before.txt

      - name: チェーンを実際に当てて 配信される HTML を作り、全 script を node --check する
        run: |
          node - << 'JSEOF'
          const fs = require('fs');
          const ts = fs.readFileSync('src/defmop_v1.ts', 'utf8');
          let js = ts.replace(/export type[\s\S]*?\n/, '').replace(/^export /gm, '').replace(/: DefMopPatch\[\]/, '');
          js += '\nmodule.exports=DEFMOP_V1_PATCHES;';
          const m = { exports: {} };
          new Function('module', 'exports', js)(m, m.exports);
          let t = fs.readFileSync('public/index.html', 'utf8');
          for (const p of m.exports) {
            if (t.indexOf(p.a) < 0) { console.log('NG: アンカーが無い ' + p.tag); process.exit(1) }
            t = t.replace(p.a, () => p.b);
          }
          if ((t.split('__DEFMOP_BASE_V1__').length - 1) !== 1) { console.log('NG: __DEFMOP_BASE_V1__ が 1 件でない'); process.exit(1) }
          fs.writeFileSync('/tmp/chained.html', t);
          console.log('chained html =', t.length, 'chars');
          JSEOF
          python3 - << 'PYEOF'
          import re, io, subprocess, sys
          h = io.open('/tmp/chained.html', encoding='utf-8', errors='replace').read()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', h, re.S)
          print('inline script blocks:', len(blocks))
          if len(blocks) < 10:
              print('NG: script ブロックが少なすぎる'); sys.exit(1)
          bad = 0
          for i, b in enumerate(blocks):
              p = '/tmp/sb_%d.js' % i
              io.open(p, 'w', encoding='utf-8').write(b)
              r = subprocess.run(['node', '--check', p], capture_output=True, text=True)
              if r.returncode != 0:
                  bad += 1
                  print('SYNTAX ERROR block %d: %s' % (i, r.stderr.splitlines()[:4]))
          print('bad =', bad)
          if bad:
              sys.exit(1)
          PYEOF

      - name: 本番の HTML に同じ直しを当てて オフライン検証
        run: |
          curl -sS -m 180 https://learning-bm.pages.dev/ -o /tmp/prod.html
          wc -c /tmp/prod.html
          node - << 'JSEOF'
          const fs = require('fs');
          const A = "if(CONTACT){ _cAttack(f); if(!alive(A).length||!alive(B).length){ /* __DEFMOP_V1__ */ if(!_mopOn()){ ended=true; break; } }";
          const p = fs.readFileSync('/tmp/prod.html', 'utf8');
          if (p.length < 3000000) { console.log('NG: 本番 HTML が短すぎる'); process.exit(1) }
          const n = p.split(A).length - 1;
          if (n !== 1) { console.log('NG: 本番のアンカーが ' + n + ' 件'); process.exit(1) }
          const ts = fs.readFileSync('src/defmop_v1.ts', 'utf8');
          const mm = ts.match(/const B_HIT = "([\s\S]*?)"\n/);
          if (!mm) { console.log('NG: B_HIT が読めない'); process.exit(1) }
          fs.writeFileSync('/tmp/prod_fixed.html', p.replace(A, () => mm[1]));
          console.log('ok');
          JSEOF
          node tests/def_mop_check.mjs html /tmp/prod.html /tmp/prod_fixed.html

      - name: ビルドが通ること（dist は元に戻す）
        run: |
          npm install
          npm run build
          git checkout -- dist package-lock.json 2>/dev/null || true
          git clean -fdq dist 2>/dev/null || true
          git status --porcelain

      - name: 流したあとの検証
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          m = io.open('src/defmop_v1.ts', encoding='utf-8').read()
          ok = [True]
          def chk(label, got, want):
              if got != want:
                  print('NG: %s が %s 件（期待 %s）' % (label, got, want)); ok[0] = False
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          chk('チェーン', s[i:j].count('.replace('), 158)
          chk('番兵 BASE', m.count('__DEFMOP_BASE_V1__'), 1)
          chk('B_HIT の定義', m.count('const B_HIT = '), 1)
          chk('M01', m.count("{ tag: 'M01_decl', a: A_DECL, b: B_DECL }"), 1)
          chk('M02', m.count("{ tag: 'M02_hit', a: A_HIT, b: B_HIT }"), 1)
          chk('M03', m.count("{ tag: 'M03_tail', a: A_TAIL, b: B_TAIL }"), 1)
          chk('DEFMOP の取り込み', s.count("import { DEFMOP_V1_PATCHES } from './defmop_v1'"), 1)
          chk('基地HP 380', s.count('DEFENSE_BASE_HP = 380'), 1)
          chk('ensureDefenseTables() の呼び出し', s.count('ensureDefenseTables()'), 0)
          if not ok[0]:
              sys.exit(1)
          print('検証 OK')
          PYEOF

      - name: コミットして push
        run: |
          git add src/defmop_v1.ts
          if git diff --cached --quiet; then
            echo '変更なし（すでに適用済み）'; exit 0
          fi
          git commit -m 'DEFMOP_BASE_V1: 防衛戦で基地をこわして勝ったのに終了理由が「全滅」のままだった件を修正（チェーン158->158）'
          git pull --rebase origin main
          git push origin HEAD:main
