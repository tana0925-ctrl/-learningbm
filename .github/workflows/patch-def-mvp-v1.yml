name: 防衛戦 第4便（DEF_MVP_V1・部門べつ ベスト3）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを綺麗にする
        run: git checkout -- .

      - name: origin/main に追いつく
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 流す前にチェーンとアンカーの一意性を実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          v = io.open('src/def_resolve.ts', encoding='utf-8').read()
          d = io.open('public/defense2.js', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          applied = 'async function defMvpMakeLedger(' in s
          print('chain before =', n, 'applied =', applied)
          if n != 82:
              print('NG: 流す前のチェーンが 82 件でない'); sys.exit(1)
          if not applied:
              for label, t, f in [
                  ('root', "app.get('/', async (c) => {", s),
                  ('logout', "app.get('/logout'", s),
                  ('resolve', "app.post('/api/defense/resolve'", s),
                  ('status', "app.get('/api/defense/status'", s),
                  ('dry-run', "app.get('/api/teacher/defense/dry-run'", s),
                  ('defense2.js の版', '<script src="/defense2.js?v=14"></script>', s),
                  ('サーバ計算の入口', 'export async function defServerResolve(', v),
                  ('ベスト3の差しこみ口', 'return hero + spot + gauge;', d),
              ]:
                  c = f.count(t)
                  if c != 1:
                      print('NG: アンカー %s が %d 件（期待 1）' % (label, c)); sys.exit(1)
              if s.count('defense_mvp_rewards') != 0:
                  print('NG: defense_mvp_rewards がすでに src/index.tsx にある'); sys.exit(1)
              print('アンカーはすべて一意')
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_def_mvp_v1.py

      - name: 冪等の確認（2回流しても増えない・番兵で抜ける）
        run: python3 scripts/patch_def_mvp_v1.py

      - name: 触ってはいけないファイルが無傷であること
        run: |
          git diff --name-only
          if git diff --name-only | grep -vE '^(src/index\.tsx|src/def_resolve\.ts|public/defense2\.js)$' | grep -q .; then
            echo 'NG: 3つ以外のファイルが変わっている'; exit 1
          fi

      - name: 流したあとの検証
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          e = io.open('src/def_engine.ts', encoding='utf-8').read()
          v = io.open('src/def_resolve.ts', encoding='utf-8').read()
          d = io.open('public/defense2.js', encoding='utf-8').read()
          g = io.open('src/def_stage.ts', encoding='utf-8').read()
          ok = [True]
          def chk(label, got, want):
              if got != want:
                  print('NG: %s が %s 件（期待 %s）' % (label, got, want)); ok[0] = False
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('replace chain:', n)
          chk('チェーン', n, 82)
          # --- 今回入れたもの ---
          chk('番兵 index', s.count('__DEF_MVP_V1__'), 6)
          chk('番兵 resolve', v.count('__DEF_MVP_V1__'), 4)
          chk('番兵 defense2', d.count('__DEF_MVP_V1__'), 1)
          chk('台帳を作る関数の定義', s.count('async function defMvpMakeLedger('), 1)
          chk('台帳を作る関数の呼び出し', s.count('await defMvpMakeLedger(c.env, st.eventKey, classId,'), 1)
          chk('付与関数の定義', s.count('async function applyDefMvpGrants('), 1)
          chk('付与関数の呼び出し', s.count('await applyDefMvpGrants(c.env, u.id)'), 1)
          chk('枠の予約', s.count("UPDATE defense_mvp_rewards SET applied_at = datetime('now')"), 1)
          chk('枠の解放', s.count('UPDATE defense_mvp_rewards SET applied_at = NULL'), 1)
          chk('コインの json_set', s.count("'$._defMvpCoinsApplied'"), 2)
          chk('水増しガード', s.count('} else if (_cliMv > _srvMv) {'), 1)
          chk('サーバ累計の読み取り', s.count('_srv._defMvpCoinsApplied'), 1)
          chk('枚数の定数（サーバ）', s.count('const DEF_MVP_COINS_SRV = [0, 40, 30, 20]'), 1)
          chk('自分のきろくだけ返す', s.count('out.my_def_record'), 1)
          chk('defense2.js の版 v15', s.count('/defense2.js?v=15'), 1)
          chk('defense2.js の版 v14', s.count('/defense2.js?v=14'), 0)
          chk('指標の計算', v.count('function defMvpAwards('), 1)
          chk('枚数の定数（計算側）', v.count('const DEF_MVP_COINS = [0, 40, 30, 20]'), 1)
          chk('成立条件', v.count('if (nz < 3 || uniq.length < 2) return null'), 1)
          chk('log に awards', v.count('awards: (_mv && _mv.awards) ? _mv.awards : null,'), 1)
          chk('台帳のもと', v.count('mvpLedger:'), 1)
          chk('user_id の取り出し', v.count('de.user_id AS uid'), 1)
          chk('見た目の関数', d.count('function def2AwardsHtml('), 1)
          chk('見た目の差しこみ', d.count('return hero + spot + def2AwardsHtml(log, st) + gauge;'), 1)
          # --- 表づくりはリクエストパスで流さない ---
          chk('CREATE TABLE', s.count('CREATE TABLE'), 21)
          chk('CREATE INDEX', s.count('CREATE INDEX'), 2)
          chk('ALTER TABLE', s.count('ALTER TABLE'), 21)
          chk('ensureDefenseTables() の呼び出し', s.count('ensureDefenseTables()'), 0)
          # --- 降格の経路がないこと ---
          chk('stage - 1', s.count('stage - 1'), 0)
          chk('stage-1', s.count('stage-1'), 0)
          chk('ステージ前進', s.count('UPDATE defense_stage SET stage = stage + 1'), 2)
          # --- 壊してはいけないもの ---
          chk('__DEFSTAGE_SENTINEL_V1__', s.count('__DEFSTAGE_SENTINEL_V1__'), 1)
          chk('__DEF_SNAP_SPDSKILLS_V1__', s.count('__DEF_SNAP_SPDSKILLS_V1__'), 1)
          chk('__DEF_RESOLVE_VERIFY_V1__', s.count('__DEF_RESOLVE_VERIFY_V1__'), 1)
          chk('log の v === 2 条件', s.count('Number(_dvLog.v) === 2'), 1)
          chk('baseHpA の有限数条件', s.count('Number.isFinite(Number(_dvRep.baseHpA))'), 1)
          chk('retry true', s.count('retry: true'), 2)
          chk('log の 900000 上限 index', s.count('900000'), 1)
          chk('log の 900000 上限 resolve', v.count('900000'), 1)
          chk('defense_standing', s.count('defense_standing'), 4)
          chk('defense_carry_lock', s.count('defense_carry_lock'), 1)
          chk('defAutoAdvanceV1', s.count('defAutoAdvanceV1'), 3)
          chk('defEntryOk index', s.count('defEntryOk'), 3)
          chk('defEntryOk resolve', v.count('defEntryOk'), 2)
          chk('defStageEnemies の呼び出し', s.count('defStageEnemies('), 3)
          chk('defStageMakeLedger', s.count('defStageMakeLedger'), 3)
          chk('applyDefStageGrants', s.count('applyDefStageGrants'), 2)
          chk('_defStageCoinsApplied', s.count('_defStageCoinsApplied'), 8)
          chk('needs_reselect', s.count('needs_reselect'), 3)
          chk('基地HP 380', s.count('DEFENSE_BASE_HP = 380'), 1)
          chk('勝利コイン 20', s.count('DEFENSE_WIN_COINS = 20'), 1)
          chk('もとからある全置換の数', s.count('UPDATE progress SET state_json=?'), 11)
          chk('__S6WORLD_50__', s.count('__S6WORLD_50__'), 1)
          chk('__H6MERGE_SRC_V1__', s.count('__H6MERGE_SRC_V1__'), 1)
          chk('__H6BANK_LIVE_V1__', s.count('__H6BANK_LIVE_V1__'), 1)
          chk('__H6U11_BOOST_V1__', s.count('__H6U11_BOOST_V1__'), 1)
          chk('def_join_nudge.js', s.count('def_join_nudge.js'), 4)
          chk('defstage_monsters.js', s.count('defstage_monsters.js'), 4)
          chk('def_engine の autoBattleRT', e.count('function autoBattleRT('), 1)
          chk('def_resolve の番人', v.count('export function defEntryOk(m) {'), 1)
          # --- 敵のつよさの曲線は 1文字も変えていない ---
          chk('DEF_STAGE_V3_CURVE', g.count('DEF_STAGE_V3_CURVE'), 1)
          chk('曲線 hp', g.count('1 + 25 * u'), 1)
          chk('曲線 spd', g.count('10 + 230 * u'), 1)
          chk('曲線 spd の段条件', g.count('if (k > 0) o.spd'), 1)
          chk('def_stage の関数', g.count('export function defStageEnemies('), 1)
          # --- defense2.js の 壊してはいけないもの ---
          chk('DEF2TRY_V1_MARK', d.count('DEF2TRY_V1_MARK'), 1)
          chk('DEF2TRY_RULETALLY_V1', d.count('DEF2TRY_RULETALLY_V1'), 1)
          chk('DEF2TALLY_TREE_V2', d.count('DEF2TALLY_TREE_V2'), 1)
          chk('DEF2TRY_NOWCSS_V1', d.count('DEF2TRY_NOWCSS_V1'), 1)
          chk('DEF2SEND_GUARD_V1_MARK', d.count('DEF2SEND_GUARD_V1_MARK'), 1)
          chk('DEF2TPL_LEARN_V1', d.count('DEF2TPL_LEARN_V1'), 3)
          chk('__DEF2_SKIP_LOCAL_V1__', d.count('__DEF2_SKIP_LOCAL_V1__'), 1)
          chk('makeResolve', d.count('function makeResolve(orig){'), 1)
          chk('この下は うごきません', d.count('⬇ この下は うごきません'), 1)
          # --- 外した動作が復活していないこと（数が増えていない） ---
          chk('attackFort', d.count('attackFort'), 2)
          chk('advanceFront', d.count('advanceFront'), 3)
          chk('retreatBack', d.count('retreatBack'), 3)
          chk('aimWeakest', d.count('aimWeakest'), 2)
          chk('defendFort', d.count('defendFort'), 2)
          chk('scatter', d.count('scatter'), 3)
          chk('てきが近づいてきた', d.count('てきが近づいてきた'), 0)
          chk('自分が拠点の上にいる', d.count('自分が拠点の上にいる'), 0)
          # --- dry-run は書き込みゼロ ---
          _a = s.index("app.get('/api/teacher/defense/dry-run'")
          _b = s.index("app.post('/api/defense/resolve'", _a)
          _blk = s[_a:_b]
          for _w in ('INSERT', 'UPDATE', 'DELETE', '.run()', '.batch('):
              if _w in _blk:
                  print('NG: dry-run に書き込み %s が入っている' % _w); ok[0] = False
          # --- 敵の素は変えていない ---
          _i = s.index('const DEFENSE_ENEMIES = [')
          _j = s.index(chr(10) + ']', _i)
          chk('敵の体数', s[_i:_j].count('{ name:'), 8)
          chk('まおうの素の値', s.count('hp: 520, atk: 60, def: 24'), 1)
          if not ok[0]:
              sys.exit(1)
          print('検証 OK')
          PYEOF

      - name: ビルドが通ること（dist は元に戻す）
        run: |
          npm install
          npm run build
          git checkout -- dist package-lock.json 2>/dev/null || true
          git clean -fdq dist 2>/dev/null || true
          echo '--- build 後の差分 ---'
          git status --porcelain

      - name: コミットして push
        run: |
          git add src/index.tsx src/def_resolve.ts public/defense2.js
          if git diff --cached --quiet; then
            echo '変更なし（すでに適用済み）'; exit 0
          fi
          git commit -m 'DEF_MVP_V1: 防衛戦の部門べつ ベスト3（せめ／ねばり／まもり）。成り立たない部門は出さない。枚数も資格もサーバ側の定数だけで決める'
          git pull --rebase origin main
          git push origin HEAD:main
