      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'WEEKREF_V1' src/index.tsx) -ge 6
          grep -q 'WEEK_REF_BONUS_COINS = 20' src/index.tsx
          grep -q '<script src="/weekref.js?v=1"></script>' src/index.tsx
          grep -q "app.get('/weekref.js'" src/index.tsx
          grep -q 'WEEKREF_V1' public/teacher-ai.js
          test -f public/weekref.js
          test -f migrations/0042_week_ref_rewards.sql
          ! grep -n "CREATE TABLE" src/index.tsx | grep -i week_ref
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/weekref.js public/teacher-ai.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: coin ledger tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          node --no-warnings tests/coin_ledger.test.mjs ./app.after.mjs
          rm -f tests/app.after.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/teacher-ai.js public/weekref.js migrations/0042_week_ref_rewards.sql tests/coin_ledger.test.mjs tests/d1.mjs
          git commit -m "WEEKREF_V1: 週の振り返りを先週・2週前から返せるように（自由欄も読む・🌟と二重にしない・入らなかった分の一覧）＋阪神マンの声かけ・書き出しのヒント・1週1回20コイン（台帳INSERT・migration 0042・テスト27/27）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
