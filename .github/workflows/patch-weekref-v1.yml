name: patch-weekref-v1

# WEEKREF_V1 週の振り返り
#  ・今日のひと往復：まだ返していない直近の週（先週／2週前・金〜日は今週も）の振り返りを対象。自由欄も読む。
#    目印に週を書き、公開のときにその週へ返す。家庭学習シートの🌟と二重に返さない。入らなかった分の一覧に追加。
#    金曜の自動ONに加え、月〜木も先週の未返却があればON。
#  ・子ども：阪神マンの声かけ（金土日・1日1回）・書き出しのヒント・1週1回20コイン（台帳INSERT）・2週前の返事の表示
#  ・新規: public/weekref.js、migrations/0042_week_ref_rewards.sql（本番には先に流してある）
#  ・DDL はリクエスト経路に入れていない。テスト 27/27。最後に deploy.yml を起動する。

