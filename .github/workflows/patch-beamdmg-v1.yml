name: ビーム2 いりょくの のび（BEAMDMG_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: さぎょうツリーを きれいにする
        run: git checkout -- .

      - name: origin/main に おいつく
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 流す直前に チェーンを 実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          if s.count("app.get('/', async (c) => {") != 1:
              print('NG: 家の入口が 一意で ない'); sys.exit(1)
          if s.count("app.get('/logout'") != 1:
              print('NG: 出口が 一意で ない'); sys.exit(1)
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('chain before =', n)
          io.open('/tmp/chain_before.txt', 'w').write(str(n))
          PYEOF

      - name: パッチを 当てる（合わなければ 1文字も 書かずに 中止）
        run: python3 scripts/patch_beamdmg_v1.py

      - name: さわってはいけない ファイルが 無傷か
        run: |
          git diff --quiet -- public || (echo 'NG: public が 変わっている'; exit 1)
          git diff --quiet -- migrations || (echo 'NG: migrations が 変わっている'; exit 1)
          git status --porcelain
          echo '--- src/index.tsx の さしぶん ---'
          git diff --numstat -- src/index.tsx
          test "$(git diff --numstat -- src/index.tsx | cut -f2)" = "0" || (echo 'NG: src/index.tsx で 行が 消えている'; exit 1)

      - name: ビルドが 通ることを 確認（通らなければ push しない）
        run: |
          npm install
          npm run build

      - name: 中身と 番兵を たしかめる
        run: |
          python3 scripts/patch_beamdmg_v1.py --verify
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          d = io.open('public/defense2.js', encoding='utf-8', newline='').read()
          before = int(io.open('/tmp/chain_before.txt').read().strip())
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          now = s[i:j].count('.replace(')
          ok = True
          if before != 97:
              print('NG: 直前の チェーンが', before, '（97 のはず）'); ok = False
          if now != 98:
              print('NG: いまの チェーンが', now, '（98 のはず）'); ok = False
          else:
              print('チェーン', before, '->', now)
          for name in ('__ZWEAK_V1__', '__ZWAR_UNLOCK_V1__', 'startZombieWarFromPreview',
                       '__DEFSTAGE_SENTINEL_V1__', '__DEF_MVP_V1__', 'DEF_LV50_V1', 'foeLaneMix',
                       '__S6WORLD_50__', '__H6MERGE_SRC_V1__', '__H6BANK_LIVE_V1__',
                       '__H6U11_BOOST_V1__', '__DEFBOSS_V1', 'HS_NEXT_RECALL_V1',
                       'defstage_monsters.js', 'def_join_nudge.js'):
              if name not in s:
                  print('NG: 番兵', name, 'が 消えている'); ok = False
          for name in ('DEF2TRY_', 'DEF2SEND_GUARD_V1_MARK', 'DEF2TPL_LEARN_V1', 'DEF2TALLY_TREE_V2'):
              if name not in d:
                  print('NG: 番兵', name, 'が 消えている'); ok = False
          if not ok:
              sys.exit(1)
          print('SENTINELS OK')
          PYEOF

      - name: 配信される HTML を ためしに 組み立てて たしかめる
        run: |
          node - << 'JSEOF'
          const fs = require('fs');
          const s = fs.readFileSync('src/index.tsx', 'utf8');
          const before = fs.readFileSync('public/index.html', 'utf8');
          let h = before;
          const base = h.length;
          let bad = false;
          function chk(label, cond) { if (!cond) { console.log('NG:', label); bad = true; } else { console.log('ok:', label); } }
          const ma = s.match(/const _bdm0a = (".*")/);
          const mb = s.match(/const _bdm0b = (".*")/);
          if (!ma || !mb) { console.log('NG: _bdm0 が 見つからない'); process.exit(1); }
          const A = JSON.parse(ma[1]);
          const B = JSON.parse(mb[1]);
          console.log('あて先   =', A);
          console.log('おきかえ =', B);
          const f = h.indexOf(A);
          chk('あて先が 一意', f !== -1 && f === h.lastIndexOf(A));
          if (bad) process.exit(1);
          h = h.replace(A, B);
          chk('中身が かわった', h !== before);
          chk('長さは おなじ（文字数が そろった 置きかえ）', h.length === base);
          chk('ふるい 0.0004 が 消えた', h.indexOf('const BEAM_RATIO_PER_LEVEL = 0.0004') === -1);
          chk('あたらしい 0.0012 が 1件', h.split('const BEAM_RATIO_PER_LEVEL = 0.0012').length - 1 === 1);
          chk('BASE は さわっていない', h.split('const BEAM_RATIO_BASE = 0.12;').length - 1 === 1);
          chk('しき は さわっていない', h.indexOf('warState.beamDamageRatio = BEAM_RATIO_BASE + (bdl-1)*BEAM_RATIO_PER_LEVEL;') !== -1);
          chk('チャージは さわっていない', h.indexOf('const BEAM_RATE_PER_LEVEL = 0.02;') !== -1);
          chk('スタンは さわっていない', h.indexOf('const BEAM_STUN_PER_LEVEL = 5;') !== -1);
          chk('しろレベルは さわっていない', h.indexOf('const CASTLE_HP_PER_LEVEL = 5;') !== -1);
          chk('よわりモード（ZWEAK_V1）は src に 生きている', s.indexOf('ゾンビでは よわりモード') !== -1);
          if (bad) process.exit(1);
          function ratioOf(src, lv) {
            const b = Number(src.match(/const BEAM_RATIO_BASE = ([0-9.]+);/)[1]);
            const p = Number(src.match(/const BEAM_RATIO_PER_LEVEL = ([0-9.]+);/)[1]);
            return b + (lv - 1) * p;
          }
          console.log('=== 対比較：おなじ てき・おなじ 段・beamDamageLevel だけ かえる ===');
          const lvs = [1, 3, 5, 22, 26, 43, 74, 94, 100];
          for (const lv of lvs) {
            const r0 = ratioOf(before, lv);
            const r1 = ratioOf(h, lv);
            const d0 = Math.max(1, Math.floor(250 * r0));
            const d1 = Math.max(1, Math.floor(250 * r1));
            console.log('Lv' + lv + ' : ratio ' + r0.toFixed(4) + ' -> ' + r1.toFixed(4)
              + ' / てきHP250 への 1はつ ' + d0 + ' -> ' + d1
              + ' / Lv1の ' + (r0 / ratioOf(before, 1)).toFixed(3) + 'ばい -> ' + (r1 / ratioOf(h, 1)).toFixed(3) + 'ばい');
          }
          chk('Lv1 は 1ミリも かわらない', Math.abs(ratioOf(before, 1) - ratioOf(h, 1)) < 1e-12);
          chk('Lv100 は ビーム1 と おなじ 1.99ばい', Math.abs(ratioOf(h, 100) / ratioOf(h, 1) - 1.99) < 0.01);
          chk('Lv100 でも 1はつで 4わりを こえない', ratioOf(h, 100) < 0.4);
          if (bad) process.exit(1);
          console.log('DRY RUN OK');
          JSEOF

      - name: ビルドの 副産物を 元に戻す（src/index.tsx だけ コミットする）
        run: |
          git checkout -- dist package-lock.json 2>/dev/null || true
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/index.tsx
          if git diff --cached --quiet; then
            echo 'かわりなし（すでに 当てずみ）'; exit 0
          fi
          git commit -m 'BEAMDMG_V1: ビーム2（いりょく）の のび方を ビーム1（チャージ）と そろえる'
          git pull --rebase origin main
          git push origin HEAD:main
