name: 連続日数 第3便 祝日表の期限切れを教師画面で知らせる（数字は変わらない）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: パッチを適用（チェーン158・あて先1件でなければ中止）
        run: python3 scripts/patch_streak_h3.py
      - name: ビルド
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: 配信されるHTMLのJSを構文チェック
        run: node scripts/render_check.mjs
      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git diff --staged --quiet && echo "No changes" || (git commit -m "連続日数 第3便 祝日表の期限切れを教師画面で知らせる（チェーン158->158・数字の変化なし）" && git push)
      - name: デプロイを起動
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
