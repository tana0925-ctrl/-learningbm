name: patch-hssign-weekchat-v1

# HSSIGN_V1 ✍️ 対話にサポーター（おうちの人）のサイン ＋ HSWEEKCHAT_V1 💬 阪神マンとふりかえる（週の振り返りを対話で）
#  ・家庭学習の対話：おわったら（次どうする？の後）・提出の前に「おうちの人に見せて、サインもらってきてな！」
#    → おうちの方むけの大きい文字の画面（今日やったこと・時間・天気の要約）→「👍 見たよ」＋ひとこと（任意）
#    →「サインもろたで！ほな提出しよか」→ いつもの提出。サインは いつもの「🏠サポーターから」（parent_comment）に入る。
#    「あとでもらう」で先に提出でき、その日のうちに「✍️ おうちの人のサインをもらう」で足せる（/api/homework/parent-sign・欄が空のときだけ）。
#    サインの有無でコインは変えない。シートの「サポーターから」欄の動きは そのまま。DDL なし。
#  ・週の振り返り：かんたんふりかえりの上に「💬 阪神マンとふりかえる」（いまの画面も そのまま）。
#    見本 → 先週決めたこと → 今週の記録 → ◎○△ → なんで → 次どうする → 気もち → 学校での学び → 考える問い（1問ずつ・えらぶ＋入力）。
#    出すのは いまの画面と同じ道（kantanref.js の send をそのまま使う）＝同じ保存・同じ20コイン週1回・二重なし。
#    金曜に開いたとき（まだ出していない子）は、いつもの金曜の声かけの箱を「一緒にふりかえろか！」にする（べつの声かけは ふやさない）。
#  ・新規: src/hssign.ts・public/hsweekchat.js・tests/hsweekchat.test.mjs。既存の </body> 注入行（hschat）に1本足す・配る道1行。
#  ・テスト：coin_ledger 56/56（新3件）＋ viewas 14/14 ＋ hschat 14/14 ＋ hsweekchat 8/8（配信されるHTMLで）。最後に deploy.yml を起動する。

