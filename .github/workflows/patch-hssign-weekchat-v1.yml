      - name: markers
        if: env.SKIP != '1'
        run: |
          grep -q "registerHsSign(app, { jstStudyDayKey })" src/index.tsx
          grep -q "app.get('/hsweekchat.js'" src/index.tsx
          grep -q '<script src="/hschat.js?v=2"></script><script src="/hsweekchat.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/kantanref.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/weekref2.js?v=1"></script>' src/index.tsx
          grep -q 'window.KANTAN = {' public/kantanref.js
          grep -q 'おうちの人に見せて、サインもらってきてな！' public/hschat.js
          test -f public/hsweekchat.js && test -f src/hssign.ts && test -f tests/hsweekchat.test.mjs
          ! grep -n -E "CREATE (TABLE|INDEX)|ALTER TABLE" src/hssign.ts public/hsweekchat.js public/hschat.js
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: for f in public/hschat.js public/hsweekchat.js public/kantanref.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts / child page)
        if: env.SKIP != '1'
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs
      - name: tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          npx esbuild src/viewas.ts --bundle --format=esm --platform=neutral --outfile=tests/viewas.mod.mjs --log-level=warning
          cd tests
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs 2>/dev/null | grep -E "^(PASS|FAIL)|passed"
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs > /dev/null 2>&1
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs 2>/dev/null | grep -E "passed"
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs > /dev/null 2>&1
          rm -f app.after.mjs viewas.mod.mjs
      - name: tests (child screen, served html + jsdom)
        if: env.SKIP != '1'
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          cat > /tmp/dump.mjs <<'JSEOF'
          import fs from 'fs'
          const mod = await import(process.cwd() + '/dist/_worker.js')
          const env = { ASSETS: { fetch: async (req) => { const u = new URL(typeof req === 'string' ? req : req.url); const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname; try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }) } catch (e) { return new Response('', { status: 404 }) } } } }
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} })
          const h = await res.text(); fs.writeFileSync('/tmp/served.html', h)
          for (const n of ['/hschat.js?v=2', '/hsweekchat.js?v=1', '/kantanref.js?v=1', '/weekref2.js?v=1']) if (h.indexOf(n) < 0) { console.log('注入なし ' + n); process.exit(1) }
          for (const n of ['/hschat.js', '/hsweekchat.js']) { const js = await mod.default.fetch(new Request('http://localhost' + n), env, { waitUntil() {} }); if (js.status !== 200) { console.log(n + ' が配られない ' + js.status); process.exit(1) } }
          if (!(h.indexOf('/kantanref.js') < h.indexOf('/hsweekchat.js') && h.indexOf('/weekref2.js') < h.indexOf('/hsweekchat.js'))) { console.log('読みこみ順'); process.exit(1) }
          console.log('served ' + h.length + ' ok')
          JSEOF
          node /tmp/dump.mjs
          HSCHAT_HTML=/tmp/served.html node tests/hschat.test.mjs
          HSCHAT_HTML=/tmp/served.html node tests/hsweekchat.test.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx src/hssign.ts public/hschat.js public/kantanref.js public/hsweekchat.js tests/coin_ledger.test.mjs tests/hschat.test.mjs tests/hsweekchat.test.mjs
          git commit -m "HSSIGN_V1: 💬対話にサポーターのサイン（おわったら→おうちの人に見せて→おうちの方むけの大きい文字の要約→👍見たよ＋ひとこと→提出／あとでもらう→その日のうちに足せる・いつもの「サポーターから」欄・コインは変えない）＋HSWEEKCHAT_V1: 💬阪神マンとふりかえる（週の振り返りを1問ずつ対話で・見本→先週決めたこと→今週の記録→◎○△→なんで→次どうする→気もち→学校での学び→考える問い・いまの画面と同じ提出と20コイン週1回・金曜の声かけを統合）（DDLなし・テスト56/56＋14/14＋14/14＋8/8）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
