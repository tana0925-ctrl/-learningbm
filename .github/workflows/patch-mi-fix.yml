name: MIしらべ mi.js 先頭クリーンアップ
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: mi.js 先頭の混入行を除去
        run: python3 scripts/fix_mi_js_head.py

      - name: 変更をコミット&プッシュ
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/mi.js
          git diff --staged --quiet && echo "no changes" || (git commit -m "MIしらべ: mi.js 先頭の混入行を除去" && git push)
