name: DEF2NAME_V1 防衛戦の 名前の わくを ひろげる（第2便）

# 第1便（DEF_DISPNAME_V1）で 名前が ログインIDから ゲーム内の 名前に かわった。
# ゲーム内の 名前は 12文字まで 入るのに、わくが せまくて「…」で 切れる。
#   ①ベスト3の はこ   flex:1 1 180px -> flex:1 1 220px
#   ②貢献ゲージの名前  flex:0 0 84px  -> flex:0 0 120px
#   ③よみこみ番号     /defense2.js?v=21 -> ?v=22（子どもの iPad の キャッシュ よけ）
#
# 見た目だけ。勝敗の けいさん・resolve・public/index.html は 1文字も さわらない。
# めじるし・チェーン数（167 -> 167）が 合わなければ patch が 止まる（1文字も 書かない）。
# ビルドと 構文チェックが とおってから はじめて commit / push する。
#
# ※ 児童の 画面が かわる 便なので、子どもが つかっていない 時間に 流すこと。
# ※ push は github-actions の token なので Deploy は 自動で 走らない。
#   このあと「Deploy to Cloudflare Pages」を 手で 流すこと。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッチを あてる（めじるし・チェーン数が 合わなければ ここで 止まる）
        run: python3 scripts/patch_def2name_v1.py

      - name: 変わった ところを 見る
        run: git --no-pager diff --stat

      - name: ビルド
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      - name: 教師画面など の 構文チェック
        run: node scripts/render_check.mjs

      - name: 児童ページ の 構文チェック
        run: node scripts/render_check_child.mjs

      - name: コミットして おくる
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/defense2.js
          git diff --staged --quiet && echo "No changes" || (git commit -m "DEF2NAME_V1: 防衛戦の名前のわくをひろげる（ベスト3 180->220・貢献ゲージ 84->120・v21->v22／チェーン167->167）" && git push)
