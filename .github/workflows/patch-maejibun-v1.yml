name: patch-maejibun-v1

# MAEJIBUN_V1 前の自分とくらべる／来週やってみたいこと（自己決定理論：自律性・有能感・関係性）
#  ・子ども：ステータス画面の「📒わたしのカルテ」の近くに「🪞前の自分とくらべる」。自分の振り返りを新しい順に、
#    「3週間まえのあなた」と「いまのあなた」を並べて見られる。『のびたこと』は記録から数えた事実だけ（比較・順位・点は出さない）。
#  ・振り返りの欄に任意の「🎯来週やってみたいこと」（単元 or 一言）。次週のカルテの🅲に最初から入り、単元なら🅰🅱にも優先。
#    今日のひと往復（外部AIへのコピー）にも入れる。先生の差しかえ・確認→公開の流れはそのまま。コインは付けない。
#  ・API: /api/student/my-growth（引数なし・他人403・未ログイン401・期間と件数に上限）、/api/student/next-try
#  ・新規: public/maejibun.js、migrations/0043_week_next_try.sql（本番には先に流してある）
#  ・DDL はリクエスト経路に入れていない。テスト 31/31。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

