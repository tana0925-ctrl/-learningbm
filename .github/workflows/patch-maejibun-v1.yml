      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'MAEJIBUN_V1' src/index.tsx) -ge 10
          grep -q '<script src="/maejibun.js?v=1"></script>' src/index.tsx
          grep -q "app.get('/maejibun.js'" src/index.tsx
          grep -q "app.get('/api/student/my-growth'" src/index.tsx
          grep -q 'MAEJIBUN_V1' public/teacher-ai.js
          grep -q 'MAEJIBUN_V1' public/karte-michi.js
          grep -q 'MAEJIBUN_V1' public/student-karte.js
          grep -q '<script src="/weekref.js?v=1"></script>' src/index.tsx
          test -f public/maejibun.js
          test -f migrations/0043_week_next_try.sql
          ! grep -n "CREATE TABLE" src/index.tsx | grep -i week_next_try
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/maejibun.js public/teacher-ai.js public/karte-michi.js public/student-karte.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts)
        if: env.SKIP != '1'
        run: node scripts/render_check.mjs
      - name: coin ledger tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          node --no-warnings tests/coin_ledger.test.mjs ./app.after.mjs
          rm -f tests/app.after.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/teacher-ai.js public/karte-michi.js public/student-karte.js public/maejibun.js migrations/0043_week_next_try.sql tests/coin_ledger.test.mjs tests/d1.mjs
          git commit -m "MAEJIBUN_V1: 🪞前の自分とくらべる（自分の振り返りを新しい順・3週間まえと並べる・のびたことは記録の事実だけ）＋🎯来週やってみたいこと（次週カルテの🅲に入る・単元は🅰🅱に優先・今日のひと往復にも）（migration 0043・テスト31/31）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
