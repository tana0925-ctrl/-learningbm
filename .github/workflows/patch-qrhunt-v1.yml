name: patch-qrhunt-v1

# QRHUNT_V1  既存「🔒 ひみつのQR」を、校内でさがすQRに作り替える。
#
#   ・QRの中身を /q/<token> の URL にする（iPad のカメラが標準で読む）
#   ・アプリ内の読み取り口（画像アップロード／jsQR／外部CDN）を撤去して一本化
#   ・1人1回は D1 の台帳 qr_finds で確定（INSERT の成否で判定。OR IGNORE は使わない）
#   ・/login に next（ログイン後の戻り先）を足す ← このイベントの生命線
#
#   ⚠️ DDL はここでは流さない。migrations/0039_qr_hunt.sql は適用ずみ。
#   ⚠️ public/index.html は1バイトも触らない（配信チェーンの t.replace() でだけ扱う）。
#   ⚠️ チェーンは 8 本増える。増分が違えば1バイトも書かずに止まる。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | wc -c
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | sha256sum

      # 印刷ページ用の QR 生成ライブラリ。外部CDNを使わない方針なので同梱する。
      # 児童側では読み込まない（カメラが読むので生成も読み取りも要らない）。
      - name: vendor qrgen.js from npm (MIT)
        run: |
          set -e
          npm pack qrcode-generator@2.0.4 --silent
          tar xzf qrcode-generator-2.0.4.tgz
          test -f package/dist/qrcode.js
          {
            echo "/* qrcode-generator v2.0.4 (MIT) Copyright (c) 2009 Kazuhiko Arase - http://www.d-project.com/"
            echo "   QRHUNT_V1: 先生の印刷ページ専用。児童側では読み込まない。"
            echo "   学校のネットが外部CDNを絞っていても印刷できるよう同梱している。 */"
            cat package/dist/qrcode.js
          } > public/qrgen.js
          rm -rf package qrcode-generator-2.0.4.tgz
          wc -c public/qrgen.js
          node -e "
            const src=require('fs').readFileSync('public/qrgen.js','utf8');
            const m={exports:{}}; new Function('module','exports',src)(m,m.exports);
            const q=m.exports(0,'H'); q.addData('https://learning-bm.pages.dev/q/K7M3PX2A'); q.make();
            if(q.getModuleCount()<21) throw new Error('qrgen.js が動いていない');
            console.log('qrgen.js OK  modules=',q.getModuleCount());
          "

      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_qrhunt_v1.py

      - name: public/index.html は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- public/index.html; then
            echo "::error::public/index.html が変わっています。中止します。"; exit 1
          fi

      - name: 構文検査
        run: |
          # ⚠️ --bundle は node_modules が要る（この job では npm install していない）。
          #    既存の patch-karte-fix-v2.yml と同じく、型を外して構文だけ見る。
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/after.js --log-level=warning
          node --check /tmp/after.js
          node --check public/qrhunt.js
          bash -n scripts/verify_qrhunt.sh

      # ⚠️ 今回いちばん危なかったところ。
      #   /login の JS は TS のテンプレートリテラルの中にあるので、
      #   バックスラッシュを書くとエスケープが1段食われて配信時に構文エラーになる。
      #   そうなるとログインボタンが動かず、クラス全員がアプリに入れなくなる。
      #   だから「配信される実物」を組み立てて構文解析する。
      - name: 配信される /login の JS が構文として通るか（最重要）
        run: |
          python3 - <<'PYEOF'
          import io
          s = io.open('src/index.tsx', encoding='utf-8').read()
          i = s.index("app.get('/login'")
          j = s.index("app.get('/recover'", i)
          seg = s[i:j]
          # テンプレートリテラルの中身＝配信される実物を取り出す
          a = seg.index('`'); b = seg.rindex('`')
          io.open('/tmp/login_html.txt', 'w', encoding='utf-8').write(seg[a+1:b])
          PYEOF
          node - <<'EOF'
          const fs=require('fs'), vm=require('vm');
          // TS のテンプレートリテラルを実際に評価して、配信される文字列を得る
          const raw=fs.readFileSync('/tmp/login_html.txt','utf8');
          const html=new Function('c','return `'+raw.replace(/\$\{[^}]*\}/g,'""')+'`')({});
          const scripts=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if(!scripts.length) throw new Error('/login のインラインscriptが見つからない');
          scripts.forEach((s,i)=>{ new vm.Script(s); });
          if(!/var _safeNext/.test(html)) throw new Error('next の仕組みが入っていない');
          console.log('/login インラインscript '+scripts.length+'個 → 構文OK / next あり');
          EOF

      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash', 'registerMi(app)', 'registerQrHunt(app)']:
              n = s.count(k)
              print('%-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF

      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c src/index.tsx
          sha256sum src/index.tsx

      - name: commit and push
        run: |
          git add src/index.tsx public/qrgen.js
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "QRHUNT_V1: ひみつのQRを校内でさがす形に作り替え／ログイン後の戻り先(next)（チェーン${{ inputs.chain_before }}->+8）"
          git push origin HEAD:main
