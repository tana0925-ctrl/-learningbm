name: patch-plan-loop-v2

# PLAN_LOOP_V2 (2026-09-25)
#   (5) 報酬の向き … 承認のごほうびは据え置き（減らさない・条件も足さない）。
#       先生が忙しくて承認だけ押した週に、子どもが損をする形にはしない。
#       足りていなかった「計画へのひとこと」にだけ 100コイン+2かけら（承認より小さい）。
#       振り返りの返却は元から300+5なのでそのまま。既に受け取った子には触れない。
#   (4後半) 子どもからの返事 … 新しいテーブルも列も作らない。
#       plans_json のトップレベルにキーを足すと「5番目＝金曜」と数えている6か所が壊れるため、
#       月曜の日オブジェクトの中に reply を入れる（トップレベルのキーは1つも増えない）。
#       ごほうびは付けない。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi)'
        required: true
        default: '132'
        type: string

permissions:
  contents: write

