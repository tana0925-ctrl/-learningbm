name: patch-hsauth-v1

# HSAUTH_V1 🔐 家庭学習の提出で「ログインの有効期限が切れていました」と出る件（2026-10-27）
#  原因：先生のアカウント（管理者）で子どもの画面を開いて対話の提出をすると、/api/homework/submit が「子どもだけ」なので 403。
#        画面は 403 をすべて「ログイン切れ」と出していた（見るだけモードは 403 を出さない・本当の期限切れも同じ 403 だった）。
#  ・サーバ：ログインなし＝401 login_required／先生・管理者＝403 student_only に分ける（子どもの提出は いままでどおり）。
#  ・画面（index.html の hsSubmitAndExport）：先生なら「👀 先生のアカウントで開いているので、提出はされないよ（先生用）」・ログインへ送らない。
#    見るだけモードの {viewOnly:true} は提出あつかいにしない。本当の期限切れ（401）は 今日の下書き（対話の続きごと）を端末に控えてからログインへ。
#    サーバに もう提出があった（alreadySubmitted）ときは ごほうびを二重に出さない。
#  ・hschat.js：先生のアカウント／見るだけモードは送らずにひとこと。ログインしなおすと 控えを戻して 提出の直前から（同じ子・同じ日・12時間以内）。
#  ・テスト：hsauth 8/8（新）＋ coin_ledger 58/58 ＋ viewas 14/14 ＋ hschat 14/14 ＋ hsweekchat 8/8 ＋ teishutsu 14/14。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: apply patch (fail-closed)
