      - name: markers
        if: env.SKIP != '1'
        run: |
          grep -q "if (!u) return jsonError(c, 401, 'login_required')" src/index.tsx
          grep -q "if (u.role !== 'student') return jsonError(c, 403, 'student_only')" src/index.tsx
          test "$(grep -c 'HSAUTH_V1' public/index.html)" -ge 4
          grep -q "function resumeCheck()" public/hschat.js
          grep -q "teacherOnly:" public/hschat.js
          test -f tests/hsauth.test.mjs
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: node -e "new Function(require('fs').readFileSync('public/hschat.js','utf8'))" && echo ok
      - name: install
        if: env.SKIP != '1'
        run: |
          npm install --no-audit --no-fund
          npm i --no-save --no-audit --no-fund jsdom
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts / child page)
        if: env.SKIP != '1'
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs
      - name: tests (node:sqlite, real handlers / jsdom)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          npx esbuild src/viewas.ts --bundle --format=esm --platform=neutral --outfile=tests/viewas.mod.mjs --log-level=warning
          cd tests
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs > /tmp/cl.log 2>&1 || (grep -E "FAIL|passed" /tmp/cl.log; exit 1)
          grep -E "passed" /tmp/cl.log
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs > /tmp/va.log 2>&1 || (grep -E "FAIL|passed" /tmp/va.log; exit 1)
          grep -E "passed" /tmp/va.log
          timeout 600 node --no-warnings teishutsu.test.mjs ./app.after.mjs > /tmp/ts.log 2>&1 || (cat /tmp/ts.log | grep -v "^    at " | tail -60; exit 1)
          grep -E "passed" /tmp/ts.log
          cd ..
          timeout 600 node tests/hsauth.test.mjs ./tests/app.after.mjs > /tmp/ha.log 2>&1 || (cat /tmp/ha.log | tail -30; exit 1)
          grep -E "^(PASS|FAIL)|passed" /tmp/ha.log
          timeout 600 node tests/hschat.test.mjs | tail -3
          timeout 600 node tests/hsweekchat.test.mjs | tail -3
          rm -f tests/app.after.mjs tests/viewas.mod.mjs
      - name: served check (配信されるHTMLとhschat.jsに入っていること)
        if: env.SKIP != '1'
        run: |
          cat > /tmp/dump.mjs <<'JSEOF'
          import fs from 'fs'
          const mod = await import(process.cwd() + '/dist/_worker.js')
          const env = { ASSETS: { fetch: async (req) => { const u = new URL(typeof req === 'string' ? req : req.url); const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname; try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }) } catch (e) { return new Response('', { status: 404 }) } } } }
          const h = await (await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} })).text()
          if (h.indexOf("_hsErr === 'student_only'") < 0 || h.indexOf('/hschat.js?v=') < 0) { console.log('子どもの画面に HSAUTH_V1 が入っていない'); process.exit(1) }
          fs.writeFileSync('/tmp/served.html', h)
          const r = await mod.default.fetch(new Request('http://localhost/hschat.js'), env, { waitUntil() {} }); const s = await r.text()
          if (r.status !== 200 || s.indexOf('HSAUTH_V1') < 0) { console.log('/hschat.js が配られない ' + r.status); process.exit(1) }
          console.log('served ok')
          JSEOF
          node /tmp/dump.mjs
          HSCHAT_HTML=/tmp/served.html timeout 600 node tests/hsauth.test.mjs | tail -2
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/index.html public/hschat.js tests/hsauth.test.mjs
          git commit -m "HSAUTH_V1: 家庭学習の提出で先生のアカウント／見るだけモードを「ログイン切れ」と出さない（先生用のひとこと・ログインへ送らない）・本当の期限切れ(401)は下書きを控えてログイン後に提出の直前から再送・alreadySubmittedでごほうび二重なし（submitは401 login_required／403 student_only・テスト8/8＋58/58＋14/14＋14/14＋8/8＋14/14）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
