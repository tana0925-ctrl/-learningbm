name: patch-ranktie-same-v1

# RANKTIE_SAME_V1 / RANKBEST_V1 (2026-09-25)
#   ① 同じ点なら同じ順位・同じかけら（運動会と同じ数えかた：1位が2人なら次の子は3位）。
#      もとは内部の並び順しだいで 2位/3位/なし に割れていた。
#      2026-09-14 の週に、ずかんが同じ10個の子が3人いて実際に起きた。
#      0点は今までどおり対象外なので、誰も取っていない部門では誰にも配らない。
#   ② 週の成績を「最後に保存した時点の値」ではなく「その週のいちばん良かった記録」にする。
#      タイプシュートの点も やせいバトルの連勝も積み上がる数ではないので、
#      途中で良い記録を出しても、あとで下がると 0 になっていた。
#      正解ポイントとずかんは積み上がる数なので結果は変わらない（下がるのを防ぐだけ）。
#   既にもらっている子から取り上げない：上書きは MAX のみ、順位は同点を引き上げるだけ。
#   児童の画面（配信チェーン）は増減しない。増減していたら書かずに止まる。
#   DDL は一切なし。public/index.html は触らない。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | wc -c
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | sha256sum
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_ranktie_same_v1.py
      - name: public/index.html は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- public/index.html; then
            echo "::error::public/index.html が変わっています。中止します。"; exit 1
          fi
      - name: src/index.tsx 以外は変わっていないこと
        run: |
          CHANGED=$(git diff --name-only)
          echo "$CHANGED"
          if [ "$CHANGED" != "src/index.tsx" ]; then
            echo "::error::src/index.tsx 以外が変わっています。中止します。"; exit 1
          fi
      - name: 構文検査
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/after.js --log-level=warning
          node --check /tmp/after.js
      - name: 児童データを壊す書き方が増えていないこと
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys
          old = subprocess.run(['git','show','HEAD:src/index.tsx'], capture_output=True).stdout.decode('utf-8')
          new = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          # progress への全体上書きと、危ない DDL / 削除が増えていないこと
          for k in ['UPDATE progress SET state_json',
                    'INSERT INTO progress',
                    'DELETE FROM progress',
                    'DELETE FROM users',
                    'ALTER TABLE',
                    'DROP TABLE',
                    'DROP INDEX']:
              o, n = old.count(k), new.count(k)
              print('%-32s %d -> %d' % (k, o, n))
              if n > o:
                  print('::error::%s が増えています（%d -> %d）' % (k, o, n)); bad = True
          if bad: sys.exit(1)
          PYEOF
      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash',
                    '_rankShardsApplied', '_hwCoinsApplied', 'RANKSETTLE_RETRY_V1',
                    'RANKTIE_SAME_V1', 'RANKBEST_V1', "u.role='student'"]:
              n = s.count(k)
              print('%-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF
      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c src/index.tsx
          sha256sum src/index.tsx
      - name: commit and push
        run: |
          git add src/index.tsx
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "RANKTIE_SAME_V1/RANKBEST_V1: 同じ点なら同じ順位・同じかけら／週のいちばん良かった記録で競う（チェーン124->124）"
          git push origin HEAD:main
