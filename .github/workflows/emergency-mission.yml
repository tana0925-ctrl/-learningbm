name: 緊急 クラスミッション進捗のD1読み取り削減
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: パッチを適用（一致しなければ中止）
        run: python3 scripts/patch_emergency_mission.py
      - name: ビルド確認
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git diff --staged --quiet && echo "No changes" || (git commit -m "緊急: クラスミッション進捗を10分キャッシュ+達成後打ち切り / 不足索引を起動時に作成" && git push)
