name: ZWAR_BOSS_SKILL3_V1 県ボスの3つ目のスキルを読めるようにする（チェーン 101->102）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを掃除
        run: git checkout -- .

      - name: 最新を取り込む
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - name: 前の便（ZWAR_CASTLE_STAND_V1）が入っていること
        run: |
          grep -q '__ZWAR_CASTLE_STAND_V1__' src/index.tsx
          echo '前の便あり'

      - name: 本番の配信HTMLでアンカーを数える（GETのみ）
        run: |
          curl -sS --max-time 90 -o /tmp/prod.html https://learning-bm.pages.dev/ || echo 'FETCH FAILED'
          ls -l /tmp/prod.html || true
          python3 - << 'PYEOF'
          import importlib.util, os, sys
          p = '/tmp/prod.html'
          if not os.path.exists(p):
              print('WARN: honban HTML fetch failed (skip)')
              sys.exit(0)
          h = open(p, encoding='utf-8', errors='replace').read()
          sp = importlib.util.spec_from_file_location('zbs', 'scripts/patch_zwar_boss_skill3_v1.py')
          m = importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)
          n = h.count(m.A_OLD)
          print('PROD anchor', n)
          if n > 1:
              print('NG: prod anchor not unique', n); sys.exit(1)
          print('PROD ANCHOR CHECK DONE')
          PYEOF

      - name: 流す前にチェーンとアンカーを実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          h = io.open('public/index.html', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          applied = '__ZWAR_BOSS_SKILL3_V1__' in s
          print('chain before =', n, 'applied =', applied)
          if applied:
              if n != 102:
                  print('NG: 適用済みなのにチェーンが 102 件でない'); sys.exit(1)
          else:
              if n != 101:
                  print('NG: 流す前のチェーンが 101 件でない'); sys.exit(1)
              anchor = '  const atkInterval = clamp(1100 - (mon.spd||30)*6, 420, 1100);' + chr(10) + '  const m3 = (mon && Array.isArray(mon.moves) && mon.moves[2]) ? mon.moves[2] : null;'
              if h.count(anchor) != 1:
                  print('NG: 2行アンカーが %d 件（期待 1）' % h.count(anchor)); sys.exit(1)
              line = '  const m3 = (mon && Array.isArray(mon.moves) && mon.moves[2]) ? mon.moves[2] : null;'
              if h.count(line) != 5:
                  print('NG: moves[2] を読む行が %d 件（期待 5）' % h.count(line)); sys.exit(1)
              print('アンカー OK（ボスの1か所だけを指している）')
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_zwar_boss_skill3_v1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        run: python3 scripts/patch_zwar_boss_skill3_v1.py

      - name: 触ってはいけないファイルが無傷であること
        run: |
          git diff --name-only
          if git diff --name-only | grep -vE '^src/index\.tsx$' | grep -q .; then
            echo 'NG: src/index.tsx 以外が変わっている'; exit 1
          fi

      - name: 検証（番兵とは別の条件で確かめる）
        run: |
          python3 - << 'PYEOF'
          import importlib.util, subprocess, sys
          sp = importlib.util.spec_from_file_location('zbs', 'scripts/patch_zwar_boss_skill3_v1.py')
          m = importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)

          s = open('src/index.tsx', encoding='utf-8').read()
          h = open('public/index.html', encoding='utf-8').read()
          corpus = m.read_corpus()

          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('replace chain:', n)

          ok = True
          if n != 102:
              print('NG: chain', n, 'want 102'); ok = False
          if s.count('_zbs1') != 3 or s.count('_zbs2') != 2:
              print('NG: _zbs1/_zbs2', s.count('_zbs1'), s.count('_zbs2')); ok = False
          if s.count('] anchor not found') < 1:
              print('NG: console.error の skip 経路がない'); ok = False

          if s.count('Array.isArray(mon.skills)') != 1:
              print('NG: skills フォールバックが1件でない', s.count('Array.isArray(mon.skills)')); ok = False
          if h.count(m.M3_LINE) != m.M3_LINE_COUNT:
              print('NG: public/index.html の moves[2] 行が', h.count(m.M3_LINE)); ok = False

          if m.SENTINEL in h:
              print('NG: sentinel leaked into public/index.html'); ok = False
          if subprocess.call(['git', 'diff', '--quiet', '--', 'public/index.html']) != 0:
              print('NG: public/index.html was modified'); ok = False

          old = subprocess.check_output(['git', 'show', 'HEAD:src/index.tsx']).decode('utf-8')
          blk = m.build_block()
          if s.replace(blk, '', 1) != old:
              print('NG: something other than the added block changed'); ok = False
          else:
              print('OK: only the added block changed in src')

          for k in m.KEEP:
              if k not in corpus:
                  print('NG: marker lost', k); ok = False
              if s.count(k) != old.count(k):
                  print('NG: marker count changed', k, old.count(k), '->', s.count(k)); ok = False
          print('KEEP markers checked:', len(m.KEEP))

          if not ok:
              sys.exit(1)
          print('VERIFY OK')
          PYEOF

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ビルドが通ることを確認
        run: |
          npm ci
          npm run build
          git checkout -- dist 2>/dev/null || true
          git clean -fdq dist 2>/dev/null || true
          echo '--- git status ---'
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/index.tsx; then
            echo 'no change (already applied)'; exit 0
          fi
          git add src/index.tsx
          git commit -m 'ZWAR_BOSS_SKILL3_V1: pref boss reads skills[2] when moves is absent (boss spawn only) chain 101->102'
          git pull --rebase origin main
          git push origin HEAD:main
