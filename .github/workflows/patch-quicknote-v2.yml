name: QUICKNOTE_V1 きょうの一言（先生の観察メモを1人10秒で）第2便

# 第1便は for (const r of rows) { が4か所あってフェイルクローズで止まった（書き込み0）。
# pick の中だけを見るように直した scripts/patch_quicknote_v2.py を流す。
#   ・pick の観察メモに ai_ok の条件を足す（「先生だけ」を外部AIに渡さない）
#   ・pick のループ順を メモ → プリント に入れ替える
#   ・貼り付け文の2か所（pick を通らない別経路）にも ai_ok を効かせる
#   ・外部AIに渡す前に、メモ本文の実名を伏せる
#   ・teacher-ai.js を変えるので ?v=12 -> ?v=13
#   ・さわるのは教師画面とサーバAPIだけ。児童の配信チェーンは増減させない。
#   ・public/index.html には一切さわらない。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: "流す直前に実測したチェーン件数。合わなければ何も書かずに止まる"
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: パッチ本体の構文チェック
        run: python3 -m py_compile scripts/patch_quicknote_v2.py

      - name: 適用前の実測
        run: |
          git rev-parse HEAD
          echo -n 'チェーン件数(前): '; python3 -c "s=open('src/index.tsx',encoding='utf-8').read(); a=s.index(\"app.get('/'\"); b=s.index(\"app.get('/logout'\"); print(s[a:b].count('.replace('))"
          echo -n 'public/index.html sha256: '; sha256sum public/index.html
          echo -n 'QUICKNOTE_V1 の数(tsx): '; grep -o 'QUICKNOTE_V1' src/index.tsx | wc -l
          echo -n 'teacher-ai.js?v=12 の数: '; grep -o 'teacher-ai.js?v=12' src/index.tsx | wc -l

      - name: パッチ適用（フェイルクローズ）
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_quicknote_v2.py

      - name: 触ってはいけないファイルが無傷であること
        run: |
          set -e
          git diff --quiet -- public/index.html
          git diff --quiet -- src/def_engine.ts
          git diff --quiet -- src/def_resolve.ts
          git diff --quiet -- src/def_stage.ts
          git diff --quiet -- public/defense2.js
          git diff --quiet -- public/student-karte.js
          echo 'public/index.html ほか: 無変更 OK'
          echo -n '変更のあったファイル: '; git --no-pager diff --name-only | tr '\n' ' '; echo

      - name: 適用後の内容検証（grep -c は使わない。巨大な1行なので必ず1を返すため）
        run: |
          set -e
          echo -n 'QUICKNOTE_V1(tsx): ';            grep -o 'QUICKNOTE_V1' src/index.tsx | wc -l
          echo -n 'quicknote/roster: ';             grep -o 'api/teacher/quicknote/roster' src/index.tsx | wc -l
          echo -n 'ai_ok の条件: ';                 grep -o 'COALESCE(tn.ai_ok,1)=1' src/index.tsx | wc -l
          echo -n 'teacher-ai.js?v=13: ';           grep -o 'teacher-ai.js?v=13' src/index.tsx | wc -l
          echo -n 'teacher-ai.js?v=12(0のはず): ';  grep -o 'teacher-ai.js?v=12' src/index.tsx | wc -l
          echo -n '_mNote(tai): ';                  grep -o '_mNote' public/teacher-ai.js | wc -l
          echo -n 'materials.forEach(0のはず): ';   grep -o '_pk.materials.forEach' public/teacher-ai.js | wc -l
          echo -n '先生の観察メモ(tai): ';          grep -o '【先生の観察メモ' public/teacher-ai.js | wc -l
          echo -n 'チェーン件数(後): '; python3 -c "s=open('src/index.tsx',encoding='utf-8').read(); a=s.index(\"app.get('/'\"); b=s.index(\"app.get('/logout'\"); print(s[a:b].count('.replace('))"
          echo '検証OK'

      - name: ビルド
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      - name: 配信JSの構文チェック（既存のものを使う）
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs

      - name: コミット&プッシュ
        run: |
          git add src/index.tsx public/teacher-ai.js
          if git diff --cached --quiet; then echo "変更なし"; exit 1; fi
          git commit -m "QUICKNOTE_V1: きょうの一言（1人10秒の観察メモ）／先生だけ・阪神マン・児童に見せるの3段階／pick をメモ優先に／貼り付け文の漏れ口も塞ぐ／teacher-ai.js v=12->13"
          git checkout -- .
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 次の手順
        run: echo 'このpushでは Deploy は起動しません。Deploy to Cloudflare Pages を手動で dispatch してください。'
