name: 攻略モード 重さと残り秒の表示（WARCOSTUI_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: さぎょうツリーを きれいにする
        run: git checkout -- .

      - name: origin/main に おいつく
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 流す直前に チェーンを 実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          if s.count("app.get('/', async (c) => {") != 1:
              print('NG: 家の入口が 一意で ない'); sys.exit(1)
          if s.count("app.get('/logout'") != 1:
              print('NG: 出口が 一意で ない'); sys.exit(1)
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('chain before =', n)
          io.open('/tmp/chain_before.txt', 'w').write(str(n))
          PYEOF

      - name: パッチを 当てる（合わなければ 1文字も 書かずに 中止）
        run: python3 scripts/patch_warcostui_v1.py

      - name: さわってはいけない ファイルが 無傷か
        run: |
          git diff --quiet -- public || (echo 'NG: public が 変わっている'; exit 1)
          git diff --quiet -- migrations || (echo 'NG: migrations が 変わっている'; exit 1)
          git status --porcelain
          git diff --numstat -- src/index.tsx
          test "$(git diff --numstat -- src/index.tsx | cut -f2)" = "0" || (echo 'NG: src/index.tsx で 行が 消えている'; exit 1)

      - name: ビルドが 通ることを 確認（通らなければ push しない）
        run: |
          npm install
          npm run build

      - name: 中身と 番兵を たしかめる
        run: |
          python3 scripts/patch_warcostui_v1.py --verify
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          d = io.open('public/defense2.js', encoding='utf-8', newline='').read()
          before = int(io.open('/tmp/chain_before.txt').read().strip())
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          now = s[i:j].count('.replace(')
          ok = True
          if before != 110:
              print('NG: 直前の チェーンが', before, '（110 のはず）'); ok = False
          if now != 111:
              print('NG: いまの チェーンが', now, '（111 のはず）'); ok = False
          else:
              print('チェーン', before, '->', now)
          for name in ('__WARCOSTUI_V1__', '__WARCOST_V1__', '__WORLD_V2__', '__WORLD_V1__', '__ZWEAK_V1__',
                       '__ZWAR_UNLOCK_V1__', '__DEFSTAGE_CHARS_V1__', '__DEF_LV50_V1__', '__S6WORLD_50__',
                       '__H6BANK_LIVE_V1__', '__BEAMDMG_V1__', 'HS_NEXT_RECALL_V1'):
              if name not in s:
                  print('NG: 番兵', name, 'が 消えている'); ok = False
          for name in ('DEF2TRY_', 'DEF2SEND_GUARD_V1_MARK', 'DEF2TPL_LEARN_V1', 'DEF2TALLY_TREE_V2'):
              if name not in d:
                  print('NG: 番兵', name, 'が 消えている'); ok = False
          if not ok:
              sys.exit(1)
          print('SENTINELS OK')
          PYEOF

      - name: 配信される HTML を ためしに 組み立てて たしかめる
        run: |
          node - << 'JSEOF'
          const fs = require('fs');
          const s = fs.readFileSync('src/index.tsx', 'utf8');
          let h = fs.readFileSync('public/index.html', 'utf8');
          const base = h.length;
          let bad = false;
          function chk(label, cond) { if (!cond) { console.log('NG:', label); bad = true; } else { console.log('ok:', label); } }

          const ma = s.match(/const _wcui0a = (".*")/);
          const mb = s.match(/const _wcui0b = (".*")/);
          if (!ma || !mb) { console.log('NG: _wcui0 が 見つからない'); process.exit(1); }
          const A = JSON.parse(ma[1]), B = JSON.parse(mb[1]);
          const f0 = h.indexOf(A);
          chk('あて先が 一意', f0 !== -1 && f0 === h.lastIndexOf(A));
          if (bad) process.exit(1);
          h = h.replace(A, () => B);

          chk('パワー不足の 素の文言は 消えた', h.indexOf("hint.textContent = 'パワー不足';") === -1);
          chk('あたらしい文言が 入った', h.indexOf('こたえると はやくなる') !== -1);
          chk('コストの ⚡バッジは 無傷', h.indexOf('text-yellow-800') !== -1);
          chk('再出撃の 待ち秒数は 無傷', h.indexOf("hint.textContent = '再出撃待ち';") !== -1);
          chk('HTML が 長くなった', h.length > base);

          // 新しい式を そのまま動かして 数で たしかめる
          const f = new Function('cost', 'ps', 'text', 'hint', B + ' return [text.textContent, hint.textContent];');
          const mk = () => ({ textContent: '' });
          const run = (cost, power, rate) => { const t = mk(), n = mk(); return f(cost, { power: power, baseRate: rate }, t, n); };
          const cases = [
            ['阪神マン 400 / パワー0 / 回復2.0', 400, 0, 2, '⚡400  あと200秒', 'おもい・こたえると はやくなる'],
            ['阪神マン 400 / パワー0 / 回復5.0', 400, 0, 5, '⚡400  あと80秒', 'おもい・こたえると はやくなる'],
            ['阪神マン 400 / パワー120 / 回復2.0', 400, 120, 2, '⚡400  あと140秒', 'おもい・こたえると はやくなる'],
            ['ふつうの最終進化 62 / パワー0 / 回復2.0', 62, 0, 2, '⚡62  あと31秒', 'かるい・こたえると はやくなる'],
            ['しきい値 200 は おもい', 200, 0, 2, '⚡200  あと100秒', 'おもい・こたえると はやくなる'],
            ['しきい値 199 は ふつう', 199, 0, 2, '⚡199  あと100秒', 'ふつう・こたえると はやくなる'],
            ['しきい値 90 は ふつう', 90, 0, 2, '⚡90  あと45秒', 'ふつう・こたえると はやくなる'],
            ['しきい値 89 は かるい', 89, 0, 2, '⚡89  あと45秒', 'かるい・こたえると はやくなる'],
          ];
          for (const [label, cost, power, rate, wantText, wantHint] of cases) {
            const [gotText, gotHint] = run(cost, power, rate);
            console.log('  ' + label + ' -> [' + gotText + '][' + gotHint + ']');
            chk(label + ' の 大きい文字', gotText === wantText);
            chk(label + ' の ヒント', gotHint === wantHint);
          }
          // 0秒にならないこと（パワーが足りている端）
          const [tx] = run(100, 100, 2);
          chk('ちょうど足りるときも 1秒以上', tx === '⚡100  あと1秒');
          if (bad) process.exit(1);
          console.log('DRY RUN OK');
          JSEOF

      - name: ビルドの 副産物を 元に戻す（src/index.tsx だけ コミットする）
        run: |
          git checkout -- dist package-lock.json 2>/dev/null || true
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/index.tsx
          if git diff --cached --quiet; then
            echo 'かわりなし（すでに 当てずみ）'; exit 0
          fi
          git commit -m 'WARCOSTUI_V1: パワー不足のときに 重さ（おもい/ふつう/かるい）と あと何秒で出せるかを 見せる'
          git pull --rebase origin main
          git push origin HEAD:main
