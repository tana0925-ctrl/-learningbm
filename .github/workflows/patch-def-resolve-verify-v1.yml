name: 防衛戦の結果申告を log と照合（DEF_RESOLVE_VERIFY_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: パッチを適用（一致しなければ中止＝src/index.tsx に触らない）
        run: python3 scripts/patch_def_resolve_verify_v1.py

      - name: 冪等の確認（2回流しても増えない）
        run: python3 scripts/patch_def_resolve_verify_v1.py

      - name: 適用後の中身を確認（番兵とは別の条件で見る）
        run: |
          python3 - << 'PYEOF'
          import sys
          s = open("src/index.tsx", encoding="utf-8").read()
          d = open("public/defense2.js", encoding="utf-8").read()
          i = s.index("let t = await a.text()")
          j = s.index("return c.html(", i)
          n = s[i:j].count(".replace(")
          print("replace chain:", n)
          ok = True
          if n != 71:
              print("NG: チェーンが71件ではありません（今回はサーバ側だけなので71のままが正解）"); ok = False
          need = [
              "log_seed_mismatch",
              "log_replay_missing",
              "log_result_mismatch",
              "log_base_hp_mismatch",
              "ok: true, retry: true",
              "0x9e3779b9",
              "16777619",
              "ORDER BY de.created_at ASC, de.user_id ASC",
          ]
          for k in need:
              cnt = s.count(k)
              print("   ", k, cnt)
              if cnt < 1:
                  print("NG: 見つからない:", k); ok = False
          # 壊してはいけないもの
          if s.count("ensureDefenseTables(") != 1:
              print("NG: ensureDefenseTables の呼び出しが増えています"); ok = False
          if s.count("const DEFENSE_BASE_HP = 380") != 1:
              print("NG: 基地HPが380ではありません"); ok = False
          if s.count("INSERT OR IGNORE INTO defense_results") != 1:
              print("NG: defense_results への保存が1か所ではありません"); ok = False
          for k in ("defense_standing", "defense_carry_lock", "defAutoAdvanceV1"):
              if s.count(k) < 1:
                  print("NG: 消えている:", k); ok = False
          if d.count("withFrozenStats(entries, function(){ return window.autoBattleRT(") != 1:
              print("NG: withFrozenStats 経由の autoBattleRT が1件ではありません"); ok = False
          if d.count("window.autoBattleRT(") != 1:
              print("NG: 素の autoBattleRT 呼び出しがあります"); ok = False
          if not ok:
              sys.exit(1)
          print("OK")
          PYEOF

      - name: コミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git commit -m "防衛戦: resolve を log と照合（DEF_RESOLVE_VERIFY_V1）チェーンは71のまま" || echo "no changes"
          git checkout -- .
          git pull --rebase origin main
          git push
