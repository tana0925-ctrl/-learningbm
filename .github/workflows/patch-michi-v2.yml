#  ・変更: public/karte-michi.js（印刷カルテのおもて・先生の差しかえパネル）
#          public/student-karte.js（わたしのカルテに「えらべる3つの道」と「どう思う？」）
#          public/teacher-ai.js（やり方を具体的にほめる／標語を使わない／比較しない）
