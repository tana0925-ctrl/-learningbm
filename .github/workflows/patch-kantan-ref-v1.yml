      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'KANTAN_REF_V1' src/index.tsx) -ge 8
          grep -q '<script src="/kantanref.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/maejibun.js?v=1"></script>' src/index.tsx
          grep -q '<script src="/weekref.js?v=1"></script>' src/index.tsx
          grep -q "app.get('/kantanref.js'" src/index.tsx
          grep -q "app.get('/api/teacher/class/:classId/kantan-watch'" src/index.tsx
          grep -q 'KANTAN_REF_V1' public/karte-michi.js
          grep -q 'KANTAN_REF_V1' public/teacher-ai.js
          grep -q 'KANTAN_REF_V1' public/weekref.js
          grep -q 'KANTAN_REF_V1' public/maejibun.js
          grep -q 'KANTAN_REF_V1' public/student-karte.js
          ! grep -q '🏠 おうちの人へ' public/karte-michi.js
          test -f public/kantanref.js
          test -f migrations/0044_kantan_ref.sql
          ! grep -n "CREATE TABLE" src/index.tsx | grep -i -E "app_open_days|week_ref_taps"
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/kantanref.js public/weekref.js public/maejibun.js public/teacher-ai.js public/karte-michi.js public/student-karte.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts)
        if: env.SKIP != '1'
        run: node scripts/render_check.mjs
      - name: coin ledger tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          node --no-warnings tests/coin_ledger.test.mjs ./app.after.mjs
          rm -f tests/app.after.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/kantanref.js public/weekref.js public/maejibun.js public/teacher-ai.js public/karte-michi.js public/student-karte.js migrations/0044_kantan_ref.sql tests/coin_ledger.test.mjs tests/d1.mjs
          git commit -m "KANTAN_REF_V1: かんたんふりかえり（◎○△→なんで→次どうする・タップで答える・既存の20コインと返却のまま）＋自分から学びにくい子の自動検出（1タップ案内・カルテの🌟とはじめの一歩・先生に人数）＋金曜8:00から振り返り・月曜の計画にカルテの要点＋カルテの「おうちの人へ」をなくす（migration 0044・テスト37/37）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
