name: patch-kantan-ref-v1

# KANTAN_REF_V1 かんたんふりかえり（評価→なんで？→次どうする？）／自分から学びにくい子の自動検出 ／ 月曜の計画にカルテの要点
#  ・子ども：週の振り返りの欄に タップで答える「かんたんふりかえり」（◎○△・なんで・次どうする・気もち）。
#    文に組み立てて いつもの提出の道で出す（20コインと返却は既存の台帳のまま・二重なし）。
#    項目欄に保存：good_point「◎ よくできた ／ なんで：…」・next_action「次：…」（自由欄だけの出しなおしでは消えない）。
#    金曜は8:00から振り返りの欄を出す。月曜〜の計画画面に「📒わたしのカルテ」の要点（折りたたみ）と「この道を計画に入れる」。
#    前の自分とくらべる に ◎○△ のならび。
#  ・自動検出：直近2週の開いた日が少ない／振り返り2週なし／家庭学習1週なし の2つ以上 → 阪神マンの1タップ案内（同じ見た目）、
#    カルテの🌟を必ず1つ以上・はじめの一歩を1問だけ・5分。先生の分析タブに人数と一覧（見るだけ）。
#  ・カルテの「✂おうちの人へ」をなくし、今日のひと往復の指示からも外す（過去の文は消さない）。
#  ・新規: public/kantanref.js、migrations/0044_kantan_ref.sql（本番には先に流してある）。DDL はリクエスト経路に入れていない。
#  ・テスト 37/37。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

