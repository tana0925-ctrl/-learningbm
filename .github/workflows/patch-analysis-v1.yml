name: 分析タブ 作り直し 第1段階 パッチ適用
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: パッチを適用（一致しなければ中止）
        run: python3 scripts/patch_analysis_v1.py

      - name: ビルドが通るか確認
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build

      - name: 変更をコミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/index.html
          git diff --staged --quiet && echo "No changes" || (git commit -m "分析タブ第1段階: 1往復フロー追加 / 児童向け自動AI停止 / ラベル整理" && git push)
