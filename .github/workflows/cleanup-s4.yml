name: 整理 第4段階 (サーバー側の内蔵AIを削除)
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: パッチを適用（一致しなければ中止）
        run: python3 scripts/patch_cleanup_s4.py
      - name: ビルド確認
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: コミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          git diff --staged --quiet && echo "No changes" || (git commit -m "整理 第4段階: 内蔵AI(callGeminiと7つのAPI)と行き場のない関数を削除" && git push)
