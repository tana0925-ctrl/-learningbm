name: patch-hs-photo-multi-v1

# HS_PHOTO_MULTI_V1 (2026-09-24)
#   家庭学習の成果物写真を「ほんとうに複数まい」出せるようにする。
#   ・capture="environment" を外す（iPadで 撮る／えらぶ の両方できる）
#   ・送る前に縮める（長辺1280px / JPEG0.72）
#   ・えらんだぶんを全部おくる（前は1まい目だけで、残りは黙って消えていた）
#   ・保存は homework_photos2 (user_id, day_key, idx)。既存の59まいには触らない
#   ・先生の返却カードにサムネイルをならべる（3行たたみの中なので1行は伸びない）
#   上限は3まい（プランが確認できなかったので安全側）。
#   児童の画面（配信チェーン）は増やさない。増えていたら止まる。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi). awanakereba nanimo kakazu tomaru'
        required: true
        default: '123'
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          wc -c src/index.tsx public/index.html
          sha256sum src/index.tsx public/index.html
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
