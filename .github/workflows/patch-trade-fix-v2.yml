        run: |
          mkdir -p scripts
          python3 -c "import base64,lzma,os,io,re;b=re.sub(r'\s','',os.environ['B']);io.open('scripts/patch_trade_fix_v2.py','wb').write(lzma.decompress(base64.b85decode(b)))"
          python3 scripts/patch_trade_fix_v2.py
      - name: syntax check (source)
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/a.js --log-level=warning
          node --check /tmp/a.js
      - name: public/index.html は変えない
        run: if ! git diff --quiet -- public/index.html; then echo "::error::html changed"; exit 1; fi
      - name: src/index.tsx 以外を変えていない
        run: |
          CHANGED=$(git diff --name-only)
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "src/index.tsx" ]; then echo "::error::unexpected files changed"; exit 1; fi
      - name: commit and push
        run: |
          git add src/index.tsx scripts/patch_trade_fix_v2.py
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          git commit -m "TRADE_FIX_V2: 友達交換の3点修正（失敗理由を画面に出す／キャラの絵の❓／成功しても失敗と出る） (チェーン132->151)"
          git push origin HEAD:main
