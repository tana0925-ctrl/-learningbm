name: patch-trade-fix-v2

# TRADE_FIX_V2 (2026-09-25) 友達交換の3点修正
#   ① 失敗理由を子どもの画面に出す
#      サーバは理由を返している（例 cannot_trade_special / 400）が、交換画面の catch が
#      e を見ずに固定文「⚠️ エラーが発生しました」だけを出して理由を捨てていた。
#      交換できない決まりのキャラ（夏フェス 935-939）を26人中13人が持っており、
#      それを選んだ子は「わけがわからないまま失敗する」状態だった。
#   ② キャラの絵が ❓ になるのを直す
#      絵を m.emoji で読んでいるが、キャラ表は sprite で持っている。
#      過去の交換記録90件すべてが "emoji":"❓"。渡す相手も中身も絵で分からなかった。
#   ③ 成功しても「失敗しました」と出るのを直す
#      成立後の loadData()/画面更新が同じ try の中にあり、そこで転ぶと失敗表示になっていた。
#
#   ④ 交換禁止リストの一元化は入れない（対象キャラの決定に先生の判断が要るため）。
#
# ⚠ 2026-09-25 朝の教師ダッシュボード事故の教訓を反映:
#   - この修正は onclick を1つも追加しない（スクリプト内で 0 件を検証・fail-closed）
#   - 「ソースが正しい」は「配信物が正しい」を意味しない。スクリプトは配信後の姿を作って
#     その <script> を node --check にかけてから push する（fail-closed）
#   - chain_before と実測チェーン数が違えば中止する（ほかの配信との競合検出）

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (app.get(/) ~ app.get(/logout) no .replace( sousuu)'
        required: true
        default: '132'
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout -- .
      - name: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: apply (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
          B: |
