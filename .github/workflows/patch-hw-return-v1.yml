name: patch-hw-return-v1

# HW_RETURN_V1 (2026-09-23)
#   家庭学習の返却一覧に、AIの下書きを流し込む（2026-09-02「整理 第2段階」で消えた導線を戻す）。
#   ・返したら下書きも「公開ずみ」にする
#   ・子どもの言葉とサポーターのことばを3行で畳む
#   ・/api/teacher/ai-drafts の N+1 を解消
#   ・提出シートの写真欄の id 重複を解消
#   src/index.tsx は約1.2MBで web editor では扱えないため、このワークフローで書きかえる。
#   児童の画面（配信チェーン）は増やさない。増えていたら止まる。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi). awanakereba nanimo kakazu tomaru'
        required: true
        default: '122'
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          wc -c src/index.tsx public/index.html
          sha256sum src/index.tsx public/index.html
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
