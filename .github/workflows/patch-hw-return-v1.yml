          wc -c /tmp/p.py
          sha256sum /tmp/p.py
          python3 /tmp/p.py
      - name: syntax check
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/after.js --log-level=warning
          node --check /tmp/after.js
      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c src/index.tsx public/index.html
          sha256sum src/index.tsx public/index.html
      - name: commit and push
        run: |
          git add src/index.tsx public/index.html
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          git commit -m "HW_RETURN_V1: 家庭学習の返却一覧にAIの下書きを流し込む/子どもの言葉とサポーターを3行で畳む/ai-drafts の N+1 解消/写真欄の id 重複を解消 (チェーン122->122)"
          git push origin HEAD:main
