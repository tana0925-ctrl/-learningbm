name: 攻略モード 出撃コスト上限（WARCOST_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: さぎょうツリーを きれいにする
        run: git checkout -- .

      - name: origin/main に おいつく
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 流す直前に チェーンを 実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          if s.count("app.get('/', async (c) => {") != 1:
              print('NG: 家の入口が 一意で ない'); sys.exit(1)
          if s.count("app.get('/logout'") != 1:
              print('NG: 出口が 一意で ない'); sys.exit(1)
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('chain before =', n)
          io.open('/tmp/chain_before.txt', 'w').write(str(n))
          PYEOF

      - name: パッチを 当てる（合わなければ 1文字も 書かずに 中止）
        run: python3 scripts/patch_warcost_v1.py

      - name: さわってはいけない ファイルが 無傷か
        run: |
          git diff --quiet -- public || (echo 'NG: public が 変わっている'; exit 1)
          git diff --quiet -- migrations || (echo 'NG: migrations が 変わっている'; exit 1)
          git status --porcelain
          echo '--- src/index.tsx の さしぶん ---'
          git diff --numstat -- src/index.tsx
          test "$(git diff --numstat -- src/index.tsx | cut -f2)" = "0" || (echo 'NG: src/index.tsx で 行が 消えている'; exit 1)

      - name: ビルドが 通ることを 確認（通らなければ push しない）
        run: |
          npm install
          npm run build

      - name: 中身と 番兵を たしかめる
        run: |
          python3 scripts/patch_warcost_v1.py --verify
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8', newline='').read()
          d = io.open('public/defense2.js', encoding='utf-8', newline='').read()
          before = int(io.open('/tmp/chain_before.txt').read().strip())
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          now = s[i:j].count('.replace(')
          ok = True
          if before != 106:
              print('NG: 直前の チェーンが', before, '（106 のはず）'); ok = False
          if now != 109:
              print('NG: いまの チェーンが', now, '（109 のはず）'); ok = False
          else:
              print('チェーン', before, '->', now)
          for name in ('__WARCOST_V1__', '__ZWEAK_V1__', '__ZWAR_UNLOCK_V1__', 'startZombieWarFromPreview',
                       '__DEFSTAGE_SENTINEL_V1__', '__DEF_MVP_V1__', 'DEF_LV50_V1', 'foeLaneMix',
                       '__S6WORLD_50__', '__H6MERGE_SRC_V1__', '__H6BANK_LIVE_V1__', '__H6U11_BOOST_V1__',
                       '__DEFBOSS_V1', 'HS_NEXT_RECALL_V1', 'WORLD_V1_PATCHES',
                       'defstage_monsters.js', 'def_join_nudge.js'):
              if name not in s:
                  print('NG: 番兵', name, 'が 消えている'); ok = False
          for name in ('DEF2TRY_', 'DEF2SEND_GUARD_V1_MARK', 'DEF2TPL_LEARN_V1', 'DEF2TALLY_TREE_V2'):
              if name not in d:
                  print('NG: 番兵', name, 'が 消えている'); ok = False
          if not ok:
              sys.exit(1)
          print('SENTINELS OK')
          PYEOF

      - name: 配信される HTML を ためしに 組み立てて たしかめる
        run: |
          node - << 'JSEOF'
          const fs = require('fs');
          const s = fs.readFileSync('src/index.tsx', 'utf8');
          let h = fs.readFileSync('public/index.html', 'utf8');
          const base = h.length;
          let bad = false;
          function chk(label, cond) { if (!cond) { console.log('NG:', label); bad = true; } else { console.log('ok:', label); } }

          // src/index.tsx から アンカー対を 読みだす（目で写さない）
          const pairs = [];
          for (let k = 0; k < 3; k++) {
            const ma = s.match(new RegExp('const _wcst' + k + 'a = (".*")'));
            const mb = s.match(new RegExp('const _wcst' + k + 'b = (".*")'));
            if (!ma || !mb) { console.log('NG: _wcst' + k + ' が 見つからない'); process.exit(1); }
            pairs.push([JSON.parse(ma[1]), JSON.parse(mb[1])]);
          }
          for (let k = 0; k < 3; k++) {
            const a = pairs[k][0];
            const f = h.indexOf(a);
            if (f === -1 || f !== h.lastIndexOf(a)) { console.log('NG: あて先', k, 'が 一意でない'); bad = true; }
          }
          if (bad) process.exit(1);
          for (let k = 0; k < 3; k++) { h = h.replace(pairs[k][0], () => pairs[k][1]); }

          chk('コスト上限400が 1か所 入った', h.split('/6), 30, 400);').length - 1 === 1);
          chk('コスト上限160は 疲れ分岐の 1か所だけ 残る', h.split('/6), 30, 160);').length - 1 === 1);
          chk('再出撃の上限が 30秒', h.indexOf('return clamp(sec, 2.5, 30);') !== -1);
          chk('再出撃の上限12秒は 消えた', h.indexOf('return clamp(sec, 2.5, 12);') === -1);
          chk('まちがえたときの globalSpawnCd リセットが 消えた', h.indexOf('warState.globalSpawnCd = 0;\n      warState.slotCd = [0,0,0];') === -1);
          chk('まちがえたときの combo/boost リセットは 残っている', h.indexOf('warState.combo = 0;\n      warState.boostUntil = 0;') !== -1);
          chk('正解時の パワー加算は さわっていない', h.indexOf('warState.power + 12 + warState.combo*2') !== -1);
          chk('HTML が 61〜70文字 みじかくなった（消したのは あの2行だけ）', (base - h.length) >= 60 && (base - h.length) <= 70);

          // コスト式を 実物から とりだして 新旧を 数で くらべる（巻き添えゼロの機械確認）
          const key = 'const cost = clamp(Math.round((hp*0.55 + atk*4 + def*0.8 + spd*0.5)/6), 30, 400);';
          chk('コスト式が 見つかる', h.indexOf(key) !== -1);
          if (bad) process.exit(1);
          const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
          const fNew = new Function('hp', 'atk', 'def', 'spd', 'clamp', key + ' return cost;');
          const fOld = new Function('hp', 'atk', 'def', 'spd', 'clamp',
            key.replace('30, 400', '30, 160') + ' return cost;');
          // 攻略モードでの Lv50 の実値（体力=素HP*0.35*1.8、こうげき=素攻*0.45*1.8、防・速は素のまま）
          const tbl = [
            ['999 阪神マン',            5355, 486, 550, 480, true],
            ['153 タナカティーチャー',  5040, 405, 500, 500, true],
            ['152 なしひろし',          3150, 243, 300, 300, true],
            ['981 にゃんこ大先生',       617, 130, 140, 110, true],
            ['419 ラストエース',         693, 105, 115, 115, false],
            ['1201 ネクロ将軍',          409, 154,  70,  55, false],
            ['1500 聖なる神',            340, 126, 130, 120, false],
            ['154 阪神マン(ボス)',       629,  80,  99,  99, false],
            ['150 通常の最終進化',       140,  50,  72,  72, false],
            ['155 阪神マン(分身)',        63,  20,  25,  25, false],
          ];
          let changed = 0;
          for (const [name, hp, atk, df, spd, expectChange] of tbl) {
            const o = fOld(hp, atk, df, spd, clamp);
            const n = fNew(hp, atk, df, spd, clamp);
            console.log('  ' + name + ': コスト ' + o + ' -> ' + n);
            if ((o !== n) !== expectChange) {
              console.log('NG: ' + name + ' の 変化が 想定と ちがう'); bad = true;
            }
            if (o !== n) changed++;
          }
          chk('値段が 変わるのは 4体だけ', changed === 4);

          // 全キャラ 総ざらい：MONSTERS.push で 定義される キャラを 全部ひろって 新旧を くらべる
          const rx = /MONSTERS\.push\(\{\s*id:\s*([A-Za-z0-9_]+)\s*,\s*name:\s*'([^']*)'[\s\S]{0,200}?hp:\s*(\d+),\s*atk:\s*(\d+),\s*def:\s*(\d+),\s*spd:\s*(\d+)/g;
          const diffNames = [];
          let seen = 0, m2;
          while ((m2 = rx.exec(h)) !== null) {
            seen++;
            const hp = Math.round(Number(m2[3]) * 0.35 * 1.8);
            const atk = Math.round(Number(m2[4]) * 0.45 * 1.8);
            const df = Number(m2[5]), spd = Number(m2[6]);
            if (fOld(hp, atk, df, spd, clamp) !== fNew(hp, atk, df, spd, clamp)) diffNames.push(m2[2]);
          }
          console.log('  しらべた 特別キャラ =', seen, '／ 値段が 変わった =', JSON.stringify(diffNames));
          chk('総ざらいでも 変わるのは 4体だけ', diffNames.length === 4);
          chk('その4体は 阪神マン/タナカティーチャー/なしひろし/にゃんこ大先生',
            diffNames.indexOf('阪神マン') !== -1 && diffNames.indexOf('タナカティーチャー') !== -1 &&
            diffNames.indexOf('なしひろし') !== -1 && diffNames.indexOf('にゃんこ大先生') !== -1);

          // 自動生成キャラ(ID1-150)の 最悪値でも 160に とどかないことを 数で 見る
          // i=49 stage3 が 最大: 素HP=222 素攻=62 def=96 spd=99（guard/speed 補正こみの上限）
          const worst = fOld(Math.round(222 * 0.35 * 1.8), Math.round(62 * 0.45 * 1.8), 96, 99, clamp);
          console.log('  自動生成キャラの 最悪コスト =', worst);
          chk('自動生成キャラ(1-150)は 上限160に とどかない', worst < 160);

          if (bad) process.exit(1);
          console.log('DRY RUN OK');
          JSEOF

      - name: ビルドの 副産物を 元に戻す（src/index.tsx だけ コミットする）
        run: |
          git checkout -- dist package-lock.json 2>/dev/null || true
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/index.tsx
          if git diff --cached --quiet; then
            echo 'かわりなし（すでに 当てずみ）'; exit 0
          fi
          git commit -m 'WARCOST_V1: 攻略モードの 出撃コスト上限 160->400、再出撃上限 12->30秒、まちがえたときの クールダウンリセットを やめる'
          git pull --rebase origin main
          git push origin HEAD:main
