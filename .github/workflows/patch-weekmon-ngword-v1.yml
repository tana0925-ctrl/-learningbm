name: patch-weekmon-ngword-v1

# WEEKMON_V1 週の計画と週の切り替えだけ、月曜は 0:00 から新しい週（毎日の振り返り・家庭学習の日付は 8:30 前は前の日のまま）
#  ・index.html: hsGetWeekDayKey830 を足し、週の計画の画面・計画の保存・振り返りの提出・返事・シートの計画反映・返却バッジの週キーに使う
#    月曜 0:00〜8:30 は振り返りの欄を出さない（新しい週のため）。金曜 8:00 の振り返り表示（kantanref.js）はそのまま
#  ・weekref / maejibun / kantanref / minnafuri の weekKeyNow も同じ。サーバーは月曜は新しい週を先に（週キーの指定が無いときの既定）
# NGWORD_V1 子どもを責める・否定的なことばをやめる
#  ・今日のひと往復ほか阪神マンのAIへの指示に「使わないことば」と悪い例→良い例
#  ・自動で作る文（かんたんふりかえりの理由の候補・カルテの💡わけ・おすすめの印・道順マップ・カルテのひとこと）を前向きな言い方に
#  ・取り込んだ下書きに NG 語（teacher-ai.js の TAI_NG_WORDS で編集可）があれば黄色で知らせ、チェックを外す（自動では消さない）
#  ・テーブル変更なし。テスト 46/46。最後に deploy.yml を起動する。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
