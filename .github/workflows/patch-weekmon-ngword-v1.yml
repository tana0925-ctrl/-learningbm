      - name: markers
        if: env.SKIP != '1'
        run: |
          test $(grep -c 'WEEKMON_V1' public/index.html) -ge 8
          grep -q 'function hsGetWeekDayKey830' public/index.html
          for f in weekref maejibun kantanref minnafuri; do grep -q 'WEEKMON_V1' public/$f.js; done
          grep -q 'WEEKMON_V1' src/index.tsx
          grep -q 'var TAI_NG_WORDS' public/teacher-ai.js
          grep -q 'NGWORD_V1' public/teibako.js
          grep -q '<script src="/teacher-ai.js?v=14"></script>' src/index.tsx
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: |
          for f in public/teacher-ai.js public/teibako.js public/weekref.js public/maejibun.js public/kantanref.js public/minnafuri.js public/karte-michi.js public/hanshin_advice2.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: coin ledger tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          node --no-warnings tests/coin_ledger.test.mjs ./app.after.mjs
          rm -f tests/app.after.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/teacher-ai.js public/teibako.js public/weekref.js public/maejibun.js public/kantanref.js public/minnafuri.js public/karte-michi.js public/hanshin_advice2.js src/index.tsx
          git commit -m "WEEKMON_V1: 週の計画・週の切り替えは月曜0:00から（毎日の日付は8:30のまま）＋NGWORD_V1: 子どもを責める・否定的なことばをやめる（AIへの指示に悪い例→良い例・自動の文を前向きに・取り込み時に黄色で知らせる）（テスト46/46）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
