name: patch-grade-recent-v1

# GRADE_RECENT_V1 学年の解禁に「直近」を足す＋進み具合を見せる。
#
#  (1) 累計 OR 直近。どちらかが「100問正解かや80%」を満たせば開く。
#       直近は recentAnswers（1単元最大100件の正誤）をその学年の全単元で合計する。
#       OR なので、いま開いている子が閉じることは構造的に起きない。
#       D1で児童28人分を変更前後で計算済み：減る子 0人 / 新しく開く子 2人。
#  (2) 鍵のかかった「つぎの学年」を1つだけ、条件と進み具合つきで出す。
#
#  触るのは public/g10core.js だけ。g8core/g9core も public/index.html も触らない。
#
# ・直すのは public/g10core.js（2か所） だけ。
# ・src/index.tsx は1バイトも触らない。チェーン数は「増えていないこと」の確認だけに使う。
#   合わなければ1バイトも書かずに止まる（フェイルクローズ）。
# ・D1 には一切触らない。DDL も流さない。
#
# ⚠️ Deploy は自動で起こさない。手で dispatch する。
# ⚠️ dist/ は .gitignore に書いてあるのに git に入ったままなので、ビルドのたびに必ず変わる。
#    コミットはしないので、差分の確認は「もとになるファイル」だけを見る。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | wc -c

      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_grade_recent_v1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_grade_recent_v1.py

      - name: src/index.tsx は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- src/index.tsx; then
            echo "::error::src/index.tsx が変わっています。中止します。"; exit 1
          fi

      - name: 変わったファイルが想定どおりか
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "public/g10core.js " ]; then
            echo "::error::思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: あてたファイルを控える
        run: |
          mkdir -p /tmp/keep
          cp public/g10core.js /tmp/keep/g10core.js
          
          wc -c public/g10core.js

      - name: ビルド（配信と同じ順番で）
        run: |
          npm ci --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
          cp -f public/*.js dist/ 2>/dev/null || true

      - name: あてたファイルを戻して、差分が想定どおりのままか見る
        run: |
          cp -f /tmp/keep/g10core.js public/g10core.js
          
          CHANGED=$(git diff --name-only -- src public scripts .github package.json package-lock.json | sort | tr '\n' ' ')
          echo "changed(src): $CHANGED"
          if [ "$CHANGED" != "public/g10core.js " ]; then
            echo "::error::ビルドのあとで思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: 配信HTMLの構文検査（教師ページ側）
        run: node scripts/render_check.mjs

      - name: 配信HTMLの構文検査（児童ページ側・この便では必須）
        run: node scripts/render_check_child.mjs

      - name: 配信HTMLで中身を確かめる
        run: |
          cat > /tmp/verify.mjs <<'JSEOF'
          import fs from 'fs';
          const mod = await import(process.cwd() + '/dist/_worker.js');
          const env = { ASSETS: { fetch: async (req) => {
            const u = new URL(typeof req === 'string' ? req : req.url);
            const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname;
            try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }); }
            catch (e) { return new Response('', { status: 404 }); } } } };
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} });
          const html = await res.text();
          const count = (s) => html.split(s).length - 1;
          // g10core.js は配信HTMLとは別ファイルなので、直接読んで確かめる
          const g10 = fs.readFileSync(process.cwd() + '/public/g10core.js', 'utf8');
          const gc = (s) => g10.split(s).length - 1;
          const need = {
            '1 番兵': ['__GRADE_RECENT_V1__', 2],
            '2 直近の集計': ['function recentStats(L)', 1],
            '3 OR判定': ['var r = recentStats(L);', 1],
            '4 進み具合の表示': ['function addNextHint()', 1],
            '5 表示の呼び出し': ['addNextHint();', 1],
            '6 もとの累計集計': ['function gradeStats(L)', 1],
            '7 解禁チェック': ['G10.checkUnlock', 1],
          };
          for (const k of Object.keys(need)) {
            const [s, want] = need[k];
            const n = gc(s);
            console.log('  ' + k + ': ' + n + ' 件（想定 ' + want + '）');
            if (n !== want) throw new Error('g10core.js の「' + k + '」が ' + n + ' 件（想定 ' + want + '）');
          }
          // 構文チェック（壊れた JS を配らない）
          new Function(g10);
          console.log('  g10core.js の構文 OK (' + g10.length + ' 文字)');
          // 児童ページ本体は触っていないこと
          for (const [label, s, want] of [
            ['前便(テンキー)', '__BATTLEUI_FIX_V1__', 1],
            ['前便(九九)', '__KUKU_UNIFY_V1__', 1],
            ['前便(faviconほか)', '__REVIEW_BCD_V1__', 3],
          ]) {
            const n = count(s);
            console.log('  ' + label + ': ' + n + ' 件（想定 ' + want + '）');
            if (n !== want) throw new Error('配信HTMLの「' + label + '」が ' + n + ' 件');
          }
          console.log('配信HTML ' + html.length + ' 文字。想定どおり。');
          JSEOF
          node /tmp/verify.mjs

      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          h = open('public/index.html', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash', 'registerMi(app)', 'registerQrHunt(app)',
                    'OCTGACHA_V1']:
              n = s.count(k)
              print('src  %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          for k in ['window.monSpriteHtml', 'monShinySet', 'WILDIMG_V2', 'pveGradeSelectorWrap',
                    '__REVIEW_BADANS_A1__', '__PVE_GRADE_LOCK_V1__', '二酸化炭素が発生']:
              n = h.count(k)
              print('html %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF

      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c public/g10core.js

      - name: commit and push
        run: |
          git add public/g10core.js
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "GRADE_RECENT_V1: 解禁に直近を足す＋つぎの学年の進み具合を出す（g10core.js 2か所・減る子0人・チェーン${{ inputs.chain_before }}->据え置き）"
          git push origin HEAD:main
