name: ショップ（TBTICKET_NOLIMIT_V1・バトルチケットの1日の上限をはずす）

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'src/index.tsx の .replace( チェーン数（dispatch 直前に数えた値）'
        required: true

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを綺麗にする
        run: git checkout -- .

      - name: origin/main に追いつく
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: チェーン数とアンカーを実測して照合（合わなければ中止）
        env:
          CHAIN_BEFORE: ${{ github.event.inputs.chain_before }}
        run: |
          python3 - << 'PYEOF'
          import io, os, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          h = io.open('public/index.html', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          want = int(os.environ['CHAIN_BEFORE'])
          print('chain=', n, ' 期待=', want)
          if n != want:
              print('NG: チェーンが %d 件（期待 %d）。中止' % (n, want)); sys.exit(1)
          if 'TBTICKET_NOLIMIT_V1' in h:
              print('すでに適用ずみ')
          else:
              if h.count('if (sold >= 5)') != 3:
                  print('NG: 上限3か所が見つからない'); sys.exit(1)
              if h.count('if (sold >= 3)') != 2:
                  print('NG: 強化チケットの上限が2か所でない'); sys.exit(1)
          PYEOF

      - name: パッチを適用（一致しなければ中止）
        run: python3 scripts/patch_shop_ticket_nolimit_v1.py

      - name: 触ったファイルが public/index.html だけか
        run: |
          CHANGED="$(git diff --name-only | tr '\n' ' ' | xargs)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "public/index.html" ]; then
            echo "NG: さわったファイルが public/index.html だけでない: $CHANGED"; exit 1
          fi
          echo "さわったファイル: [$CHANGED]"

      - name: ビルドが通ることを確認（通らなければ push しない）
        run: |
          npm install
          npm run build

      - name: 配信HTMLの構文チェック（既存のものをそのまま使う）
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs

      - name: 壊してはいけないものが無傷か
        run: |
          python3 - << 'PYEOF'
          import io, sys
          h = io.open('public/index.html', encoding='utf-8').read()
          ok = [True]
          def chk(label, got, want):
              if got != want:
                  print('NG: %s が %s 件（期待 %s）' % (label, got, want)); ok[0] = False
          chk('目印', h.count('TBTICKET_NOLIMIT_V1'), 3)
          chk('上限5の残り', h.count('if (sold >= 5)'), 0)
          chk('強化チケットの上限3', h.count('if (sold >= 3)'), 2)
          chk('バトルチケットの値段', h.count("{ id: 'gym_ticket', name: 'バトルチケット', price: 50"), 1)
          chk('チケットを1枚ふやす処理', h.count('player.gymTickets = (player.gymTickets || 0) + 1;'), 3)
          chk('ターン制の読み込み目印', h.count('TBATTLE_V1_MARK'), 1)
          chk('</body>', h.count('</body>'), 1)
          for label, text in (
              ('野生バトルの画面', 'id="screen-battle"'),
              ('ジムの画面', 'id="screen-gym"'),
              ('タイプシュート', 'typeshoot.js'),
              ('色違いの表', '/mon/shiny.js'),
          ):
              if h.count(text) < 1:
                  print('NG: %s が消えている' % label); ok[0] = False
          if not ok[0]:
              sys.exit(1)
          print('VERIFY OK')
          PYEOF

      - name: ビルドの副産物を元に戻す
        run: |
          git checkout -- dist package-lock.json 2>/dev/null || true
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo '変更なし（すでに適用済み）'
          else
            git commit -m 'TBTICKET_NOLIMIT_V1: バトルチケットの1日5枚の上限をはずす（強化チケットの上限はそのまま）'
            git push origin HEAD:main
          fi
