name: patch-shiny-colors-v3

# SHINY_COLORS_V3 (第3便)
#   色違いの色を、キャラごとに決める。絵は1枚も増やさない。
#   public/mon/*.png の色を読んで 6通りの型に割りふり、public/mon/shiny.js（数KB）を作る。
#   白・灰色など色みのうすいキャラは hue-rotate では変わらないので sepia で染める型にする。
#   さわるのは public/index.html と 新しい public/mon/shiny.js だけ。
#   src/index.tsx は触らない（置換チェーンは増えない）。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi). awanakereba nanimo kakazu tomaru'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          wc -c src/index.tsx public/index.html
          sha256sum src/index.tsx public/index.html
      - name: install Pillow
        run: python3 -m pip install --break-system-packages --quiet pillow
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_shiny_colors_v3.py
      - name: keep the patched files aside
        run: |
          cp public/index.html /tmp/patched_index.html
          cp public/mon/shiny.js /tmp/shiny.js
          head -c 300 public/mon/shiny.js
          echo
          wc -c public/mon/shiny.js
      - name: syntax check (shiny.js)
        run: node --check public/mon/shiny.js
      - name: build
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: render check (teacher pages)
        run: node scripts/render_check.mjs
      - name: render check (child page)
        run: node scripts/render_check_child.mjs
      - name: restore the patched files (do not commit inject-rt output)
        run: |
          cp /tmp/patched_index.html public/index.html
          cp /tmp/shiny.js public/mon/shiny.js
          sha256sum src/index.tsx public/index.html public/mon/shiny.js
      - name: record diff
        run: |
          git --no-pager diff --stat
          git status --porcelain
      - name: commit and push
        run: |
          git add public/index.html public/mon/shiny.js
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          if git diff --cached --name-only | grep -qx 'src/index.tsx'; then echo "::error::src/index.tsx must not change"; exit 1; fi
          git commit -m "SHINY_COLORS_V3: 色違いの色をキャラごとに（.sv1〜.sv6 と public/mon/shiny.js・絵は増やさない） (チェーン ${{ inputs.chain_before }} のまま)"
          git push origin HEAD:main
