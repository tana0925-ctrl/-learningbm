      - name: markers
        if: env.SKIP != '1'
        run: |
          grep -q '<script src="/karte-michi.js?v=4"></script>' src/index.tsx
          grep -q 'isTaught(g, z.inf.id)' public/karte-michi.js
          grep -q 'function resolveNow(guide, sg, subj)' public/karte-michi.js
          grep -q "id = 'nowUnitBox'" public/karte-michi.js
          ! grep -n -E "CREATE (TABLE|INDEX)|ALTER TABLE" public/karte-michi.js
          ! grep -n "CREATE TABLE IF NOT EXISTS class_now_units" src/index.tsx
      - name: syntax check (browser js)
        if: env.SKIP != '1'
        run: node -e "new Function(require('fs').readFileSync('public/karte-michi.js','utf8'))" && echo ok
      - name: unit test (karte-michi 🅰🅱)
        if: env.SKIP != '1'
        run: node tests/nowunit.test.mjs
      - name: install
        if: env.SKIP != '1'
        run: npm install --no-audit --no-fund
      - name: build
        if: env.SKIP != '1'
        run: npm run build
      - name: render check (teacher page scripts / child page)
        if: env.SKIP != '1'
        run: |
          node scripts/render_check.mjs
          node scripts/render_check_child.mjs
      - name: tests (node:sqlite, real handlers)
        if: env.SKIP != '1'
        run: |
          npx esbuild src/index.tsx --bundle --format=esm --platform=neutral \
            --jsx=automatic --jsx-import-source=hono/jsx \
            --outfile=tests/app.after.mjs --log-level=warning
          npx esbuild src/viewas.ts --bundle --format=esm --platform=neutral --outfile=tests/viewas.mod.mjs --log-level=warning
          cd tests
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs 2>/dev/null | grep -E "^(PASS|FAIL)|passed"
          node --no-warnings coin_ledger.test.mjs ./app.after.mjs > /dev/null 2>&1
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs 2>/dev/null | grep -E "passed"
          node --no-warnings viewas.test.mjs ./app.after.mjs ./viewas.mod.mjs > /dev/null 2>&1
          rm -f app.after.mjs viewas.mod.mjs
      - name: served check (teacher page has karte-michi.js v=4 and it is served)
        if: env.SKIP != '1'
        run: |
          cat > /tmp/dump.mjs <<'JSEOF'
          import fs from 'fs'
          const mod = await import(process.cwd() + '/dist/_worker.js')
          const env = { ASSETS: { fetch: async (req) => { const u = new URL(typeof req === 'string' ? req : req.url); const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname; try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }) } catch (e) { return new Response('', { status: 404 }) } } } }
          const res = await mod.default.fetch(new Request('http://localhost/teacher'), env, { waitUntil() {} })
          const h = await res.text()
          if (h.indexOf('/karte-michi.js?v=4') < 0) { console.log('注入なし karte-michi v=4'); process.exit(1) }
          const js = await mod.default.fetch(new Request('http://localhost/karte-michi.js'), env, { waitUntil() {} })
          const t = await js.text()
          if (js.status !== 200 || t.indexOf('isTaught(g, z.inf.id)') < 0) { console.log('karte-michi.js が配られない ' + js.status); process.exit(1) }
          console.log('served ok')
          JSEOF
          node /tmp/dump.mjs
      - name: commit and push
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx public/karte-michi.js tests/nowunit.test.mjs
          git commit -m "NOWUNIT_V2: いまの単元の自動推定で攻略モードの「まだ」をのぞく・同じ人数なら先の単元／🅱が教科のはじめにもどらず授業の単元へ（karte-michi v=4・テスト11/11＋58/58＋14/14）"
          git checkout -- . && git clean -fdq -e node_modules
          git pull --rebase origin main
          git push origin HEAD:main
      - name: start deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
