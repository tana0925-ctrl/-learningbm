name: patch-nowunit-v2

# NOWUNIT_V2 いまの単元の自動推定をかしこく＋🅱のはじめもどりを止める（NOWUNIT_V1 のつづき）
#  ・③クラスの記録からの自動推定：攻略モードで「まだ習っていない」にした単元はのぞく／人数が同じなら教科書で先の単元。
#  ・本人がえらんだ単元・先生の差しかえのときも、先に進む単元が無ければ🅱は「いまの単元」へ（教科のはじめに もどらない）。
#  ・変更: public/karte-michi.js（v=4）・src/index.tsx（script の v だけ）・tests/nowunit.test.mjs（11/11）。DDL なし。

