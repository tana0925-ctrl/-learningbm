name: 防衛戦 第3便・第2段の追い（DEFSTAGE_CHARS_ROUTE_V1・キャラのファイルを配る道）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを綺麗にする
        run: git checkout -- .

      - name: origin/main に追いつく
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 第1段・第2段が入っていること
        run: |
          test -f public/defstage_monsters.js
          grep -q '__DEFSTAGE_BONUS_V1__' src/index.tsx
          grep -q '__DEFSTAGE_CHARS_V1__' src/index.tsx
          echo '前の便はすべて入っている'

      - name: 流す前にチェーンとアンカーの一意性を実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          applied = '__DEFSTAGE_CHARS_ROUTE_V1__' in s
          print('chain before =', n, 'applied =', applied)
          if n != 74:
              print('NG: チェーンが 74 件でない'); sys.exit(1)
          if not applied:
              for label, t in [
                  ('root', "app.get('/', async (c) => {"),
                  ('logout', "app.get('/logout'"),
                  ('student-karte の道', "app.get('/student-karte.js'"),
                  ('defense2 の道', "app.get('/defense2.js'"),
                  ('読み込みの1行', '<script src="/defstage_monsters.js?v=1"></script>'),
              ]:
                  c = s.count(t)
                  if c != 1:
                      print('NG: アンカー %s が %d 件（期待 1）' % (label, c)); sys.exit(1)
              if s.count("app.get('/defstage_monsters.js'") != 0:
                  print('NG: もう道がある'); sys.exit(1)
              print('アンカーはすべて一意')
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_defstage_chars_route_v1.py

      - name: 冪等の確認（2回流しても増えない・番兵で抜ける）
        run: python3 scripts/patch_defstage_chars_route_v1.py

      - name: src/index.tsx 以外は無傷であること
        run: |
          git diff --name-only
          if git diff --name-only | grep -vE '^src/index\.tsx$' | grep -q .; then
            echo 'NG: src/index.tsx 以外が変わっている'; exit 1
          fi

      - name: 流したあとの検証
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          d = io.open('public/defense2.js', encoding='utf-8').read()
          m = io.open('public/defstage_monsters.js', encoding='utf-8').read()
          ok = [True]
          def chk(label, got, want):
              if got != want:
                  print('NG: %s が %s 件（期待 %s）' % (label, got, want)); ok[0] = False
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('replace chain:', n)
          chk('チェーン', n, 74)
          chk('番兵', s.count('__DEFSTAGE_CHARS_ROUTE_V1__'), 1)
          chk('足した道', s.count("app.get('/defstage_monsters.js'"), 1)
          chk('読み込みの1行', s.count('<script src="/defstage_monsters.js?v=1"></script>'), 1)
          for _id in ('1601', '1602', '1604', '1605'):
              chk('キャラ ' + _id, m.count('id: ' + _id + ','), 1)
          chk('__DEFSTAGE_BONUS_V1__', s.count('__DEFSTAGE_BONUS_V1__'), 7)
          chk('__DEFSTAGE_CHARS_V1__', s.count('__DEFSTAGE_CHARS_V1__'), 1)
          chk('__DEFSTAGE_SENTINEL_V1__', s.count('__DEFSTAGE_SENTINEL_V1__'), 1)
          chk('__DEF_SNAP_SPDSKILLS_V1__', s.count('__DEF_SNAP_SPDSKILLS_V1__'), 1)
          chk('__DEF_RESOLVE_VERIFY_V1__', s.count('__DEF_RESOLVE_VERIFY_V1__'), 1)
          chk('log の v===2 条件', s.count('Number(_dvLog.v) === 2'), 1)
          chk('baseHpA の有限数条件', s.count('Number.isFinite(Number(_dvRep.baseHpA))'), 1)
          chk('retry true', s.count('retry: true'), 2)
          chk('log の 900000 上限', s.count('900000'), 1)
          chk('defense_standing', s.count('defense_standing'), 4)
          chk('defense_carry_lock', s.count('defense_carry_lock'), 1)
          chk('defAutoAdvanceV1', s.count('defAutoAdvanceV1'), 3)
          chk('ensureDefenseTables() の呼び出し', s.count('ensureDefenseTables()'), 0)
          chk('基地HP 380', s.count('DEFENSE_BASE_HP = 380'), 1)
          chk('勝利コイン 20', s.count('DEFENSE_WIN_COINS = 20'), 1)
          chk('defStageEnemies の呼び出し', s.count('defStageEnemies('), 3)
          chk('ステージ前進の UPDATE', s.count('UPDATE defense_stage SET stage = stage + 1'), 2)
          chk('降格の経路', s.count('stage - 1'), 0)
          chk('台帳の予約', s.count("UPDATE defense_stage_rewards SET applied_at = datetime('now')"), 1)
          chk('台帳の解放', s.count('UPDATE defense_stage_rewards SET applied_at = NULL'), 1)
          chk('defense2 の早期抜け', d.count('__DEF2_SKIP_LOCAL_V1__'), 1)
          chk('defense2 の makeResolve', d.count('function makeResolve(orig){'), 1)
          chk('結果画面のステージ表示', d.count('st.stage_bonus'), 1)
          _a = s.index("app.get('/api/teacher/defense/dry-run'")
          _b = s.index("app.post('/api/defense/resolve'", _a)
          for _w in ('INSERT', 'UPDATE', 'DELETE', '.run()', '.batch('):
              if _w in s[_a:_b]:
                  print('NG: dry-run に書き込み %s が入っている' % _w); ok[0] = False
          if not ok[0]:
              sys.exit(1)
          print('検証 OK')
          PYEOF

      - name: ビルドが通ること（dist は元に戻す）
        run: |
          npm install
          npm run build
          test -f dist/defstage_monsters.js && echo 'dist にキャラのファイルがある'
          git checkout -- dist public package-lock.json 2>/dev/null || true
          git clean -fdq dist 2>/dev/null || true
          git status --porcelain

      - name: コミットして push
        run: |
          git add src/index.tsx
          if git diff --cached --quiet; then
            echo '変更なし（すでに適用済み）'; exit 0
          fi
          git commit -m 'DEFSTAGE_CHARS_ROUTE_V1: げんていキャラのファイルを配る道を1本足す（本番で 404 だったため）'
          git pull --rebase origin main
          git push origin HEAD:main
