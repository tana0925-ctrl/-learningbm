name: 家庭学習 まえの「つぎにすること」を入力の上に置く（HS_NEXT_RECALL_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを綺麗にする
        run: git checkout -- .

      - name: origin/main に追いつく
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 流す直前にチェーンとアンカーの一意性を実測する
        run: |
          python3 - << 'PYEOF'
          import io, os, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          applied = 'HS_NEXT_RECALL_V1_WIRED' in s
          print('chain before =', n, 'applied =', applied)
          io.open('/tmp/chain_before.txt', 'w').write(str(n))
          if not os.path.exists('public/hs_next_recall.js'):
              print('NG: public/hs_next_recall.js が無い'); sys.exit(1)
          if 'hsNextImprove' not in io.open('public/index.html', encoding='utf-8').read():
              print('NG: 入力らん hsNextImprove が 見あたらない'); sys.exit(1)
          if not applied:
              anchors = [
                  ('root', "app.get('/', async (c) => {"),
                  ('logout', "app.get('/logout'"),
                  ('道の場所', "// DEF_JOIN_NUDGE_V1_WIRED"),
                  ('読み込みの場所', ".replace('</body>', '<script src=\"/shiny-news.js?v=1\"></script></body>')"),
              ]
              for label, text in anchors:
                  c = s.count(text)
                  if c != 1:
                      print('NG: アンカー %s が %d 件（期待 1）' % (label, c)); sys.exit(1)
              if "app.get('/hs_next_recall.js'" in s:
                  print('NG: 同じ道が もうある'); sys.exit(1)
              print('アンカーはすべて一意')
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_hs_next_recall_v1.py

      - name: 触ってはいけないファイルが無傷か
        run: |
          git diff --quiet -- public/index.html || (echo 'NG: public/index.html が変わっている'; exit 1)
          git diff --quiet -- public/defense2.js src/def_engine.ts src/def_resolve.ts src/def_stage.ts || (echo 'NG: 防衛戦のファイルが変わっている'; exit 1)
          git diff --quiet -- migrations || (echo 'NG: migrations が変わっている'; exit 1)
          echo 'src/index.tsx 以外は無傷'

      - name: ビルドが通ることを確認（通らなければ push しない）
        run: |
          npm install
          npm run build

      - name: 配線と、壊してはいけない番兵を確かめる
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          a = io.open('public/hs_next_recall.js', encoding='utf-8').read()
          d = io.open('public/defense2.js', encoding='utf-8').read()
          h = io.open('public/index.html', encoding='utf-8').read()
          w = io.open('dist/_worker.js', encoding='utf-8').read()
          before = int(io.open('/tmp/chain_before.txt').read().strip())
          ok = [True]
          def chk(label, got, want):
              if got != want:
                  print('NG: %s が %s 件（期待 %s）' % (label, got, want)); ok[0] = False
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          now = s[i:j].count('.replace(')
          if now != before + 1:
              print('NG: チェーンが %d（期待 %d）' % (now, before + 1)); ok[0] = False
          else:
              print('チェーン %d -> %d（ふえたのは 自分の1件だけ）' % (before, now))
          chk('配る道', s.count("app.get('/hs_next_recall.js'"), 1)
          chk('読み込み', s.count('/hs_next_recall.js?v=1'), 1)
          chk('印', s.count('HS_NEXT_RECALL_V1_WIRED'), 2)
          chk('中身の印', a.count('__HS_NEXT_RECALL_V1__'), 1)
          chk('直近3回', a.count('slice(0, 3)'), 1)
          chk('入力らんの すぐ上', a.count('insertBefore(host, ta)'), 1)
          if w.count('hs_next_recall.js') < 2:
              print('NG: ビルドに入っていない'); ok[0] = False
          for bad in ('coins', 'shards', 'streak', 'れんぞく', 'fetch('):
              if bad in a:
                  print('NG: 見せるだけのはずが %s に さわっている' % bad); ok[0] = False
          for name in ('__DEFSTAGE_SENTINEL_V1__', '__DEF_MVP_V1__', 'DEF_LV50_V1', 'foeLaneMix',
                       '__S6WORLD_50__', '__H6MERGE_SRC_V1__', '__H6BANK_LIVE_V1__', '__H6U11_BOOST_V1__'):
              if name not in s:
                  print('NG: 番兵 %s が消えている' % name); ok[0] = False
          for name in ('DEF2TRY_', 'DEF2SEND_GUARD_V1_MARK', 'DEF2TPL_LEARN_V1', 'DEF2TALLY_TREE_V2'):
              if name not in d:
                  print('NG: 番兵 %s が消えている' % name); ok[0] = False
          chk('カルテの道', s.count("app.get('/student-karte.js'"), 1)
          chk('お知らせの道', s.count("app.get('/def_join_nudge.js'"), 1)
          chk('リクエストで表を作らない', s.count('ensureDefenseTables()'), 0)
          chk('履歴（最新100件）は そのまま', h.count('履歴（最新100件）'), 2)
          if not ok[0]:
              sys.exit(1)
          print('VERIFY OK')
          PYEOF

      - name: ビルドの副産物を元に戻す（src だけコミットする）
        run: |
          git checkout -- dist package-lock.json 2>/dev/null || true
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/index.tsx
          if git diff --cached --quiet; then
            echo '変更なし（すでに配線ずみ）'; exit 0
          fi
          git commit -m 'HS_NEXT_RECALL_V1: 入力の すぐ上に まえの「つぎにすること」を3回ぶん置く'
          git pull --rebase origin main
          git push origin HEAD:main
