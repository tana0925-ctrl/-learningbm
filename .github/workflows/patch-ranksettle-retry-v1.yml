name: patch-ranksettle-retry-v1

# RANKSETTLE_RETRY_V1 (2026-09-24)
#   週次ランキング報酬の確定（settleClassWeek）を、途中で落ちても配り直せる形にする。
#     ・もとは「配り終えた印」を先に立ててから配っていたので、配っている途中で
#       処理が打ち切られると、その週は二度と配られなかった。
#       2026-09-07 の週は実際に1人目で止まり、4人ぶん32かけらが未付与になった。
#     ・印を「作業中(RUN <ISO>)」と「完了(日時だけ)」の二段にして、最後まで
#       配り終えたときだけ「完了」にする。落ちた印は10分後に引き継いで配り直す。
#     ・かけらを progress に足せなかったら、入れた台帳の行を消して枠を解放する
#       （class-mission/:id/claim と同じ作法）。そのときは「完了」にしない。
#     ・先生用アカウント(role='admin')を順位から外す。
#   昔の settled_at 行には 'RUN ' が付いていないので「完了」扱い＝過去の週は動かさない。
#   児童の画面（配信チェーン）は増減しない。増減していたら書かずに止まる。
#   DDL は一切なし（列も表も足さない）。public/index.html は触らない。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | wc -c
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | sha256sum
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_ranksettle_retry_v1.py
      - name: public/index.html は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- public/index.html; then
            echo "::error::public/index.html が変わっています。中止します。"; exit 1
          fi
      - name: src/index.tsx 以外は変わっていないこと
        run: |
          CHANGED=$(git diff --name-only)
          echo "$CHANGED"
          if [ "$CHANGED" != "src/index.tsx" ]; then
            echo "::error::src/index.tsx 以外が変わっています。中止します。"; exit 1
          fi
      - name: 構文検査
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/after.js --log-level=warning
          node --check /tmp/after.js
      - name: 児童データを壊す書き方が増えていないこと
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys
          old = subprocess.run(['git','show','HEAD:src/index.tsx'], capture_output=True).stdout.decode('utf-8')
          new = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          # progress への全体上書きと、危ない DDL / 削除が増えていないこと
          for k in ['UPDATE progress SET state_json',
                    'INSERT INTO progress',
                    'DELETE FROM progress',
                    'DELETE FROM users',
                    'ALTER TABLE',
                    'DROP TABLE',
                    'DROP INDEX']:
              o, n = old.count(k), new.count(k)
              print('%-32s %d -> %d' % (k, o, n))
              if n > o:
                  print('::error::%s が増えています（%d -> %d）' % (k, o, n)); bad = True
          if bad: sys.exit(1)
          PYEOF
      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash',
                    '_rankShardsApplied', '_hwCoinsApplied', 'RANKSETTLE_RETRY_V1']:
              n = s.count(k)
              print('%-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF
      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c src/index.tsx
          sha256sum src/index.tsx
      - name: commit and push
        run: |
          git add src/index.tsx
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "RANKSETTLE_RETRY_V1: ランキング報酬の確定を途中で落ちても配り直せる形に／先生用アカウントを順位から外す（チェーン123->123）"
          git push origin HEAD:main
