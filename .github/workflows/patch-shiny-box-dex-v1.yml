name: patch-shiny-box-dex-v1

# SHINY_BOX_DEX_V1 (第1便)
#   1) ボックスの1マスに色違いの印（個体単位 entry.shiny / .shiny-mon + 金リング）
#   2) 図鑑の詳細をノーマル既定に。持っている子だけ「色ちがいを見る」で切り替え
#      （いまは種族単位 player.monsters[id].shiny で色違いに固定され、ノーマルが見られない）
#   3) ボールの連打どめ 1.2秒。実測で同じ個体が1秒いないに3体できていた
#   さわるのは public/index.html だけ。src/index.tsx は読むだけで書き換えない。
#   置換チェーンは増えない。chain_before は衝突検知のためだけに照合する。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi). awanakereba nanimo kakazu tomaru'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: reset working tree
        run: git checkout -- .
      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record HEAD before
        run: |
          git rev-parse HEAD
          wc -c src/index.tsx public/index.html
          sha256sum src/index.tsx public/index.html
      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_shiny_box_dex_v1.py
      - name: keep the patched file aside
        run: cp public/index.html /tmp/patched_index.html
      - name: build
        run: |
          npm install --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
      - name: render check (teacher pages)
        run: node scripts/render_check.mjs
      - name: render check (child page)
        run: node scripts/render_check_child.mjs
      - name: restore the patched file (do not commit inject-rt output)
        run: |
          cp /tmp/patched_index.html public/index.html
          sha256sum public/index.html
      - name: record diff
        run: |
          git --no-pager diff --stat
          git --no-pager diff --numstat
          git status --porcelain
      - name: commit and push
        run: |
          git add public/index.html
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          if ! git diff --cached --name-only | grep -qx 'public/index.html'; then echo "::error::public/index.html not staged"; exit 1; fi
          if git diff --cached --name-only | grep -qx 'src/index.tsx'; then echo "::error::src/index.tsx must not change"; exit 1; fi
          git commit -m "SHINY_BOX_DEX_V1: ボックスに色違いの印 / 図鑑詳細をノーマル既定+切り替え / ボール連打どめ (チェーン ${{ inputs.chain_before }} のまま)"
          git push origin HEAD:main
