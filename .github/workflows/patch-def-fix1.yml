name: Patch defense fix1 (frozen stats)
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dry run (anchor check only)
        run: python3 scripts/patch_def_fix1_frozen_stats.py --check
      - name: Run patch
        run: python3 scripts/patch_def_fix1_frozen_stats.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/defense2.js
          git diff --staged --quiet && echo "No changes" || (git commit -m "fix(defense): use entry-time stats, ignore resolver's fatigue/star" && git push)
