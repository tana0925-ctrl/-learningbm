name: patch-review-math-v1

# REVIEW_MATH_V1 復習に出す前に計算式を検算する。
#
#  先生の報告：2+3 に 5 と答えると「ちがうよ」で「正解：6」と出る。
#  保存データ m6-frac-mul || 2+3=? || 6 が残っているため。
#  REVIEW_BADANS_A1 は「問題文に日本語がある」を条件にしていたので、
#  日本語の無いこの式は対象外だった。
#
#  _revOK の先頭に「四則の単純な式を実際に計算し、合っていなければ出さない」を足す。
#  日本語入り・虫食い・筆算・かっこ・答えが数でないものは検算せず残す（疑わしきは残す）。
#  小数の丸め誤差は 1e-9 で吸収。「あまり」の連結仕様は日本語判定で除外される。
#
#  本番データ166件（問題文に日本語が無いもの）で実測済み：
#    落とす 2件（2+3=?→6 / 2/3÷1/2=?→6）、誤って落とすもの 0件。
#
# ・直すのは public/index.html（1か所） だけ。
# ・src/index.tsx は1バイトも触らない。チェーン数は「増えていないこと」の確認だけに使う。
#   合わなければ1バイトも書かずに止まる（フェイルクローズ）。
# ・D1 には一切触らない。DDL も流さない。
#
# ⚠️ Deploy は自動で起こさない。手で dispatch する。
# ⚠️ dist/ は .gitignore に書いてあるのに git に入ったままなので、ビルドのたびに必ず変わる。
#    コミットはしないので、差分の確認は「もとになるファイル」だけを見る。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: '流す直前に実測したチェーン件数（合わなければ何も書かずに止まる）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: reset working tree
        run: git checkout -- .

      - name: rebase on origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: record HEAD before
        run: |
          git rev-parse HEAD
          git show HEAD:src/index.tsx | sha256sum
          git show HEAD:public/index.html | wc -c

      - name: apply patch (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_review_math_v1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
        run: python3 scripts/patch_review_math_v1.py

      - name: src/index.tsx は1バイトも変わっていないこと
        run: |
          if ! git diff --quiet -- src/index.tsx; then
            echo "::error::src/index.tsx が変わっています。中止します。"; exit 1
          fi

      - name: 変わったファイルが想定どおりか
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: あてたファイルを控える
        run: |
          mkdir -p /tmp/keep
          cp public/index.html /tmp/keep/index.html
          
          wc -c public/index.html

      - name: ビルド（配信と同じ順番で）
        run: |
          npm ci --no-audit --no-fund
          python3 scripts/inject-rt.py
          npm run build
          cp -f public/*.js dist/ 2>/dev/null || true

      - name: あてたファイルを戻して、差分が想定どおりのままか見る
        run: |
          cp -f /tmp/keep/index.html public/index.html
          
          CHANGED=$(git diff --name-only -- src public scripts .github package.json package-lock.json | sort | tr '\n' ' ')
          echo "changed(src): $CHANGED"
          if [ "$CHANGED" != "public/index.html " ]; then
            echo "::error::ビルドのあとで思っていないファイルが変わっています。中止します。"; exit 1
          fi

      - name: 配信HTMLの構文検査（教師ページ側）
        run: node scripts/render_check.mjs

      - name: 配信HTMLの構文検査（児童ページ側・この便では必須）
        run: node scripts/render_check_child.mjs

      - name: 配信HTMLで中身を確かめる
        run: |
          cat > /tmp/verify.mjs <<'JSEOF'
          import fs from 'fs';
          const mod = await import(process.cwd() + '/dist/_worker.js');
          const env = { ASSETS: { fetch: async (req) => {
            const u = new URL(typeof req === 'string' ? req : req.url);
            const p = (!u.pathname || u.pathname === '/') ? '/index.html' : u.pathname;
            try { return new Response(fs.readFileSync(process.cwd() + '/public' + p), { status: 200 }); }
            catch (e) { return new Response('', { status: 404 }); } } } };
          const res = await mod.default.fetch(new Request('http://localhost/'), env, { waitUntil() {} });
          const html = await res.text();
          const count = (s) => html.split(s).length - 1;
          const need = {
            '1 番兵': ['__REVIEW_MATH_V1__', 1],
            '2 検算の定義': ['function _revMathBad(x)', 1],
            '3 検算の呼び出し': ['if (_revMathBad(x) === true) { return false; }', 1],
            '4 もとのふるい分け': ['window._revOK = function', 1],
            '5 前便 A の番兵': ['__REVIEW_BADANS_A1__', 1],
            '6 前便 BCD の番兵': ['__REVIEW_BCD_V1__', 3],
          };
          for (const k of Object.keys(need)) {
            const [s, want] = need[k];
            const n = count(s);
            console.log('  ' + k + ': ' + n + ' 件（想定 ' + want + '）');
            if (n !== want) throw new Error('配信HTMLの「' + k + '」が ' + n + ' 件（想定 ' + want + '）');
          }
          // 配信HTMLから _revMathBad を取り出して、実際に動かして確かめる
          const mb0 = html.indexOf('function _revMathBad(x) {');
          const mb1 = html.indexOf('window._revMathBad = _revMathBad;');
          if (mb0 < 0 || mb1 < 0) throw new Error('_revMathBad のブロックが見つからない');
          const fnSrc = html.slice(mb0, mb1);
          const mk = new Function(fnSrc + ' return _revMathBad;')();
          const cases = [
            ['2+3=? の答え 6', {q:'2+3=?', ans:'6'}, true],
            ['2/3 ÷ 1/2=? の答え 6', {q:'2/3 ÷ 1/2=?', ans:'6'}, true],
            ['3 × 8 = ? の答え 24', {q:'3 × 8 = ?', ans:'24'}, null],
            ['0.01 × 50 = ? の答え 0.5', {q:'0.01 × 50 = ?', ans:'0.5'}, null],
            ['5 - 7 + 8 = ? の答え 6', {q:'5 - 7 + 8 = ?', ans:'6'}, null],
            ['7 × 7 ＝ ？ の答え 49', {q:'7 × 7 ＝ ？', ans:'49'}, null],
            ['あまりの連結仕様は検算しない', {q:'48÷7=? あまり?(5あまり2→52と入力)', ans:'66'}, null],
            ['筆算は検算しない', {q:'4 348', ans:'87'}, null],
            ['虫食いは検算しない', {q:'□ - 9 = 9', ans:'18'}, null],
            ['答えが文字なら検算しない', {q:'2+3=?', ans:'ご'}, null],
            ['式の途中の？は検算しない', {q:'3 × ？ ＝ 18', ans:'6'}, null],
          ];
          let bad = 0;
          for (const [label, x, want] of cases) {
            const got = mk(x);
            const ok = (want === true) ? (got === true) : (got !== true);
            console.log('  ' + (ok ? 'OK ' : 'NG ') + label + ' -> ' + got);
            if (!ok) bad++;
          }
          if (bad) throw new Error('検算の動きが想定と違う: ' + bad + ' 件');
          console.log('配信HTML ' + html.length + ' 文字。想定どおり。');
          JSEOF
          node /tmp/verify.mjs

      - name: 安全マーカーの生存確認
        run: |
          python3 - <<'PYEOF'
          import sys
          s = open('src/index.tsx', encoding='utf-8').read()
          h = open('public/index.html', encoding='utf-8').read()
          bad = False
          for k in ['cannot_trade_special', 'genElectric6', 'if (m.uncapturable) continue;',
                    '__WORLD_V3__', 'WARMIX', '_hash', 'registerMi(app)', 'registerQrHunt(app)',
                    'OCTGACHA_V1']:
              n = s.count(k)
              print('src  %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          for k in ['window.monSpriteHtml', 'monShinySet', 'WILDIMG_V2', 'pveGradeSelectorWrap',
                    '__REVIEW_BADANS_A1__', '__PVE_GRADE_LOCK_V1__', '二酸化炭素が発生']:
              n = h.count(k)
              print('html %-34s %d' % (k, n))
              if n < 1:
                  print('::error::安全マーカー %s が消えました' % k); bad = True
          if bad: sys.exit(1)
          PYEOF

      - name: record HEAD after
        run: |
          git --no-pager diff --stat
          wc -c public/index.html

      - name: commit and push
        run: |
          git add public/index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "REVIEW_MATH_V1: 復習に出す前に計算式を検算する（1か所・誤落とし0件を実測・チェーン${{ inputs.chain_before }}->据え置き）"
          git push origin HEAD:main
