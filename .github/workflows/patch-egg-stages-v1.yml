      - name: syntax check (src/index.tsx)
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/a.js --log-level=warning
          node --check /tmp/a.js
      - name: syntax check (haishin sareru HTML no script zenbu)
        run: |
          cat > /tmp/chk.js <<'JSEOF'
          const fs=require('fs'), vm=require('vm');
          const pairs=JSON.parse(fs.readFileSync('/tmp/egg_pairs.json','utf8'));
          let t=fs.readFileSync('public/index.html','utf8');
          for(const p of pairs){
            if(t.indexOf(p.a)===-1){ console.log('::error::anchor missing '+p.tag); process.exit(1); }
            t=t.replace(p.a, ()=>p.b);
          }
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m,i=0,bad=0,checked=0;
          while((m=re.exec(t))){
            i++; const attrs=m[1]||'', body=m[2]||'';
            if(/\bsrc\s*=/.test(attrs)) continue;
            if(/type\s*=\s*["']?(application\/json|text\/template|text\/x-)/i.test(attrs)) continue;
            if(!body.trim()) continue;
            checked++;
            try{ new vm.Script(body,{filename:'s'+i}); }
            catch(e){ bad++; console.log('::error::script #'+i+' ('+body.length+' chars): '+String(e.message).split('\n')[0]); }
          }
          const n=(t.match(/name:"/g)||[]).length;
          console.log('inline scripts checked='+checked+' syntax errors='+bad);
          if(bad){ process.exit(1); }
          const i2=t.indexOf('const STAGES = [');
          let d=0,end=-1;
          for(let k=t.indexOf('[',i2);k<t.length;k++){ const c=t[k]; if(c==='[')d++; else if(c===']'){d--; if(d===0){end=k;break;}} }
          const names=(t.slice(i2,end+1).match(/name:"/g)||[]).length;
          console.log('STAGES in served html = '+names);
          if(names!==15){ console.log('::error::STAGES must be 15'); process.exit(1); }
          console.log('OK');
          JSEOF
          sed -i 's/^          //' /tmp/chk.js
          node /tmp/chk.js
      - name: public/index.html wa kaenai
        run: if ! git diff --quiet -- public/index.html; then echo "::error::html changed"; exit 1; fi
      - name: commit and push
        run: |
          git add src/index.tsx scripts/patch_egg_stages_v1.py
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          git commit -m "EGGSTAGE_V1: タマゴバトル ステージ11〜15を開通（壁5面追加・末尾）＋難易度調整（st1〜3を易化／st11〜15の敵Lv・城HP・タマゴ上限を頭打ち／st11〜15は1週目から妨害コア） (チェーン132->137)"
          git push origin HEAD:main
