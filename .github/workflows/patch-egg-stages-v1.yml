name: patch-egg-stages-v1

# EGGSTAGE_V1 (2026-09-25)  タマゴバトル ステージ11〜15 を開通＋難易度調整
#   ステージ11〜15 は敵・ボス・報酬キャラ(1411〜1415)がすでに用意されていて、
#   STAGES に追加されていないために画面に出ていないだけ。壁の形を5面分追加すれば遊べる。
#   新しいキャラIDは1つも作らない（ID衝突の心配がない）。
#
#   ❗ STAGES への追加は必ず末尾。記録(player.eggStageClears)は並び順の番号で
#      保存されているので、途中に差し込むと全員の進捗がズレる。
#   ❗ public/index.html は 1バイトも変えない（下のステップで確認）。
#   ❗ progress（児童のデータ）には書き込まない。DDLもない。
#   ❗ 2026-09-25 の事故対策：配信されるHTMLの <script> 全部を構文チェックする。
#      このパッチは onclick を 1つも作らないが、それも点検する。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu'
        required: true
        default: '132'
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout -- .
