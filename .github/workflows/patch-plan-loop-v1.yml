name: patch-plan-loop-v1

# PLAN_LOOP_V1 (2026-09-25)
#   計画の輪を閉じる。切れていたのは「先生から子どもへ戻る矢印」。
#   1. 過去の週でも先生のコメントが読める（受け取りボタンは今週のぶんだけ＝二重取り防止）
#   2. 月曜に「💬 先生からのおへんじ（先週ぶん）」が一番上に出る
#   3. 先生の計画カードに「計画へひとこと」の欄を1本（既存APIを流用・新APIなし）
#   4. 気づく印：折りたたみ見出しの件数バッジ／子どもの赤いバッジに計画・振り返りを追加
#   読み取りはむしろ減る（weekly-plan-status は同じ表を3回引いていたのを1回に）。
#   配信チェーンは計画まわりを一切触っていないことを事前に確認ずみ。

on:
  workflow_dispatch:
    inputs:
      chain_before:
        description: 'chain kensuu (jissoku chi)'
        required: true
        default: '132'
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout -- .
      - name: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
      - name: record before
        run: sha256sum src/index.tsx public/index.html
      - name: apply (fail-closed)
        env:
          CHAIN_BEFORE: ${{ inputs.chain_before }}
