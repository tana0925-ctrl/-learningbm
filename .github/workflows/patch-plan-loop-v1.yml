        run: |
          python3 -c "import base64,lzma,os,io,re;b=re.sub(r'\s','',os.environ['B']);io.open('/tmp/p.py','wb').write(lzma.decompress(base64.b85decode(b)))"
          sha256sum /tmp/p.py
          python3 /tmp/p.py
      - name: syntax check (source)
        run: |
          npx --yes esbuild@0.21.5 src/index.tsx --outfile=/tmp/a.js --log-level=warning
          node --check /tmp/a.js
      - name: syntax check (student html scripts)
        run: |
          python3 - <<'PYEOF'
          import io,re,subprocess,sys
          s=io.open("public/index.html",encoding="utf-8").read()
          bad=0
          for i,b in enumerate(re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>",s,re.S)):
              p="/tmp/blk%d.js"%i; io.open(p,"w",encoding="utf-8").write(b)
              r=subprocess.run(["node","--check",p],capture_output=True,text=True)
              if r.returncode: bad+=1; print("::error::student script %d"%i, r.stderr[-300:])
          print("student script errors:", bad)
          sys.exit(1 if bad else 0)
          PYEOF
      - name: record after
        run: |
          git --no-pager diff --stat
          sha256sum src/index.tsx public/index.html
      - name: commit and push
        run: |
          git add src/index.tsx public/index.html scripts/patch_plan_loop_v1.py
          if git diff --cached --quiet; then echo "::error::no change"; exit 1; fi
          git commit -m "PLAN_LOOP_V1: 先生のコメントが週をまたいでも読める/月曜におへんじ枠/計画へひとことの欄/気づく印 (チェーン132->132)"
          git push origin HEAD:main
