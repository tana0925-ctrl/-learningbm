name: ZWAR_CASTLE_STAND_V1 ゾンビ襲来の城の攻防を山場にする（チェーン 98->101）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 作業ツリーを掃除
        run: git checkout -- .

      - name: 最新を取り込む
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - name: 本番の配信HTMLでアンカーを数える（GETのみ）
        run: |
          curl -sS --max-time 90 -o /tmp/prod.html https://learning-bm.pages.dev/ || echo 'FETCH FAILED'
          ls -l /tmp/prod.html || true
          python3 - << 'PYEOF'
          import importlib.util, os, sys
          p = '/tmp/prod.html'
          if not os.path.exists(p):
              print('WARN: honban HTML fetch failed (skip)')
              sys.exit(0)
          h = open(p, encoding='utf-8', errors='replace').read()
          sp = importlib.util.spec_from_file_location('zcs', 'scripts/patch_zwar_castle_stand_v1.py')
          m = importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)
          bad = False
          for nm, t in [('A', m.A_OLD), ('B', m.B_OLD), ('C', m.C_OLD)]:
              n = h.count(t)
              print('PROD', nm, n)
              if n > 1:
                  print('NG: prod anchor not unique', nm, n)
                  bad = True
          if bad:
              sys.exit(1)
          print('PROD ANCHOR CHECK DONE')
          PYEOF

      - name: 流す前にチェーンとアンカーを実測する
        run: |
          python3 - << 'PYEOF'
          import io, sys
          s = io.open('src/index.tsx', encoding='utf-8').read()
          h = io.open('public/index.html', encoding='utf-8').read()
          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          applied = '__ZWAR_CASTLE_STAND_V1__' in s
          print('chain before =', n, 'applied =', applied)
          if applied:
              if n != 101:
                  print('NG: 適用済みなのにチェーンが 101 件でない'); sys.exit(1)
          else:
              if n != 98:
                  print('NG: 流す前のチェーンが 98 件でない（並行セッションが増やした可能性）'); sys.exit(1)
              for label, t in [
                  ('bossMode', "  const bossMode = (i < 5) ? 'time' : ((i % 3 === 0) ? 'time' : (i % 3 === 1) ? 'wave' : 'castleHit');"),
                  ('enemyCastleHpMax', '  const enemyCastleHpMax = Math.round(600 + i*28 + diff*140);'),
                  ('spawnStopWave', '  const spawnStopWave = 20 + i;'),
              ]:
                  c = h.count(t)
                  if c != 1:
                      print('NG: public/index.html のアンカー %s が %d 件（期待 1）' % (label, c)); sys.exit(1)
              print('アンカーはすべて一意')
          PYEOF

      - name: パッチを適用（一致しなければ中止＝ファイルに触らない）
        run: python3 scripts/patch_zwar_castle_stand_v1.py

      - name: 冪等性の確認（2回目は何もしないこと）
        run: python3 scripts/patch_zwar_castle_stand_v1.py

      - name: 触ってはいけないファイルが無傷であること
        run: |
          git diff --name-only
          if git diff --name-only | grep -vE '^src/index\.tsx$' | grep -q .; then
            echo 'NG: src/index.tsx 以外が変わっている'; exit 1
          fi

      - name: 検証（番兵とは別の条件で確かめる）
        run: |
          python3 - << 'PYEOF'
          import importlib.util, subprocess, sys
          sp = importlib.util.spec_from_file_location('zcs', 'scripts/patch_zwar_castle_stand_v1.py')
          m = importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)

          s = open('src/index.tsx', encoding='utf-8').read()
          h = open('public/index.html', encoding='utf-8').read()
          corpus = m.read_corpus()

          i = s.index("app.get('/', async (c) => {")
          j = s.index("app.get('/logout'", i)
          n = s[i:j].count('.replace(')
          print('replace chain:', n)

          ok = True
          if n != 101:
              print('NG: chain', n, 'want 101'); ok = False

          for nm, want in [('_zcsA1', 3), ('_zcsB1', 3), ('_zcsC1', 3), ('_zcsA2', 2), ('_zcsB2', 2), ('_zcsC2', 2)]:
              if s.count(nm) != want:
                  print('NG:', nm, s.count(nm), 'want', want); ok = False

          if s.count("] anchor A not found") != 1 or s.count("] anchor B not found") != 1 or s.count("] anchor C not found") != 1:
              print('NG: console.error の skip 経路が3本そろっていない'); ok = False

          for nm, t in [('A', m.A_OLD), ('B', m.B_OLD), ('C', m.C_OLD)]:
              if h.count(t) != 1:
                  print('NG: public/index.html', nm, h.count(t)); ok = False
          if m.SENTINEL in h:
              print('NG: sentinel leaked into public/index.html'); ok = False
          if subprocess.call(['git', 'diff', '--quiet', '--', 'public/index.html']) != 0:
              print('NG: public/index.html was modified'); ok = False

          old = subprocess.check_output(['git', 'show', 'HEAD:src/index.tsx']).decode('utf-8')
          blk = m.build_block()
          if s.replace(blk, '', 1) != old:
              print('NG: something other than the added block changed'); ok = False
          else:
              print('OK: only the added block changed in src')

          for k in m.KEEP:
              if k not in corpus:
                  print('NG: marker lost', k); ok = False
              if s.count(k) != old.count(k):
                  print('NG: marker count changed', k, old.count(k), '->', s.count(k)); ok = False
          print('KEEP markers checked:', len(m.KEEP))

          if s.count('__zcsHasBoss ? 20 : 1') != 1:
              print('NG: 城HP20倍の条件が1件でない'); ok = False
          if s.count('WAR_PREF_BOSS[_n]') != 1:
              print('NG: ボス判定が1件でない'); ok = False

          for k in ('ensureDefenseTables()', 'DEFENSE_BASE_HP = 380', 'DEFENSE_WIN_COINS = 20', 'defStageEnemies('):
              if s.count(k) != old.count(k):
                  print('NG: defense marker changed', k, old.count(k), '->', s.count(k)); ok = False

          if not ok:
              sys.exit(1)
          print('VERIFY OK')
          PYEOF

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ビルドが通ることを確認
        run: |
          npm ci
          npm run build
          git checkout -- dist 2>/dev/null || true
          git clean -fdq dist 2>/dev/null || true
          echo '--- git status ---'
          git status --porcelain

      - name: コミットして push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/index.tsx; then
            echo 'no change (already applied)'; exit 0
          fi
          git add src/index.tsx
          git commit -m 'ZWAR_CASTLE_STAND_V1: zombie war castle stand (bossMode=castleHit / boss-pref castle HP x20 / spawnStopWave x0.2) chain 98->101'
          git pull --rebase origin main
          git push origin HEAD:main
