name: 防衛戦を12:30に自動でおこす・配線（DEF_AUTO_RESOLVE_V1）

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: パッチ前の src/index.tsx を控える（手で数えた点検をしない）
        run: |
          git show HEAD:src/index.tsx > /tmp/index.before.tsx
          wc -c /tmp/index.before.tsx

      - name: 新しいファイルがあることを確かめる（無ければ中断）
        run: |
          test -f src/def_auto_resolve.ts || { echo "NG: src/def_auto_resolve.ts がありません"; exit 1; }
          grep -q "__DEF_AUTO_RESOLVE_V1__" src/def_auto_resolve.ts || { echo "NG: 番兵がありません"; exit 1; }

      - name: パッチ適用（あて先が1つでなければ src/index.tsx に触らない）
        run: python3 scripts/patch_def_auto_resolve_v1.py

      - name: 冪等の確認（2回流しても増えない）
        run: python3 scripts/patch_def_auto_resolve_v1.py

      - name: 防衛戦の4ファイルが1バイトも変わっていないこと
        run: |
          for f in src/def_engine.ts src/def_resolve.ts src/def_stage.ts src/def_dex.ts src/def_teacher_start.ts public/defense2.js; do
            if [ -f "$f" ]; then
              git diff --quiet -- "$f" || { echo "NG: $f が変わっています"; exit 1; }
              echo "OK(unchanged): $f"
            fi
          done

      - name: 前後を突き合わせる（チェーン104のまま・足しただけ）
        run: |
          python3 - << 'PYEOF'
          import io, sys

          def chain(s):
              i = s.index("app.get('/', async (c) => {")
              j = s.index("app.get('/logout'", i)
              return s[i:j].count(".replace(")

          before = io.open("/tmp/index.before.tsx", encoding="utf-8").read()
          after  = io.open("src/index.tsx", encoding="utf-8").read()
          cb, ca = chain(before), chain(after)
          print("chain before/after:", cb, ca)
          ok = True
          if cb != 104:
              print("NG: パッチ前のチェーンが104ではありません:", cb); ok = False
          if ca != cb:
              print("NG: チェーンが変わりました"); ok = False

          for k in ["from './def_auto_resolve'",
                    "registerDefAutoResolve(app, {",
                    "defAutoResolveHook(c.env, st, classId)",
                    "var _defTsLast = 0;",
                    "_arNow - _defTsLast > 60000",
                    "visibilitychange",
                    'id="defHealthBox"',
                    "async function loadDefHealth(){"]:
              nb, na = before.count(k), after.count(k)
              print("  %-42s before=%d after=%d" % (k[:42], nb, na))
              if nb != 0 or na != 1:
                  print("   NG:", k); ok = False

          for k in ["app.post('/api/defense/resolve'",
                    "app.get('/api/defense/status'",
                    "app.post('/api/defense/entry'",
                    "registerDefTeacherStart(app, {"]:
              nb, na = before.count(k), after.count(k)
              print("  %-42s before=%d after=%d" % (k[:42], nb, na))
              if nb != 1 or na != 1:
                  print("   NG:", k); ok = False

          bl = before.split("\n")
          al = set(after.split("\n"))
          miss = [x for x in bl if x.strip() and x not in al]
          print("消えた行:", len(miss))
          for x in miss:
              print("   -", x[:140])
          if len(miss) != 1 or "_defTsFired = st.event_key;" not in miss[0]:
              print("NG: 消えてよい行は _defTsFired の1行だけです"); ok = False

          print("行数:", len(bl), "->", len(after.split("\n")))
          sys.exit(0 if ok else 1)
          PYEOF

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 本番と同じビルドが通ることを先に確かめる（通らなければコミットしない）
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/index.tsx
          if git diff --cached --quiet; then
            echo "変更なし（すでにあたっています）"
          else
            git commit -m "DEF_AUTO_RESOLVE_V1: 先生が画面を開いていなくても12:30に決戦がおきる（チェーン104->104・児童の戦闘エンジンは無変更）"
            git push
          fi
