name: patch-nowunit-v1

# NOWUNIT_V1 📍 いまの単元（クラス×教科）を中心に、カルテの「えらべる3つの道」🅰🅱を作る
#  ・いまの単元の決め方：①先生が分析タブで選んだもの（教科ごとにプルダウン1つ・選ばなくてもよい・次に変えるまで有効）
#    ②⑥授業メモの「教科：単元」のいちばん新しい行（直近28日・アプリの単元名に照合できたときだけ）
#    ③クラスの3人以上がまとめて取り組んでいる単元（直近1週15問以上→直近2週30問以上）④算数は標準の進み方。
#  ・🅱つぎにすすむ＝いまの単元（十分ならその次）／🅰もう一度かためる＝いまの単元かその1つ前でまちがいが多いほう。
#    先週（自動）の🅰と同じなら別の候補へ。学年外・中学の単元は出さない。差しかえ・来週やってみたいこと・どう思う？は今まで通り先。
#  ・💡わけに「いま 授業で やっている『〇〇』」。阪神マンの対話の候補・月曜の計画は保存したおすすめをそのまま使うので同じ単元になる。
#  ・先生画面：分析タブに「📍 いまの単元」（どこから決まったかを小さく表示）、🧭確認パネルにも1行。
#  ・変更: public/karte-michi.js（v=3）・src/index.tsx（karte-guide に材料を足す・POST now-unit）・migrations/0048（本番には先に流してある）
#  ・テスト：coin_ledger 58/58（新2件）＋ viewas 14/14 ＋ nowunit 10/10。最後に deploy.yml を起動する。

