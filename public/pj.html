<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>先生PJ 野球・サッカー</title>
<style>
  /* ⚾⚽ __PJ_V1__ 先生PJ。絵は つかわない（重くしない）。データは ひつような ぶんだけ とりにいく。 */
  :root { --bg:#f0fdf4; --card:#fff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --acc:#059669; --acc2:#047857; --warn:#f59e0b; --hot:#ea580c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:linear-gradient(135deg,#065f46,#059669); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; min-width:180px; }
  header a { color:#fff; font-weight:700; text-decoration:none; background:rgba(255,255,255,.18); border-radius:10px; padding:5px 10px; font-size:13px; }
  .coins { background:#fef3c7; color:#92400e; border-radius:999px; padding:4px 12px; font-weight:900; font-size:14px; }
  .test { background:#fff7ed; border-bottom:2px dashed #fb923c; padding:8px 14px; font-size:13px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .test b { color:#c2410c; }
  .wrap { max-width:1040px; margin:0 auto; padding:14px 18px 60px; }
  @media (min-width:700px) { .tabs button { font-size:17px; padding:13px 8px; } .row { padding:10px 6px; } .btn.sm { padding:7px 12px; font-size:14px; } }
  .tabs { display:flex; gap:6px; margin:4px 0 12px; }
  .tabs button { flex:1; min-width:0; white-space:nowrap; border:2px solid var(--line); background:#fff; border-radius:12px; padding:10px 6px; font-weight:900; font-size:15px; cursor:pointer; color:var(--sub); }
  .tabs button.on { border-color:var(--acc); color:var(--acc2); background:#ecfdf5; }
  .btn { border:0; border-radius:12px; padding:10px 16px; font-weight:900; font-size:15px; cursor:pointer; background:var(--acc); color:#fff; }
  .btn:disabled { background:#9ca3af; cursor:default; }
  .btn.sub { background:#fff; color:var(--ink); border:1.5px solid #d1d5db; font-weight:700; }
  .btn.sm { padding:5px 10px; font-size:12.5px; border-radius:9px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .scout { text-align:center; padding:18px 14px; }
  .scout .big { font-size:18px; padding:14px 22px; }
  .note { color:var(--sub); font-size:13px; line-height:1.7; }
  .row { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px dotted var(--line); }
  .row:last-child { border-bottom:0; }
  .row .nm { flex:1; min-width:0; }
  .row .nm b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .nm span { color:var(--sub); font-size:12px; }
  .left { font-weight:900; border-radius:999px; padding:3px 10px; font-size:12.5px; background:#ecfdf5; color:var(--acc2); white-space:nowrap; }
  .left.y { background:#fef9c3; color:#854d0e; }
  .left.o { background:#ffedd5; color:#c2410c; }
  .star { color:#f59e0b; letter-spacing:-1px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .zi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 10px; cursor:pointer; font-size:13px; }
  .zi b { display:block; font-size:14px; }
  .tag { display:inline-block; font-size:11px; border-radius:6px; padding:1px 6px; margin-right:3px; font-weight:700; }
  .tag.h { background:#ede9fe; color:#6d28d9; }
  .tag.t { background:#dcfce7; color:#166534; }
  .filters { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .filters button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:4px 12px; cursor:pointer; font-weight:700; }
  .filters button.on { border-color:var(--acc); color:var(--acc2); background:#ecfdf5; }
  .ov { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:20; display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; overflow:auto; }
  .ov .in { background:#fff; border-radius:18px; max-width:520px; width:100%; padding:16px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .card h2 { margin:2px 0 2px; font-size:22px; }
  .card .meta { color:var(--sub); font-size:13px; line-height:1.7; }
  .bars { display:grid; grid-template-columns:auto 1fr auto; gap:4px 8px; align-items:center; margin:8px 0; font-size:13px; }
  .bar { height:9px; background:#e5e7eb; border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#34d399,#059669); }
  .bio { background:#f8fafc; border-radius:10px; padding:8px 10px; font-size:14px; line-height:1.8; margin-top:8px; }
  .kind { font-weight:900; font-size:16px; margin-bottom:8px; color:var(--acc2); }
  .posg { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .posg [data-pos=MG] { background:#7c2d12 !important; }
  .posg .btn { padding:16px 6px; font-size:17px; }
  .posg small { display:block; font-size:11.5px; font-weight:700; opacity:.9; margin-top:3px; }
  @media (max-width:600px) { .posg { grid-template-columns:1fr 1fr; } }
  .lvg { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; margin:8px 0; font-size:13px; }
  .lvg i { color:#f59e0b; font-style:normal; letter-spacing:1px; }
  .field { position:relative; width:100%; max-width:620px; margin:6px auto 0; aspect-ratio: 1 / 0.95; background:radial-gradient(circle at 50% 100%, #c08a52 0 30%, transparent 30.5%), radial-gradient(circle at 50% 95%, #3f9a55 0 75%, #2d7d44 75.5%); border-radius:14px; overflow:hidden; border:3px solid #e5f4ea; }
  .field .fd { position:absolute; left:50%; top:64%; width:36%; aspect-ratio:1; transform:translate(-50%,-50%) rotate(45deg); border:3px solid rgba(255,255,255,.75); background:#c9935b; }
  .field .fm { position:absolute; left:50%; top:62%; width:7%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; background:#d9a46c; border:2px solid rgba(255,255,255,.6); }
  .row.bo .no { width:42px; font-size:20px; } .row.bo .no small { font-size:11px; }
  .posb { background:#1d4ed8; color:#fff; font-weight:900; border-radius:8px; padding:4px 8px; font-size:14px; white-space:nowrap; }
  .row.bo .nm > span { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .pitch { position:relative; width:100%; max-width:620px; margin:6px auto 0; aspect-ratio: 68 / 88; background:repeating-linear-gradient(180deg,#2f8f4e 0 10%,#2a8447 10% 20%); border-radius:14px; border:3px solid #e5f4ea; overflow:hidden; }
  .pitch .pl1 { position:absolute; left:0; right:0; top:50%; border-top:2px solid rgba(255,255,255,.55); }
  .pitch .pl2 { position:absolute; left:50%; top:50%; width:22%; aspect-ratio:1; transform:translate(-50%,-50%); border:2px solid rgba(255,255,255,.55); border-radius:50%; }
  .pitch .pl3 { position:absolute; left:28%; right:28%; bottom:0; height:13%; border:2px solid rgba(255,255,255,.55); border-bottom:0; }
  .pm { position:absolute; transform:translate(-50%,-50%); background:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; width:110px; padding:0; font:inherit; }
  .pm .dot { width:44px; height:44px; border-radius:50%; border:3px solid #fff; color:#fff; font-weight:900; font-size:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .pm .pn { margin-top:2px; color:#fff; font-weight:800; font-size:12.5px; text-shadow:0 1px 3px rgba(0,0,0,.7); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pm .pp { color:#d1fae5; font-size:11px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  @media (max-width:600px) { .pm { width:76px; } .pm .dot { width:34px; height:34px; font-size:13px; } .pm .pn { font-size:11px; max-width:76px; } }
  .slotg { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (min-width:900px) { .slotg { grid-template-columns:1fr 1fr 1fr; } }
  .slotc { position:relative; text-align:left; background:#fff; border:1.5px solid #e5e7eb; border-radius:14px; padding:12px 34px 12px 14px; cursor:pointer; min-height:72px; display:flex; flex-direction:column; gap:2px; font:inherit; color:inherit; }
  .slotc .sl { font-size:13px; color:#6b7280; font-weight:700; }
  .slotc b { font-size:16px; } .slotc b.emp { color:#1f2937; }
  .slotc .ss { font-size:12px; color:#6b7280; }
  .slotc i { position:absolute; right:12px; top:50%; transform:translateY(-50%); font-style:normal; font-size:22px; color:#92400e; }
  .pkq { width:100%; font-size:16px; padding:10px 12px; border:1.5px solid #d1d5db; border-radius:12px; margin-top:10px; }
  .pkc { border:1.5px solid #e5e7eb; border-radius:14px; padding:10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .pkc.cur { border-color:#059669; background:#ecfdf5; }
  .pkc .pick { color:#92400e; font-weight:900; white-space:nowrap; }
  .ovb { border:2px solid #e11d48; color:#e11d48; border-radius:8px; padding:0 6px; font-weight:900; }
  .gchs { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .gch { font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:3px; }
  .gch b { color:#fff; border-radius:5px; padding:0 5px; font-size:12px; }
  .gch.t { background:#eff6ff; color:#1d4ed8; border-radius:6px; padding:1px 6px; }
  .row.od select { min-height:40px; font-size:15px; border:1.5px solid #d1d5db; border-radius:9px; padding:4px 6px; background:#fff; max-width:100%; }
  .row.od .no { width:26px; text-align:center; font-size:17px; color:#047857; }
  .row.od .mv { display:flex; gap:3px; }
  .lgt { width:100%; border-collapse:collapse; margin:8px 0; font-size:14px; }
  .lgt th, .lgt td { padding:6px 4px; border-bottom:1px solid #e5e7eb; text-align:center; }
  .lgt td:nth-child(2) { text-align:left; font-weight:700; }
  .lgt tr.me td { background:#ecfdf5; }
  .lgday { margin-top:10px; } .lgday > b { display:block; color:#047857; margin-bottom:2px; }
  .lgm.mine { background:#fffbeb; border-radius:10px; }
  .lgs { font-size:17px; white-space:nowrap; margin:0 6px; }
  .lvg2 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:420px; margin:0 auto; }
  .spbar { display:flex; align-items:center; gap:10px; color:#fff; border-radius:12px; padding:8px 12px; margin-bottom:10px; }
  .spbar b { flex:1; font-size:18px; }
  .mk2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .mk2 button { border:0; border-radius:16px; padding:22px 12px; font-size:19px; font-weight:900; color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.18); }
  .mk2 small { display:block; font-size:13px; font-weight:700; opacity:.9; margin-top:4px; }
  #mkv { position:fixed; inset:0; z-index:30; background:#0f172a; display:flex; flex-direction:column; }
  #mkv .bar { flex:0 0 auto; min-height:52px; display:flex; align-items:center; gap:10px; padding:8px 12px; background:#065f46; color:#fff; }
  #mkv .bar b { flex:1; font-size:16px; }
  #mkv iframe { flex:1; width:100%; border:0; background:#fff; }
  #mkv .load { position:absolute; inset:52px 0 0 0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; text-align:center; line-height:1.9; padding:20px; }
  .msg { text-align:center; padding:40px 10px; font-size:16px; line-height:1.9; }
  @keyframes pop { 0% { transform:scale(.7) rotateY(80deg); opacity:0 } 100% { transform:none; opacity:1 } }
  .pop { animation: pop .45s ease-out; }
</style>
</head>
<body>
<header>
  <h1>⚾⚽ 先生PJ　野球・サッカー人気アップ</h1>
  <span class="coins" id="coins">💰 …</span>
  <a href="/">← アプリへ もどる</a>
</header>
<div id="testBar" class="test" style="display:none"></div>
<div class="wrap" id="main"><div class="msg">よみこみ中…</div></div>
<div id="ov"></div>
<script>
(function () {
  'use strict';
  var S = null, TAB = 'scout', ZF = '', ZP = 0, ZITEMS = [], busy = false;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(path, body) {
    var o = { credentials: 'same-origin', cache: 'no-store' };
    if (body !== undefined) { o.method = 'POST'; o.headers = { 'content-type': 'application/json' }; o.body = JSON.stringify(body || {}); }
    return fetch(path, o).then(function (r) { return r.json().catch(function () { return { ok: false, error: 'net' }; }); }).catch(function () { return { ok: false, error: 'net' }; });
  }
  function md(dk) { var p = String(dk || '').split('-'); return p.length < 3 ? '' : Number(p[1]) + '/' + Number(p[2]); }
  function stars(n) { return '<span class="star">' + '★★★'.slice(0, n || 1) + '</span>'; }
  function icon(p) { return p && p.s === 'sc' ? '⚽' : '⚾'; }
  function sub(p) {
    if (!p) return '';
    if (p.s === 'sc') return [p.cn, p.cl].filter(Boolean).join('・');
    return p.y + '年 ' + (p.hp ? '助っ人' : p.tm);
  }

  // ---------- 選手カード ----------
  var AB = { velo: ['球速', 165, 'km/h'], ctrl: ['コントロール', 100], stam: ['スタミナ', 100], meet: ['ミート', 100], power: ['パワー', 100], run: ['走力', 100], arm: ['肩の強さ', 100], field: ['守備', 100],
    sho: ['シュート', 100], pas: ['パス', 100], dri: ['ドリブル', 100], spd: ['スピード', 100], phy: ['フィジカル', 100], def: ['守備', 100], gk: ['キーパー', 100] };
  function bars(ab) {
    if (!ab) return '';
    var h = '<div class="bars">';
    Object.keys(ab).forEach(function (k) {
      var a = AB[k]; if (!a) return;
      var v = Number(ab[k]) || 0, w = k === 'velo' ? Math.max(0, Math.min(100, (v - 120) / (a[1] - 120) * 100)) : Math.max(0, Math.min(100, v / a[1] * 100));
      h += '<span>' + a[0] + '</span><div class="bar"><i style="width:' + w.toFixed(0) + '%"></i></div><span>' + (k === 'velo' ? v + 'km/h' : '') + '</span>';
    });
    return h + '</div>';
  }
  function record(p) {
    if (p.s === 'sc') {
      var t = [];
      if (p.cp != null) t.push('代表 ' + p.cp + '試合 ' + (p.gl || 0) + '点');
      if (p.tr && p.tr.length) t.push('出た大会：' + p.tr.join('、'));
      return t.length ? '<div class="meta">📊 ' + esc(t.join(' ／ ')) + '</div>' : '';
    }
    var k = p.pk;
    if (k) {
      var s = (k['年度'] || '') + '年' + (k['所属球団'] ? '（' + k['所属球団'] + '）' : '') + '：';
      if (k['登板'] != null) s += (k['勝利'] || 0) + '勝' + (k['敗北'] || 0) + '敗' + (k['セーブ'] ? ' ' + k['セーブ'] + 'セーブ' : '') + (k['防御率'] != null ? ' 防御率' + k['防御率'] : '') + (k['三振'] != null ? ' ' + k['三振'] + '奪三振' : '');
      else s += '打率' + String(k['打率'] != null ? k['打率'] : '-').replace(/^0\./, '.') + ' ' + (k['本塁打'] || 0) + '本塁打 ' + (k['打点'] || 0) + '打点' + (k['盗塁'] ? ' ' + k['盗塁'] + '盗塁' : '');
      return '<div class="meta">📊 いちばん かつやくした年 — ' + esc(s) + '</div>';
    }
    if (p.pkt) return '<div class="meta">📊 ' + esc(p.pkt) + '</div>';
    return '';
  }
  function mgrCard(p, extra) {
    var h = '<div class="card pop">' + (extra || '') + '<div class="meta">🎩 ' + (p.s === 'bbm' ? '野球の 監督' : 'サッカーの 監督') + (p.ty ? '・' + esc(p.ty) : '') + '</div><h2>' + esc(p.n) + '</h2>';
    if (p.cn) h += '<div class="meta">' + esc(p.cn) + '</div>';
    if (p.tm) h += '<div class="meta">📋 ' + esc(p.tm) + '</div>';
    if (p.lv && p.lv.length) h += '<div class="lvg">' + p.lv.map(function (x) { return '<span>' + esc(x[0]) + '</span><i>' + '★★★★★'.slice(0, Math.max(0, Math.min(5, Number(x[1]) || 0))) + '<span style="color:#e5e7eb">' + '★★★★★'.slice(0, 5 - Math.max(0, Math.min(5, Number(x[1]) || 0))) + '</span></i>'; }).join('') + '</div>';
    if (p.tr && p.tr.length) h += '<div class="meta">🏆 ' + esc(p.tr.join('、')) + '</div>';
    if (p.ds) h += '<div class="bio">' + esc(p.ds) + '</div>';
    return h + '</div>';
  }
  function card(p, extra) {
    if (!p) return '<div class="note">選手の データが 見つかりませんでした。</div>';
    if (p.s === 'bbm' || p.s === 'scm') return mgrCard(p, extra);
    var m = [];
    m.push(icon(p) + ' ' + esc(p.pos || ''));
    if (p.s === 'sc') { if (p.en) m.push(esc(p.en)); if (p.y) m.push(esc(p.y) + '年ごろ かつやく'); if (p.h) m.push(p.h + 'cm'); if (p.ft) m.push(esc(p.ft)); }
    else {
      m.push(esc(p.y) + '年 ' + (p.hp ? '外国人選手（助っ人）' : esc(p.tm) + (p.dr ? '・ドラフト' + esc(p.dr) : '')));
      if (p.bt) m.push(esc(p.bt)); if (p.h) m.push(p.h + 'cm' + (p.w ? ' ' + p.w + 'kg' : ''));
      if (p.pf) m.push(esc(p.pf) + '出身'); if (p.sch) m.push(esc(p.sch)); if (p.bd) m.push(esc(p.bd) + '生まれ');
      if (p.pt && p.pt.length) m.push('変化球：' + esc(p.pt.join('・')));
    }
    var h = '<div class="card pop">' + (extra || '') + stars(p.st) + '<h2>' + esc(p.n) + '</h2>'
      + '<div class="meta">' + (p.s === 'sc' && p.cn ? esc(p.cn) + (p.cl ? '・' + esc(p.cl) : '') + '<br>' : '') + m.join('　') + '</div>'
      + bars(p.ab) + record(p);
    if (p.bio) h += '<div class="bio">' + esc(p.bio) + '</div>';
    return h + '</div>';
  }
  function modal(html) {
    $('ov').innerHTML = '<div class="ov" id="ovBg"><div class="in">' + html + '<div style="text-align:right;margin-top:12px"><button class="btn sub" id="ovX">とじる</button></div></div></div>';
    $('ovX').onclick = closeModal;
    $('ovBg').onclick = function (e) { if (e.target.id === 'ovBg') closeModal(); };
  }
  function closeModal() { $('ov').innerHTML = ''; }

  // ---------- 画面 ----------
  //  PJ_SPORTMODE_V1 ひらいたら まず ⚾ 野球 か ⚽ サッカー を えらぶ。スカウト・チーム・図鑑は えらんだ ほうだけ。
  var SP = null;
  try { SP = localStorage.getItem('pjSport'); } catch (e) {}
  if (SP !== 'bb' && SP !== 'sc') SP = null;
  function isSp(k) { return SP === 'bb' ? k.charAt(0) === 'b' : k.charAt(0) !== 'b'; }
  var POSL = {
    bb: [['P', '⚾ 投手', 'ピッチャー'], ['C', '🧤 捕手', 'キャッチャー'], ['IF', '🏃 内野手', '一塁・二塁・三塁・ショート'], ['OF', '🌳 外野手', 'レフト・センター・ライト'], ['MG', '🎩 監督', '引退しない']],
    sc: [['GK', '🧤 GK', 'ゴールキーパー'], ['DF', '🛡 DF', 'ディフェンダー'], ['MF', '🎯 MF', 'ミッドフィールダー'], ['FW', '⚡ FW', 'フォワード'], ['MG', '🎩 監督', '引退しない']]
  };
  function myRoster() { return S.roster.filter(function (r) { return isSp(r.k); }); }
  function spName() { return SP === 'bb' ? '⚾ 野球' : '⚽ サッカー'; }

  function render() {
    if (!S) return;
    $('coins').textContent = '💰 ' + S.coins + (S.test ? '（ためし）' : '');
    if (S.test) {
      var tb = $('testBar'); tb.style.display = '';
      tb.innerHTML = '<b>🧪 先生の ためしモード</b><span>本物のコインは つかいません。きょう＝' + esc(md(S.today)) + (S.school ? '（学校の日）' : '（休み）') + '</span>'
        + '<button class="btn sm sub" data-t="day1">1日 すすめる</button><button class="btn sm sub" data-t="day5">5日 すすめる</button>'

    }
    step();
  }

  function start() {
    api('/api/pj/state').then(function (d) {
      if (d && d.ok) { S = d; render(); showNews(); return; }
      var e = d && d.error;
      if (e === 'import') { if (d.test) runImport(d.parts); else $('main').innerHTML = '<div class="msg">いま じゅんびちゅうだよ。また あとで ひらいてね。</div>'; return; }
      var m = e === 'login' ? 'ログインしてから ひらいてね。<br><a href="/">アプリへ</a>'
        : e === 'plan' ? '📝 今週の 学習計画が 先生に 承認されたら つかえるよ。<br>学習計画を 出して、先生の OK を もらおう！'
        : e === 'off' ? 'いまは つかえません。'
        : '読みこめませんでした。もう一度 ひらいてね。';
      $('main').innerHTML = '<div class="msg">' + m + '</div>';
      $('coins').style.display = 'none';
    });
  }
  start();
})();
</script>
</body>
</html>
